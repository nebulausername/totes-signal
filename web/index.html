// =====================================================================
// Konto, Laeufe und Bestenliste
// =====================================================================
// Same-origin gegen /api/ auf totersignal.de. Bewusst KEINE Bibliothek: der
// gesamte Bedarf sind ein paar fetch()-Aufrufe, und diese Datei hat keinen
// Bundler.
//
// WICHTIG -- warum das im Portfolio-iframe nicht laeuft:
// Passkeys sind origin-gebunden, Cookies waeren dort Drittanbieter-Cookies
// (Safari blockiert sie, Firefox/Chrome partitionieren sie), und localStorage
// ist ebenfalls partitioniert. Das ist nicht reparierbar, sondern eine
// Eigenschaft der Einbettung. Da die Datei byte-identisch gespiegelt wird,
// ist die Loesung eine Laufzeitpruefung, keine zweite Build-Variante.
var TS_ORIGIN_OK = (location.hostname === 'totersignal.de' && window.top === window.self);

var TS_API = {
	base: '/api',
	_tok: null,          // Access-Token: NUR im Arbeitsspeicher, nie persistiert
	_exp: 0,

	async _refresh(){
		// Der anonyme Notanker aus localStorage: iOS Safari raeumt Cookies nach
		// sieben Tagen ohne Interaktion ab, und ein anonymer Spieler haette dann
		// keinen Weg zurueck zu seinen Bestwerten.
		var rt = null;
		try { rt = localStorage.getItem('ts_rt_anon'); } catch(e){}
		var r = await fetch(this.base + '/auth/refresh', {
			method: 'POST', credentials: 'same-origin',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(rt ? { refresh_token: rt } : {})
		});
		if (!r.ok) throw new Error('refresh ' + r.status);
		var j = await r.json();
		this._tok = j.access_token;
		this._exp = Date.now() + (j.expires_in - 60) * 1000;
		if (j.refresh_token) { try { localStorage.setItem('ts_rt_anon', j.refresh_token); } catch(e){} }
		if (j.user) this.meineId = j.user.id;
		return j;
	},

	async token(){
		if (this._tok && Date.now() < this._exp) return this._tok;
		await this._refresh();
		return this._tok;
	},

	async call(pfad, opt){
		opt = opt || {};
		// Content-Type NUR mit Rumpf. Fastify weist eine Anfrage ab, die
		// application/json ankuendigt und nichts mitschickt ("Body cannot be
		// empty when content-type is set") -- ein DELETE ohne Rumpf waere
		// damit zuverlaessig 400 geworden. Am 2026-08-29 an der Live-API
		// nachgemessen, bevor es hier landete.
		var kopf = Object.assign({}, opt.headers || {});
		if (opt.body !== undefined && kopf['Content-Type'] === undefined)
			kopf['Content-Type'] = 'application/json';
		if (opt.auth !== false) kopf.Authorization = 'Bearer ' + await this.token();
		var r = await fetch(this.base + pfad, {
			method: opt.method || 'GET', credentials: 'same-origin', headers: kopf,
			body: opt.body ? JSON.stringify(opt.body) : undefined
		});
		if (r.status === 204) return null;
		var j = await r.json().catch(function(){ return null; });
		if (!r.ok){
			var e = new Error((j && j.error && j.error.message) || ('HTTP ' + r.status));
			e.code = j && j.error && j.error.code; e.status = r.status;
			throw e;
		}
		return j;
	},

	meineId: null,
	hatKonto(){ try { return !!localStorage.getItem('ts_rt_anon'); } catch(e){ return false; } },

	// Der Deckname muss in die Engine, sonst steht im Spiel-Scoreboard weiter
	// "Ueberlebender". Aus JS lassen sich Cvars NICHT lesen, nur setzen -- die
	// Shell ist deshalb die Quelle der Wahrheit und schiebt den Namen bei
	// jedem Spielstart erneut nach (idempotent, wie die Helligkeit).
	//
	// Der Server liefert bereits eine ASCII-Fassung: die Spielschrift kann nur
	// 33..126, '|' ist das Marker-Trennzeichen, '^' leitet Quake-Farbcodes ein.
	// Hier trotzdem noch einmal filtern -- was in einen Konsolenbefehl geht,
	// wird nicht auf gut Glueck durchgereicht.
	nameSetzen(ascii){
		var sauber = String(ascii || '').replace(/[^\x21-\x7e]/g, '').replace(/[|^"';]/g, '').slice(0, 20);
		if (sauber.length < 3) return;
		try { localStorage.setItem('ts_name_ascii', sauber); } catch(e){}
		// NIE aus einem Pointer-Handler heraus: tsCmd ruft window.focus(), und
		// das reisst einen aufliegenden Finger vom Joystick.
		tsCmd('seta name ' + sauber + '\n');
	},

	nameNachschieben(){
		try {
			var n = localStorage.getItem('ts_name_ascii');
			if (n) { this.nameSetzen(n); return; }
		} catch(e){}
		// Ohne Konto heisst JEDER "Ueberlebender" -- die Engine haengt dann
		// "(1)", "(2)" davor, um sie auseinanderzuhalten. In einer Runde mit
		// Freunden ist das die Stelle, an der niemand weiss, wer wer ist.
		// Ein eigener Name kostet nichts und wird vom Server-Decknamen
		// ueberschrieben, sobald ein Konto entsteht.
		var r = new Uint32Array(1);
		(window.crypto || window.msCrypto).getRandomValues(r);
		this.nameSetzen('Signal-' + (1000 + (r[0] % 9000)));
	},

	// Wird NUR aus einer ausdruecklichen Nutzerhandlung heraus gerufen. Genau
	// deshalb braucht das Spiel kein Cookie-Banner: die Speicherung ist dann
	// "unbedingt erforderlich" fuer einen vom Nutzer angeforderten Dienst
	// (§25 Abs. 2 Nr. 2 TDDDG). Wird das je auf "beim Seitenaufruf" geaendert,
	// ist ein Banner Pflicht.
	async kontoAnlegen(){
		// Erst fragen, dann senden. Bis 23.09.2026 stand `age_confirmed: true`
		// hart im Aufruf, ohne dass je jemand gefragt wurde.
		if (!(await TS_EINWILLIGUNG.frage())) throw new Error('abgelehnt');
		var r = await fetch(this.base + '/auth/anon', {
			method: 'POST', credentials: 'same-origin',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ age_confirmed: true, locale: LANG, privacy_version: TS_EINWILLIGUNG.FASSUNG })
		});
		if (!r.ok) throw new Error('anon ' + r.status);
		var j = await r.json();
		this._tok = j.access_token;
		this._exp = Date.now() + (j.expires_in - 60) * 1000;
		try { localStorage.setItem('ts_rt_anon', j.refresh_token); } catch(e){}
		if (j.user && j.user.display_name_ascii) this.nameSetzen(j.user.display_name_ascii);
		if (j.user) this.meineId = j.user.id;
		return j;
	}
};

// --- Ausgangs-Warteschlange -------------------------------------------------
// Ein fertiger Lauf darf NIE verloren gehen, auch nicht bei Funkloch oder
// wenn der Spieler die Bestenliste erst nach dem Sterben aktiviert.
// IndexedDB statt localStorage: localStorage ist synchron und wuerde auf dem
// Spielfaden ruckeln.
var TS_OUTBOX = {
	_db: null,
	async db(){
		if (this._db) return this._db;
		this._db = await new Promise(function(res, rej){
			var rq = indexedDB.open('ts_outbox', 1);
			rq.onupgradeneeded = function(){ rq.result.createObjectStore('jobs', { keyPath: 'id', autoIncrement: true }); };
			rq.onsuccess = function(){ res(rq.result); };
			rq.onerror = function(){ rej(rq.error); };
		});
		return this._db;
	},
	async _tx(modus, fn){
		var db = await this.db();
		return new Promise(function(res, rej){
			var t = db.transaction('jobs', modus), st = t.objectStore('jobs'), out;
			out = fn(st);
			t.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
			t.onerror = function(){ rej(t.error); };
		});
	},
	add(job){ return this._tx('readwrite', function(st){ return st.add(Object.assign({ at: Date.now(), versuche: 0 }, job)); }); },
	alle(){ return this._tx('readonly', function(st){ return st.getAll(); }); },
	del(id){ return this._tx('readwrite', function(st){ return st.delete(id); }); },
	async put(job){ return this._tx('readwrite', function(st){ return st.put(job); }); }
};

// --- Lauf-Verfolgung --------------------------------------------------------
var TS_RUN = {
	lauf: null,          // { run_id, run_token } vom Server
	seq: 0,              // Marker-Lauf-Nummer aus rstart
	cfg: null,           // { map_key, difficulty, gamemode, start_round, flags }
	beats: [],           // gepuffert, bis der Server eine Kennung geliefert hat
	gesendet: 0,
	meta: null,          // aus dmeta
	maxSpieler: 1,       // hoechste Spielerzahl waehrend des Laufs (aus TSUI:mp)
	letztesErgebnis: null,

	onStart: function(roh){
		// <mapkey>|<diff>|<mode>|<startround>|<flags>|<runseq>
		var p = String(roh).split('|');
		var seq = +p[5] || 0;
		if (seq === this.seq) return;          // derselbe Lauf, nichts zu tun
		this.seq = seq;
		this.lauf = null; this.beats = []; this.gesendet = 0; this.meta = null;
		this.maxSpieler = 1;
		this.cfg = {
			map_key: p[0] || 'unbekannt',
			difficulty: +p[1] || 0, gamemode: +p[2] || 0,
			start_round: +p[3] || 0, flags: +p[4] || 0
		};
		if (!TS_ORIGIN_OK || !TS_API.hatKonto()) return;   // ohne Konto kein Server-Lauf
		var self = this;
		TS_API.call('/runs/start', { method: 'POST', body: Object.assign({
			map_pretty: '', player_count: Math.max(1, this.maxSpieler || 1),
			aim_assist: 1, shell_build: TS_BUILD
		}, this.cfg) }).then(function(j){
			self.lauf = j;
			self.flushBeats();
		}).catch(function(){ /* offline: der Abschluss landet in der Warteschlange */ });
	},

	onBeat: function(roh){
		// <runde>|<score>|<kills>|<kopfschuesse>|<sekunden>
		var p = String(roh).split('|');
		this.beats.push({ seq: this.beats.length + 1, round: +p[0] || 0, score: +p[1] || 0,
			kills: +p[2] || 0, headshots: +p[3] || 0, secs: +p[4] || 0 });
		// Gebuendelt: alle drei Runden oder alle 45 s. Eine Anfrage pro Runde
		// waere auf dem Handy Verschwendung und kollidiert mit den
		// Asset-Ladevorgaengen beim Rundenwechsel.
		if (this.beats.length - this.gesendet >= 3) this.flushBeats();
	},

	flushBeats: function(){
		if (!this.lauf || this.beats.length <= this.gesendet) return;
		var offen = this.beats.slice(this.gesendet, this.gesendet + 20);
		var self = this, bis = this.gesendet + offen.length;
		TS_API.call('/runs/' + this.lauf.run_id + '/heartbeat', {
			method: 'POST', headers: { 'X-Run-Token': this.lauf.run_token },
			body: { beats: offen }
		}).then(function(){ self.gesendet = bis; }).catch(function(){ /* naechster Versuch */ });
	},

	// Erfolge, die das Spiel waehrend dieses Laufs gemeldet hat.
	erfolge: [],
	onAch: function(roh){
		var p = String(roh).split('|');
		var id = +p[0];
		if (!isFinite(id)) return;
		this.erfolge.push({ id: id, progress: +p[1] || 0 });
	},

	// Serverstand ins Spiel zurueckspielen. Ohne das poppt jeder laengst
	// verdiente Erfolg beim naechsten Besuch erneut auf -- die Ablage in
	// ach.dat ueberlebt im Emscripten-Dateisystem nicht zuverlaessig.
	erfolgeWiederherstellen: async function(){
		if (!TS_ORIGIN_OK || !TS_API.hatKonto()) return;
		try {
			var d = await TS_API.call('/profile/achievements');
			var befehle = d.defs.filter(function(x){ return x.unlocked_at || x.progress; })
				.map(function(x){ return 'ts_ach_set ' + x.id + ' ' + (x.unlocked_at ? 1 : 0) + ' ' + (x.progress || 0); });
			// Gebuendelt in einem cbufadd: jeder Aufruf zieht window.focus()
			// nach sich, und 42 davon wuerden einen aufliegenden Finger vom
			// Joystick reissen.
			if (befehle.length) tsCmd(befehle.join('\n') + '\n');
		} catch(e){}
	},

	onMeta: function(roh){
		// <cheat>|<diff>|<mode>|<startround>|<flags>|<mapkey>
		//
		// flags wurde bis 2026-08-29 NICHT gelesen -- und darin steckt Bit 3,
		// das der SERVER setzt, sobald mehr als ein Spieler dabei ist
		// (ts_flag_bits, server/main.qc). Ohne dieses Feld erreichte die
		// Koop-Kennung die API nie, und ein Vierer-Lauf konnte auf der
		// SOLO-Bestenliste landen. Der Wert kommt aus dem Spiel, nicht aus
		// der Shell -- er ist damit die vertrauenswuerdigere Quelle.
		var p = String(roh).split('|');
		this.meta = { cheat: p[0] === '1' ? 1 : 0,
			difficulty: +p[1] || 0, gamemode: +p[2] || 0,
			start_round: +p[3] || 0, flags: +p[4] || 0,
			map_key: p[5] || (this.cfg && this.cfg.map_key) };
	},

	// Wird aus TS_DEATH.setStats gerufen -- dort liegen alle Endwerte vor.
	abschliessen: function(st){
		if (!TS_ORIGIN_OK || !st) return;
		var koerper = {
			rounds: st.rounds, score: st.score, kills: st.kills, headshots: st.heads,
			downs: st.downs, revives: st.revs, secs: st.secs,
			difficulty: this.meta ? this.meta.difficulty : (this.cfg ? this.cfg.difficulty : 0),
			gamemode:   this.meta ? this.meta.gamemode   : (this.cfg ? this.cfg.gamemode : 0),
			map_key:    this.meta ? this.meta.map_key    : (this.cfg ? this.cfg.map_key : 'unbekannt'),
			cheat:      this.meta ? this.meta.cheat : 0,
			// Beides ENTSCHEIDET ueber die Wertung und wurde bisher nicht
			// gemeldet: die Shell schickte hart player_count 1, und flags kam
			// gar nicht an. Ein Koop-Lauf war damit von einem Solo-Lauf nicht
			// zu unterscheiden.
			flags:        this.meta ? this.meta.flags : (this.cfg ? this.cfg.flags : 0),
			player_count: Math.max(1, this.maxSpieler || 1)
		};
		var self = this;
		// Gemeldete Erfolge mitschicken. Der Server nimmt davon NUR die Art
		// 'ingame' an -- abgeleitete und Meta-Erfolge rechnet er selbst aus,
		// sonst waeren sie frei erfindbar.
		if (this.erfolge.length && TS_API.hatKonto()){
			TS_API.call('/profile/achievements/sync', {
				method: 'POST', body: { unlocked: this.erfolge }
			}).catch(function(){});
		}
		if (this.lauf){
			this.flushBeats();
			TS_API.call('/runs/' + this.lauf.run_id + '/finish', {
				method: 'POST', headers: { 'X-Run-Token': this.lauf.run_token }, body: koerper
			}).then(function(j){ self.letztesErgebnis = j; if (window.TS_BOARD) TS_BOARD.zeigeErgebnis(j); })
			  .catch(function(){ TS_OUTBOX.add({ art: 'finish', run: self.lauf, body: koerper }); });
		} else {
			// Kein Konto (oder Start war offline): Lauf aufheben. Aktiviert der
			// Spieler die Bestenliste im Todes-Bildschirm, wird er nachgereicht.
			TS_OUTBOX.add({ art: 'finish_offen', cfg: koerper, beats: this.beats.slice(0, 60) });
		}
	},

	// Nachreichen: laeuft beim Laden, bei "wieder online" und nach dem
	// Anlegen eines Kontos.
	nachreichen: async function(){
		if (!TS_ORIGIN_OK || !TS_API.hatKonto()) return;
		var jobs = [];
		try { jobs = await TS_OUTBOX.alle(); } catch(e){ return; }
		for (var i = 0; i < jobs.length; i++){
			var j = jobs[i];
			try {
				if (j.art === 'finish'){
					await TS_API.call('/runs/' + j.run.run_id + '/finish', {
						method: 'POST', headers: { 'X-Run-Token': j.run.run_token }, body: j.body });
				} else if (j.art === 'finish_offen'){
					// Start und Abschluss in einem: der Server hat hier keinen
					// eigenen Zeitanker und markiert solche Laeufe entsprechend.
					var neu = await TS_API.call('/runs/start', { method: 'POST', body: {
						map_key: j.cfg.map_key, difficulty: j.cfg.difficulty,
						gamemode: j.cfg.gamemode, player_count: 1, shell_build: TS_BUILD } });
					if (j.beats && j.beats.length)
						await TS_API.call('/runs/' + neu.run_id + '/heartbeat', {
							method: 'POST', headers: { 'X-Run-Token': neu.run_token },
							body: { beats: j.beats.slice(0, 20) } });
					await TS_API.call('/runs/' + neu.run_id + '/finish', {
						method: 'POST', headers: { 'X-Run-Token': neu.run_token }, body: j.cfg });
				}
				await TS_OUTBOX.del(j.id);
			} catch(e){
				j.versuche = (j.versuche || 0) + 1;
				// Nach zwoelf Versuchen aufgeben, aber NIE stillschweigend
				// wegwerfen -- der Spieler sieht es im Konto-Bereich.
				if (j.versuche >= 12) { await TS_OUTBOX.del(j.id); }
				else { await TS_OUTBOX.put(j); }
				break;   // Reihenfolge wahren
			}
		}
	}
};

// --- Bestenliste im Todes-Bildschirm ---------------------------------------
// Dritter Tab in der vorhandenen Leiste statt eines eigenen Overlays: er erbt
// Gestaltung, Tab-CSS und die 3,5-s-Einblendung, und er steht genau dort, wo
// ein Spieler nach dem Sterben ohnehin hinschaut.
var TS_BOARD = {
	fenster: 'all',
	// Solo oder Koop. Die Vorgabe kommt aus dem Lauf, der gerade zu Ende ging:
	// wer zu viert gespielt hat, will wissen, wo DIESE Runde steht -- und nicht
	// auf einer Liste suchen, auf der sie gar nicht stehen kann (0006). Der
	// Umschalter bleibt trotzdem da, weil Vergleichen dazugehoert.
	koop: false,
	spielerzahl: 0,        // 0 = alle Koop-Groessen zusammen
	vorgabeGesetzt: false,
	async laden(){
		var ziel = document.getElementById('dpage-rank');
		if (!ziel) return;
		if (!TS_ORIGIN_OK){
			ziel.innerHTML = '<div class="dfoot">' + T('rankFremd') + '</div>';
			return;
		}
		if (!TS_API.hatKonto()){
			ziel.innerHTML = '<div class="dfoot">' + T('rankAus') + '</div>' +
				'<div class="death-actions"><button type="button" class="play" id="rankAn">' + T('rankAnBtn') + '</button></div>';
			var b = document.getElementById('rankAn');
			if (b) b.addEventListener('click', async function(){
				b.textContent = '...';
				try {
					await TS_API.kontoAnlegen();
					await TS_RUN.nachreichen();
					TS_BOARD.laden();
				} catch(e){ b.textContent = T(e && e.message === 'abgelehnt' ? 'rankAnBtn' : 'rankFehler'); }
			});
			return;
		}
		ziel.innerHTML = '<div class="dfoot">' + T('rankLaedt') + '</div>';
		try {
			var karte = (TS_RUN.cfg && TS_RUN.cfg.map_key) || '*';
			// MIT Anmeldung anfragen: nur dann liefert der Server den
			// me-Block, also die eigene Zeile samt Platz -- auch wenn sie
			// weit ausserhalb der ersten zehn liegt.
			// Einmal je Todesbildschirm die Vorgabe aus dem Lauf uebernehmen.
			if (!this.vorgabeGesetzt){
				this.vorgabeGesetzt = true;
				var n = (window.TS_RUN && TS_RUN.maxSpieler) || 1;
				this.koop = n > 1;
				this.spielerzahl = this.koop ? Math.min(4, Math.max(2, n)) : 0;
			}
			var d = await TS_API.call('/leaderboard?metric=rounds&window=' +
				this.fenster + '&map=' + encodeURIComponent(karte) + '&limit=10' +
				(this.koop ? '&koop=1' + (this.spielerzahl ? '&spieler=' + this.spielerzahl : '') : ''));
			this.zeichnen(d);
		} catch(e){
			// Frueher endete es hier bei zwei Woertern ohne jede Handhabe: wer
			// einmal ein Funkloch erwischte, kam an seinen Platz nur ueber
			// einen Tab-Wechsel und zurueck. Der Knopf ist derselbe wie im
			// Zweig ohne Konto -- also .play in .death-actions (Footgun 14).
			ziel.innerHTML = '<div class="dfoot">' + T('rankFehler') + '</div>' +
				// .alt, nicht der rote Hauptknopf: sonst stehen drei leuchtende
				// Knoepfe untereinander und der Blick findet NOCHMAL nicht mehr.
				'<div class="death-actions"><button type="button" class="play alt" id="rankNeu">' + T('rankNochmal') + '</button></div>';
			var w = document.getElementById('rankNeu');
			if (w) w.addEventListener('click', function(){ TS_BOARD.laden(); });
		}
	},

	zeichnen: function(d){
		var ziel = document.getElementById('dpage-rank');
		if (!ziel) return;
		var e = (this.letztes && this.letztes.run) || null;
		var kopf = '';
		if (this.letztes){
			if (this.letztes.status === 'verified'){
				kopf = '<div class="dfoot">' + T('rankPlatz') + ' ' +
					(this.letztes.rank ? this.letztes.rank.map : '?') +
					' &middot; +' + this.letztes.xp_gained + ' XP</div>';
				// Frisch verdiente Erfolge sind der schoenste Moment nach dem
				// Sterben -- die gehoeren nach oben, nicht in ein Untermenue.
				// ... aber gedeckelt. Sechs frische Erfolge fuellten zwei volle
				// Zeilen ueber die ganze Breite und drueckten die Liste
				// darunter von fuenf sichtbaren Plaetzen auf drei. Zwei Namen
				// und eine Restangabe sagen dasselbe in einer Zeile: die
				// Erfolgsnamen sind im Mittel 14 und hoechstens 25 Zeichen lang
				// (server/data/erfolge.json), mit " (+100 XP)" passen zwei davon
				// in die 520-px-Zeile, drei nicht mehr.
				var ne = this.letztes.achievements_neu || [];
				if (ne.length){
					var zeig = ne.slice(0, 2).map(function(x){
						return TS_DEATH.strip(x.name) + ' (+' + x.xp + ' XP)'; });
					if (ne.length > zeig.length)
						zeig.push('+' + (ne.length - zeig.length) + ' ' + T('rankWeitere'));
					kopf += '<div class="dfoot neuerfolg">&#9733; ' + zeig.join(' &middot; ') + '</div>';
				}
			}
			else
				// Ehrlich benennen statt still verschweigen: ein markierter Lauf
				// ist nicht verloren, er wird nur geprueft.
				kopf = '<div class="dfoot">' + T(this.letztes.status === 'flagged' ? 'rankPruefung' : 'rankAbgelehnt') + '</div>';
		}
		// Der Umschalter gehoert AUCH in den leeren Fall: sonst landet man auf
		// einer noch leeren Koop-Liste und kommt ohne Tab-Wechsel nicht zurueck.
		var schalter = '<div class="rank-schalter">' +
			'<span class="dtab' + (this.koop ? '' : ' active') + '" id="rk-solo">' + T('rkSolo') + '</span>' +
			'<span class="dtab' + (this.koop && this.spielerzahl === 2 ? ' active' : '') + '" id="rk-k2">' + T('rkK2') + '</span>' +
			'<span class="dtab' + (this.koop && this.spielerzahl === 3 ? ' active' : '') + '" id="rk-k3">' + T('rkK3') + '</span>' +
			'<span class="dtab' + (this.koop && this.spielerzahl === 4 ? ' active' : '') + '" id="rk-k4">' + T('rkK4') + '</span>' +
			'</div>';

		if (!d.entries.length){
			ziel.innerHTML = kopf + schalter + '<div class="dfoot">' + T('rankLeer') + '</div>';
			this.schalterBinden();
			return;
		}
		// Der Server nennt die eigene Zeile ausdruecklich -- darauf verlassen
		// wir uns, statt sie ueber die Kennung zu erraten.
		var ich = (d.me && d.me.user_id) || TS_API.meineId;
		var liste = d.entries.slice();
		// Liegt die eigene Zeile ausserhalb der ersten zehn, unten anhaengen.
		// Ohne das sieht ein Spieler auf Platz 47 nur fremde Namen.
		var drin = ich && liste.some(function(x){ return x.user_id === ich; });
		var abgesetzt = false;
		if (d.me && !drin){ liste.push(d.me); abgesetzt = true; }

		var zeilen = liste.map(function(x, i){
			var eigen = ich && x.user_id === ich;
			// Trennlinie, damit klar ist: hier klafft eine Luecke in der Liste.
			var luecke = (abgesetzt && i === liste.length - 1) ? ' luecke' : '';
			return '<tr class="' + (eigen ? 'ich' : '') + luecke + '"><td>' + x.rank + '</td><td>' +
				TS_DEATH.strip(x.display_name) + '</td><td>' + x.rounds + '</td><td>' + x.score + '</td></tr>';
		}).join('');
		ziel.innerHTML = kopf + schalter +
			'<div class="rank-wrap"><div id="rank-liste"><table><thead><tr><th>#</th><th>' + T('colName') + '</th><th>' +
			T('colRound') + '</th><th>' + T('stPoints') + '</th></tr></thead><tbody>' +
			zeilen + '</tbody></table></div></div>';

		this.schalterBinden();

		var box = document.getElementById('rank-liste');
		if (!box) return;
		this.hoeheEinrasten(box);
		this.eigeneZeigen(box);
		this.rollhinweis(box);
	},

	schalterBinden: function(){
		var self = this;
		var setze = function(id, koop, n){
			var e = document.getElementById(id); if (!e) return;
			e.addEventListener('click', function(){
				self.koop = koop; self.spielerzahl = n; self.laden();
			});
		};
		setze('rk-solo', false, 0);
		setze('rk-k2', true, 2);
		setze('rk-k3', true, 3);
		setze('rk-k4', true, 4);
	},

	// Hoehe auf ganze Zeilen einrasten. Die frueher fest verdrahtete Deckelung
	// min(34vh,200px) kannte die Zeilenhoehe nicht: 27-px-Zeilen in einem
	// 200-px-Fenster ergaben sechs ganze und eine halbierte Zeile, und ein
	// aufgeschnittener Eintrag liest sich als Zeichenfehler.
	// Der Platz kommt jetzt aus der Tab-Seite selbst -- die ist seit dem
	// Spalten-Layout der nachgiebige Teil und laesst Kopf und Knopfreihe in
	// Ruhe.
	hoeheEinrasten: function(box){
		var kopf   = box.querySelector('thead');
		var zeilen = box.querySelectorAll('tbody tr');
		var seite  = document.getElementById('dpage-rank');
		if (!kopf || !zeilen.length || !seite) return;
		var kh = kopf.getBoundingClientRect().height;
		var zh = zeilen[0].getBoundingClientRect().height;
		if (zh <= 0) return;
		// Wird waehrend eines verborgenen Tabs gezeichnet (zeigeErgebnis kommt
		// mit dem Serverergebnis, moeglicherweise bevor jemand auf BESTENLISTE
		// tippt), ist clientHeight 0. Dann lieber gar nicht deckeln als auf zwei
		// Zeilen einrasten -- tab('rank') zeichnet ohnehin neu, sobald der
		// Schirm sichtbar ist.
		if (seite.clientHeight <= 0){ box.style.maxHeight = ''; return; }
		// Was die Seite hergibt, minus alles, was ueber der Liste steht
		// (Platzangabe, frische Erfolge) und minus der Tabellenkopf.
		//
		// Der Versatz MUSS aus den Rechtecken kommen, nicht aus offsetTop:
		// .rank-wrap ist position:relative und damit selbst der offsetParent,
		// box.offsetTop ist also immer 0. Mit dieser Null im Nenner wurde die
		// Liste um die Kopfzeilen zu hoch -- gemessen 21 px ohne und 42 px mit
		// frischen Erfolgen -- und ragte unten aus der Tab-Seite heraus. Die
		// Liste selbst schnitt dabei keine Zeile an, die SEITENKANTE schon;
		// ein Test, der nur die Liste befragt, sieht das nicht.
		var versatz = (box.getBoundingClientRect().top - seite.getBoundingClientRect().top) + seite.scrollTop;
		var frei = seite.clientHeight - versatz - kh;
		var n = Math.floor(frei / zh);
		// Untergrenze EINS, nicht zwei. "Unter zwei Zeilen ist es keine Liste
		// mehr" klang vernuenftig und war ein latenter Ueberlauf: passt nur
		// eine Zeile, erzwang die Zwei eine Hoehe GROESSER als der Platz, und
		// die Liste ragte unten aus der Tab-Seite -- abgeschnitten hat dann die
		// Seitenkante, nicht die Liste (Footgun 22). Sichtbar wurde das erst,
		// als der SOLO/KOOP-Umschalter 22 px vom Platz nahm; bei 390 px
		// Querformat mit frischen Erfolgen bleiben fuer die Liste nur rund 50.
		// Eine ganze Zeile mit Rollhinweis ist besser als zwei, von denen die
		// zweite ueber die Kante haengt.
		if (n < 1) n = 1;
		if (n >= zeilen.length){ box.style.maxHeight = ''; return; }   // passt ohnehin ganz
		// Die Kante an der ECHTEN Lage der ersten abgeschnittenen Zeile
		// ausrichten, nicht an kopf + n * zeilenhoehe. Bei
		// border-collapse:collapse teilen sich benachbarte Zeilen ihren Rand,
		// die gerundete Rechnung lag deshalb um Bruchteile daneben -- und ein
		// Bruchteil reicht, damit die naechste Zeile mit einem Haar
		// hereinragt und wie ein Zeichenfehler aussieht.
		box.style.maxHeight = (zeilen[n].offsetTop - box.offsetTop) + 'px';
	},

	// Die eigene Zeile ins Sichtfeld holen -- aber NUR, wenn sie sonst
	// ausserhalb laege. Vorher wurde immer zentriert, und bei Platz 3 schob das
	// den Ersten aus dem Bild: eine Bestenliste, deren oberste sichtbare Zeile
	// die Zwei ist, sieht kaputt aus (nachgemessen: scrollTop 21 bei Platz 3).
	// scrollTop von Hand statt scrollIntoView: letzteres scrollt AUCH alle
	// Vorfahren mit und schob dabei "SIGNAL VERLOREN" samt Platzangabe aus
	// dem Bild.
	eigeneZeigen: function(box){
		var eigene = box.querySelector('tr.ich');
		if (!eigene) return;
		var kh = (box.querySelector('thead') || { getBoundingClientRect: function(){ return { height: 0 }; } })
			.getBoundingClientRect().height;
		// offsetTop zaehlt ab .rank-wrap, nicht ab der Liste -- der Versatz
		// muss raus, sonst rollt die Liste um ihre eigene Oberkante zu weit.
		var oben  = eigene.offsetTop - box.offsetTop - box.scrollTop - kh;
		var unten = eigene.offsetTop - box.offsetTop - box.scrollTop + eigene.offsetHeight;
		if (oben >= 0 && unten <= box.clientHeight) return;   // schon im Bild
		box.scrollTop = Math.max(0, (eigene.offsetTop - box.offsetTop) - (box.clientHeight / 2) + (eigene.offsetHeight / 2));
	},

	// Weiche Kante, solange unterhalb noch etwas steht.
	rollhinweis: function(box){
		var wrap = box.parentNode;
		if (!wrap || !wrap.classList) return;
		var pruefen = function(){
			var mehr = box.scrollHeight - box.scrollTop - box.clientHeight > 2;
			wrap.classList.toggle('mehr', mehr);
		};
		box.addEventListener('scroll', pruefen);
		pruefen();
	},

	zeigeErgebnis: function(j){ this.letztes = j; this.laden(); }
};

// --- Einwilligung vor dem Konto ------------------------------------------
// Fragt EINMAL je Anlage. Ablehnen = kein Konto, kein Aufruf an den Server.
// FASSUNG muss zur Fassungsnummer in datenschutz.html passen.
var TS_EINWILLIGUNG = {
	FASSUNG: '1.1',
	frage: function(){
		var el = document.getElementById('einwui');
		if (!el) return Promise.resolve(false);
		return new Promise(function(fertig){
			var ja = document.getElementById('einw-ja'), nein = document.getElementById('einw-nein');
			var vorher = document.activeElement;
			var ende = function(ok){
				el.style.display = 'none';
				ja.removeEventListener('click', aufJa); nein.removeEventListener('click', aufNein);
				document.removeEventListener('keydown', aufTaste, true);
				if (vorher && vorher.focus) try { vorher.focus(); } catch(e){}
				fertig(ok);
			};
			var aufJa = function(e){ e.stopPropagation(); ende(true); };
			var aufNein = function(e){ e.stopPropagation(); ende(false); };
			var aufTaste = function(e){ if (e.key === 'Escape'){ e.stopPropagation(); e.preventDefault(); ende(false); } };
			ja.addEventListener('click', aufJa); nein.addEventListener('click', aufNein);
			document.addEventListener('keydown', aufTaste, true);
			// Klicks im Dialog duerfen weder das Gate starten noch das Spiel treffen.
			el.onclick = function(e){ e.stopPropagation(); };
			el.style.display = 'flex';
			setTimeout(function(){ try { ja.focus(); } catch(e){} }, 0);
		});
	}
};

// --- Konto- und Fortschrittsansicht --------------------------------------
// Erreichbar aus dem Zahnrad-Sheet (Touch) UND vom Start-Gate (Desktop) --
// sonst kaeme ein Desktop-Spieler nie an sein Konto, denn das Sheet gibt es
// dort nicht.
var TS_KONTO = {
	async zeigen(){
		var el = document.getElementById('accountui');
		if (!el) return;
		var gate = document.getElementById('mstart');
		el.classList.toggle('ueber-gate', !!(gate && gate.style.display && gate.style.display !== 'none'));
		el.style.display = 'flex';
		var ziel = document.getElementById('acc-inhalt');
		if (!TS_ORIGIN_OK){ ziel.innerHTML = '<p class="ts-sub">' + T('rankFremd') + '</p>'; return; }
		if (!TS_API.hatKonto()){
			ziel.innerHTML = '<p class="ts-sub">' + T('accAus') + '</p>' +
				'<div class="death-actions"><button type="button" class="play" id="acc-an">' + T('rankAnBtn') + '</button></div>';
			var b = document.getElementById('acc-an');
			if (b) b.addEventListener('click', async function(){
				b.textContent = '...';
				try { await TS_API.kontoAnlegen(); await TS_RUN.nachreichen(); TS_KONTO.zeigen(); }
				catch(e){ b.textContent = T(e && e.message === 'abgelehnt' ? 'rankAnBtn' : 'rankFehler'); }
			});
			return;
		}
		ziel.innerHTML = '<p class="ts-sub">' + T('rankLaedt') + '</p>';
		try {
			var mich = await TS_API.call('/auth/me');
			var erf  = await TS_API.call('/profile/achievements');
			this.zeichnen(mich, erf);
		} catch(e){
			ziel.innerHTML = '<p class="ts-sub">' + T('rankFehler') + '</p>';
		}
	},

	zeichnen: function(mich, erf){
		var u = mich.user, st = mich.stats;
		// Fortschritt bis zur naechsten Stufe. Die Kurve steht im Server
		// (ts.level_for_xp); hier wird nur ihre Umkehrung gebildet, damit der
		// Balken nicht luegt, falls die Kurve spaeter angepasst wird.
		var xpF = function(l){ return Math.ceil(Math.pow(Math.max(0, l - 1), 1 / 0.6) * 250); };
		var jetzt = xpF(u.level), naechst = xpF(u.level + 1);
		var anteil = naechst > jetzt ? Math.min(1, Math.max(0, (u.xp_total - jetzt) / (naechst - jetzt))) : 0;

		var chip = function(wert, text){
			return '<div class="acc-chip"><b>' + wert + '</b><span>' + text + '</span></div>';
		};

		var kachel = erf.defs.map(function(a){
			var auf = !!a.unlocked_at;
			// Unerreichbare ehrlich kennzeichnen statt sie als "noch offen"
			// auszugeben -- 19 der 42 haben schlicht keine Erkennungslogik.
			var zeichen = auf ? '\u2605' : (a.verfuegbar ? '\u2606' : '\u2013');
			var titel = TS_DEATH.strip(a.name_de) + (a.verfuegbar ? '' : ' \u2013 ' + T('accGesperrt'));
			return '<div class="acc-a ' + (auf ? 'auf' : 'zu') + '"><i>' + zeichen + '</i><div><b>' +
				titel + '</b><span>' + TS_DEATH.strip(a.desc_de) + '</span></div></div>';
		}).join('');

		document.getElementById('acc-inhalt').innerHTML =
			'<div class="acc-kopf"><span class="acc-name">' + TS_DEATH.strip(u.display_name) +
				'</span><span class="acc-lvl">' + T('accLevel') + ' ' + u.level + '</span></div>' +
			'<div class="acc-bar"><i style="width:' + Math.round(anteil * 100) + '%"></i></div>' +
			'<div class="ts-sub">' + u.xp_total + ' XP' +
				(naechst > jetzt ? ' \u00b7 ' + Math.max(0, naechst - u.xp_total) + ' ' + T('accBisLevel') : '') + '</div>' +
			'<h3>' + T('accStats') + '</h3><div class="acc-grid">' +
				chip(st.runs, T('accRuns')) +
				chip(st.best_round === null ? '\u2013' : st.best_round, T('accBestRound')) +
				chip(st.best_score === null ? '\u2013' : st.best_score, T('accBestScore')) +
				chip(erf.freigeschaltet + '/' + erf.erreichbar, T('accAch')) +
			'</div>' +
			'<h3>' + T('accAch') + '</h3><div class="acc-ach">' + kachel + '</div>';
	},

	schliessen: function(){
		var el = document.getElementById('accountui');
		if (el){ el.style.display = 'none'; el.classList.remove('ueber-gate'); }
	}
};
(function(){

// --- Einstellungen ---------------------------------------------------------
// Datengetrieben: eine neue Option ist eine Zeile in dieser Liste, kein neues
// Markup. Jede Einstellung kennt ihren Standard, ihre Persistenz und ihre
// Anwendung -- so kann keine davon vergessen werden.
//
// Cvar-LESEN aus JS ist unmoeglich; localStorage ist deshalb die Wahrheit, und
// alles wird bei jedem TSUI:game erneut angewandt (die Engine liest beim
// Kartenladen ihre eigene Konfiguration neu).
var TS_SET = {
	defs: [
		{ id:'sens', typ:'regler', min:1, max:6, schritt:0.5, std:3,
		  anwenden:function(v){ tsCmd('sensitivity ' + v + '\n'); },
		  zeigen:function(v){ return Number(v).toFixed(1) + 'x'; } },
		{ id:'invy', typ:'schalter', std:0,
		  // m_pitch negativ = Y umgekehrt. Der Betrag bleibt der Standardwert
		  // dieses Builds (0.022, per Konsole geprueft).
		  anwenden:function(v){ tsCmd('m_pitch ' + (Number(v) ? '-0.022' : '0.022') + '\n'); } },
		{ id:'aim', typ:'schalter', std:1,
		  anwenden:function(v){ tsCmd('in_aimassist ' + (Number(v) ? 1 : 0) + '\n'); } },
		{ id:'btnsize', typ:'regler', min:0.8, max:1.4, schritt:0.05, std:1, nurTouch:true,
		  anwenden:function(v){
			document.documentElement.style.setProperty('--tscale', v);
			// Groessere Knoepfe brauchen mehr Rand -- sonst rutscht die
			// Munitionsanzeige wieder darunter.
			if (window.__ts_hudRand) __ts_hudRand();
		  },
		  zeigen:function(v){ return Math.round(v * 100) + '%'; } },
		{ id:'btnalpha', typ:'regler', min:0.35, max:1, schritt:0.05, std:1, nurTouch:true,
		  anwenden:function(v){ document.documentElement.style.setProperty('--talpha', v); },
		  zeigen:function(v){ return Math.round(v * 100) + '%'; } },
		{ id:'lefty', typ:'schalter', std:0, nurTouch:true,
		  anwenden:function(v){
			var ui = document.getElementById('touchui');
			if (ui) ui.classList.toggle('lefty', !!Number(v));
			// Im gespiegelten Layout stehen links die Aktionsknoepfe -- also
			// weiterhin ueber dem Punktestand, nur andere Elemente. Das HUD
			// wandert deshalb zusaetzlich seitlich aus dem Weg. Die Engine
			// kann das nicht wissen, die Shell kennt ihr Layout.
			// Seitlich auszuweichen half nicht: im gespiegelten Layout ist die
			// linke Haelfte durchgehend belegt, der Block landete nur hinter
			// der naechsten Knopfspalte. Stattdessen weiter nach oben, in die
			// freie Zone unter MENUE.
			if (window.tsCmd) tsCmd('ts_hudx 0\nts_hudlift ' + (Number(v) ? 205 : 0) + '\n');
			// Im gespiegelten Layout ist der rechte Rand frei -- die Messung
			// faellt dann von selbst auf 0.
			if (window.__ts_hudRand) __ts_hudRand();
		  } },
		{ id:'bots', typ:'regler', min:0, max:3, schritt:1, std:0, nurGastgeber:true,
		  // ts_bots liest das SERVER-QuakeC. In der eigenen Runde (solo wie
		  // gastgebend) ist das derselbe Prozess; in einer FREMDEN Runde
		  // schriebe man eine Cvar, die niemand liest -- deshalb blendet
		  // sichtbar() die Zeile dort aus, statt einen Regler anzubieten,
		  // der nichts tut.
		  anwenden:function(v){ tsCmd('set ts_bots ' + Math.round(Number(v)) + '\n'); },
		  zeigen:function(v){ return Number(v) ? String(Math.round(v)) : T('off'); } },
		{ id:'qualitaet', typ:'schalter', std:0,
		  // Sparsam-Modus. Die Cvars sind an DIESEM Build per Konsole geprueft.
		  // fps_preset wird bewusst NICHT benutzt: ohne Argument oeffnet es ein
		  // blockierendes Engine-Menue ueber dem Spiel.
		  anwenden:function(v){
			if (Number(v))
				tsCmd('nzp_particles 0\nnzp_decals 0\nr_dynamic 0\nr_fastsky 1\ncl_maxfps 60\n');
			else
				tsCmd('nzp_particles 1\nnzp_decals 1\nr_dynamic 1\nr_fastsky 0\ncl_maxfps 250\n');
		  } },
		// Zwei Stufenschalter, die ihre Persistenz SELBST fuehren (typ 'stufe').
		// Sie liegen in TS_VIEW, weil das Zahnrad-Sheet dieselben Werte schaltet
		// und es nur EINE Wahrheit geben darf. `allesAnwenden` laesst sie
		// deshalb aus -- TS_VIEW haengt mit __ts_applyHud / __ts_applyBright
		// selbst an TSUI:game.
		{ id:'hud',  typ:'stufe',
		  beschriftung:function(){ return TS_VIEW.hudLabel(); },
		  weiter:function(){ TS_VIEW.naechsteHud(); } },
		{ id:'hell', typ:'stufe',
		  beschriftung:function(){ return TS_VIEW.hellLabel(); },
		  weiter:function(){ TS_VIEW.naechsteHelligkeit(); } }
	],

	wert:function(d){
		var v;
		try { v = localStorage.getItem('ts_set_' + d.id); } catch(e){}
		return v === null || v === undefined ? d.std : Number(v);
	},
	setzen:function(d, v){
		try { localStorage.setItem('ts_set_' + d.id, String(v)); } catch(e){}
		try { d.anwenden(v); } catch(e){}
	},
	// Was auf diesem Geraet ueberhaupt Sinn ergibt. Knopfgroesse, Deckkraft
	// und Linkshaender-Modus beschreiben Bedienelemente, die es am Rechner
	// nicht gibt -- sie stehen dort nicht als tote Regler herum.
	sichtbar:function(){
		var gast = !!(window.TS_JOIN && TS_JOIN.alsGast);
		return this.defs.filter(function(d){
			if (d.nurTouch && !IS_TOUCH) return false;
			if (d.nurGastgeber && gast)  return false;
			return true;
		});
	},

	// Bei jedem Spielstart erneut anwenden -- sonst gelten wieder die
	// Vorgaben aus nzportable.cfg. `stufe`-Zeilen bleiben aussen vor: die
	// gehoeren TS_VIEW, das sich selbst an TSUI:game haengt.
	allesAnwenden:function(){
		for (var i = 0; i < this.defs.length; i++){
			var d = this.defs[i];
			if (d.typ === 'stufe' || !d.anwenden) continue;
			// In einer fremden Runde nichts schreiben, was nur der Server liest.
			if (d.nurGastgeber && window.TS_JOIN && TS_JOIN.alsGast) continue;
			try { d.anwenden(this.wert(d)); } catch(e){}
		}
	},

	zeigen:function(){
		var el = document.getElementById('settingsui'); if (!el) return;
		el.style.display = 'flex';
		var ziel = document.getElementById('set-inhalt');
		var self = this;
		var liste = this.sichtbar();
		ziel.innerHTML = liste.map(function(d){
			if (d.typ === 'stufe')
				return '<div class="set-row"><label>' + T('set_' + d.id) + '</label>' +
					'<span class="set-schalter" id="sb-' + d.id + '">' +
					d.beschriftung() + '</span></div>';
			var v = self.wert(d);
			if (d.typ === 'regler')
				return '<div class="set-row"><label>' + T('set_' + d.id) + '</label>' +
					'<input type="range" id="sr-' + d.id + '" min="' + d.min + '" max="' + d.max +
					'" step="' + d.schritt + '" value="' + v + '">' +
					'<span class="wert" id="sv-' + d.id + '">' + (d.zeigen ? d.zeigen(v) : v) + '</span></div>';
			return '<div class="set-row"><label>' + T('set_' + d.id) + '</label>' +
				'<span class="set-schalter' + (v ? ' an' : '') + '" id="sb-' + d.id + '">' +
				T(v ? 'on' : 'off') + '</span></div>';
		}).join('');

		liste.forEach(function(d){
			if (d.typ === 'regler'){
				var r = document.getElementById('sr-' + d.id);
				if (r) r.addEventListener('input', function(){
					var v = Number(r.value);
					var a = document.getElementById('sv-' + d.id);
					if (a) a.textContent = d.zeigen ? d.zeigen(v) : v;
					self.setzen(d, v);
				});
			} else if (d.typ === 'stufe'){
				var t = document.getElementById('sb-' + d.id);
				if (t) t.addEventListener('click', function(){
					d.weiter();
					t.textContent = d.beschriftung();
				});
			} else {
				var b = document.getElementById('sb-' + d.id);
				if (b) b.addEventListener('click', function(){
					var v = self.wert(d) ? 0 : 1;
					self.setzen(d, v);
					b.classList.toggle('an', !!v);
					b.textContent = T(v ? 'on' : 'off');
				});
			}
		});
	},

	schliessen:function(){
		var el = document.getElementById('settingsui');
		if (el) el.style.display = 'none';
	}
};

// --- Treffer-Rueckmeldung ---------------------------------------------------
// Zwei Kanaele, weil einer davon auf dem wichtigsten Zielgeraet fehlt:
// navigator.vibrate gibt es auf iOS Safari NICHT. Ein Spieler auf dem iPhone
// bekaeme also gar nichts. Deshalb laeuft parallel immer ein sichtbarer Puls
// auf dem FEUER-Knopf -- gleiche Quelle, anderer Sinneskanal.
var TS_FX = {
	kannVibrieren: !!(navigator.vibrate),
	// h = eigener Treffer, k = Abschuss, d = SCHADEN AM SPIELER.
	//
	// Frueher hiess der dritte Fall `r` und haing an TSUI:fx:r. Das ist aber
	// der GAMEPAD-Rumble der Engine, und der hat neun Quellen -- sieben davon
	// sind Waffenaktionen (Feuern, Ziehen, Werfen, Waffengeraeusch, Betty
	// scharfmachen, Hechtrolle). Das Handy vibrierte also bei JEDEM SCHUSS mit
	// dem Treffer-Muster. Nachgezaehlt in quakec/source/server: neun Aufrufe
	// von nzp_rumble, zwei davon bei Schaden.
	//
	// Seit CSQC_EVENT_HURTDIR gibt es ein eigenes Ereignis genau dort, wo ein
	// Spieler Schaden nimmt (DamageHandler). fx:r wird bewusst ignoriert -- der
	// Gamepad ruettelt weiterhin, das macht die Engine selbst.
	muster: { h: 12, k: [0, 22, 40, 22], d: [0, 45, 35, 65] },
	letzt: 0,

	ausloesen: function(art){
		// Doppelte Drosselung: die Engine drosselt schon auf 60 ms, aber ein
		// Marker kann auch doppelt zugestellt werden.
		var jetzt = Date.now();
		if (jetzt - this.letzt < 45) return;
		this.letzt = jetzt;

		if (this.kannVibrieren){
			try { navigator.vibrate(this.muster[art] || 12); } catch(e){}
		}
		// Nur eigene Treffer pulsen den FEUER-Knopf. 'd' ist Schaden AM
		// Spieler -- ein weisser Puls auf dem Feuerknopf laese sich dort wie
		// ein Treffer, also genau falschherum. Dafuer zeichnet die Engine
		// ihre Blut-Ueberblendung und seit 08/2026 den Richtungsbogen.
		if (art === 'h' || art === 'k') this.puls(art);
	},

	puls: function(art){
		var f = document.getElementById('firebtn');
		if (!f) return;
		f.classList.remove('fx-h', 'fx-k');
		// Neuzeichnen erzwingen, sonst startet die Animation bei schnellen
		// Treffern nicht neu.
		void f.offsetWidth;
		f.classList.add(art === 'k' ? 'fx-k' : 'fx-h');
		setTimeout(function(){ f.classList.remove('fx-h', 'fx-k'); }, art === 'k' ? 220 : 130);
	}
};

// ---- Update-Erkennung: version.json (immer frisch, am SW vorbei) gegen
// TS_BUILD dieser Seite. Aeltere Shell? Vor dem Spielstart: einmal automatisch
// frisch laden; im Spiel: Update-Pille zeigen (nichts verlieren). Heilt
// haengengebliebene Tabs und die installierte App ohne Cache-Handarbeit. ----
(function(){
	var tag = document.getElementById('buildtag');
	if (tag) tag.textContent = 'TOTES SIGNAL ' + TS_BUILD;
	console.log('TOTES SIGNAL Shell ' + TS_BUILD);
	var lastCheck = 0;
	function check(){
		lastCheck = Date.now();
		try {
			fetch('version.json?ts=' + Date.now(), { cache: 'no-store' })
				.then(function(r){ return r.json(); })
				.then(function(v){
					if (!v || !v.build || v.build === TS_BUILD) return;
					// Query-String UND Hash erhalten: die alte Fassung baute das
					// Ziel aus location.pathname allein und verwarf damit beides
					// -- ?tsdebug=1 (Debug-Overlay) und der Upstream-#foo.fmf-
					// Bootpfad gingen bei jedem Auto-Update verloren.
					var target;
					try {
						var u = new URL(location.href);
						u.searchParams.set('u', v.build);
						target = u.pathname + u.search + u.hash;
					} catch(e) {
						target = location.pathname + '?u=' + encodeURIComponent(v.build);
					}
					// Noch vor dem Spielstart -> sofort neu laden (1x pro Sitzung, kein Loop)
					var auto = false;
					try { auto = sessionStorage.getItem('ts_upd') !== v.build; } catch(e){}
					if (auto && !(window.Module && Module.began)){
						try { sessionStorage.setItem('ts_upd', v.build); } catch(e){}
						location.replace(target);
						return;
					}
					var p = document.getElementById('updatepill');
					if (p){ p.style.display = 'block'; p.onclick = function(){ location.replace(target); }; }
				}).catch(function(){});
		} catch(e){}
	}
	setTimeout(check, 2500);
	document.addEventListener('visibilitychange', function(){
		if (!document.hidden && Date.now() - lastCheck > 60000) check();
	});
})();

function enterImmersive()
{	// must run inside a user gesture (fullscreen + orientation lock + iOS audio unlock)
	var el = document.documentElement;
	var req = el.requestFullscreen || el.webkitRequestFullscreen;
	if (req) { try { var p = req.call(el); if (p && p.catch) p.catch(function(){}); } catch(e){} }
	if (screen.orientation && screen.orientation.lock)
		screen.orientation.lock('landscape').catch(function(){});
}
// Liegt gerade ein Overlay vor dem Spiel? EINE Wahrheit dafuer -- vorher
// leitete sich jede Stelle das aus dem Inline-Stil eines einzelnen Overlays
// ab. Wird von Phase U-A (TS_OVL) uebernommen, sobald es sie gibt.
var TS_OVERLAYS = ['mstart','loadscreen','deathui','accountui','settingsui','joinui','lobbyui','browseui','spielerui','einwui'];
function overlayOffen(){
	for (var i = 0; i < TS_OVERLAYS.length; i++){
		var e = document.getElementById(TS_OVERLAYS[i]);
		if (e && e.style.display && e.style.display !== 'none') return true;
	}
	return false;
}
function updateOrient()
{	if (!IS_TOUCH) return;
	var portrait = window.matchMedia('(orientation: portrait)').matches;
	var r = document.getElementById('rotate');
	var tui = document.getElementById('touchui');
	// Der Dreh-Hinweis gilt dem SPIELEN. Wer eine Auswertung, sein Konto oder
	// die Einstellungen offen hat, liest die auch hochkant -- und der Hinweis
	// hat dort nichts zu suchen. Frueher lag er ausserdem UEBER dem
	// Todesbildschirm (geerbte z-index 50 gegen dessen 45): das Drehen des
	// Handys nach dem Tod loeschte die Auswertung ersatzlos.
	r.style.display = (portrait && Module.began && !overlayOffen()) ? 'flex' : 'none';
	if (window.TS_CTRL) TS_CTRL.applyVisibility();                    // HUD nur im Spiel + Querformat
}
window.addEventListener('resize', updateOrient);
window.addEventListener('orientationchange', updateOrient);

// Beim ERSTEN Besuch die Downloadgroesse nennen. Wer ueber Mobilfunk tippt,

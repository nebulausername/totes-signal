<!doctype html>
<html lang="de">
  <head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name=viewport content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta content="Totes Signal" property="og:title" />
    	<meta content="Totes Signal - Koop-Zombie-Shooter im Browser (WebGL). Kein Empfang. Nur Untote." property="og:description" />
	<meta content="#6e0d00" data-react-helmet="true" name="theme-color" />
	<title>Totes Signal</title>
	<link rel="icon" href="favicon.ico">
	<!-- PWA (M8): installierbar + offline. Alles relativ → funktioniert unter
	     /zombie/, GitHub Pages und local dev gleichzeitig. -->
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="apple-touch-icon" href="icons/icon-192.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Totes Signal">
	<!-- KEIN COOP/COEP: Engine ist single-threaded (kein SharedArrayBuffer/pthread);
	     Cross-Origin-Isolation wuerde den kaufmeinewebsite.de-iframe-Embed via
	     demo_security_headers.frame-ancestors brechen. Der SW braucht keine Isolation. -->
	<style>
	html,body { background-color:#000000; color:#808080; height:100%;width:100%;margin:0;padding:0; overflow:hidden; overscroll-behavior:none; }
	.emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
	div.emscripten { text-align: center; padding:0; margin: 0;}
	/* the canvas *must not* have any border or padding, or mouse coords will be wrong */
	canvas.emscripten { border: 0px none; width:100%; height:100%; padding:0; margin: 0; touch-action:none; }

	/* ---- Touch-Controls-Overlay (nur Touch-Geraete, nur im Spiel) ----
	   Alles skaliert mit vmin -> gleich bedienbar auf Handy wie Tablet. */
	/* --tscale und --talpha kommen aus den Einstellungen (Standard 1) und
	   liegen auf :root, damit sie hier greifen. Die Groessen werden damit
	   multipliziert statt neu gesetzt -- so bleiben die clamp()-Grenzen und
	   damit die Mindest-Tapziele erhalten. */
	:root { --tscale: 1; --talpha: 1; }
	#touchui { position:fixed; inset:0; pointer-events:none; display:none; z-index:var(--z-touch);
	           -webkit-user-select:none; user-select:none; font-family:monospace;
	           --tb: calc(clamp(50px, 12vmin, 88px) * var(--tscale));   /* Grundbreite / Rund-Durchmesser */
	           --th: calc(clamp(40px, 8.6vmin, 62px) * var(--tscale));  /* Pillen-Hoehe (Tap-Ziel >=40px) */
	           --stick: calc(clamp(126px, 31vmin, 216px) * var(--tscale)); }
	#touchui .tbtn {
		position:absolute; pointer-events:auto; touch-action:none;
		box-sizing:border-box; min-width:var(--tb); height:var(--th); padding:0 clamp(7px,1.5vmin,13px);
		display:flex; align-items:center; justify-content:center; text-align:center; white-space:nowrap;
		background:rgba(16,14,13,calc(0.46 * var(--talpha)));
		color:rgba(236,229,215,calc(0.94 * var(--talpha)));
		border:1px solid rgba(200,60,30,calc(0.45 * var(--talpha))); border-radius:11px;
		font-size:clamp(10px,1.95vmin,14px); font-weight:bold; letter-spacing:0.6px; line-height:1;
		text-shadow:0 1px 2px rgba(0,0,0,0.6); box-shadow:inset 0 0 12px rgba(0,0,0,0.42);
		transition:background 0.05s, box-shadow 0.05s;
	}
	#touchui .tbtn.big {                                    /* FEUER: primaer, gross, rot */
		height:calc(var(--th)*1.55); min-width:calc(var(--tb)*1.55); border-radius:15px;
		font-size:clamp(13px,2.6vmin,19px); background:rgba(150,18,4,calc(0.5 * var(--talpha)));
		border-color:rgba(232,42,16,calc(0.8 * var(--talpha))); color:rgba(255,255,255,var(--talpha)); }
	#touchui .tbtn.round {                                  /* Icon-Buttons (Zahnrad) */
		min-width:0; width:var(--tb); height:var(--tb); border-radius:50%; padding:0;
		font-size:clamp(15px,2.8vmin,22px); }
	/* Treffer-Puls auf dem FEUER-Knopf. Das ist auf iOS die EINZIGE
	   Rueckmeldung, die ankommt -- dort gibt es keine Vibration. */
	@keyframes tsfxh { 0% { box-shadow:0 0 0 0 rgba(255,255,255,0.55); }
	                  100% { box-shadow:0 0 0 14px rgba(255,255,255,0); } }
	@keyframes tsfxk { 0% { box-shadow:0 0 0 0 rgba(255,60,30,0.85); transform:scale(1.06); }
	                  100% { box-shadow:0 0 0 22px rgba(255,60,30,0); transform:scale(1); } }
	#touchui .tbtn.fx-h { animation:tsfxh 0.13s ease-out; }
	#touchui .tbtn.fx-k { animation:tsfxk 0.22s ease-out; }
	/* Wer weniger Bewegung angefordert hat, bekommt weniger Bewegung -- und
	   zwar ueberall, nicht an einer Stelle. Die Bildroehren-Optik BLEIBT
	   (sie traegt die Marke und bewegt sich nicht), abgeschaltet wird nur, was
	   zappelt: Koernung, Flackern, Pulsieren, Suchlauf, Zeichenaufbau. */
	@media (prefers-reduced-motion: reduce) {
		#touchui .tbtn.fx-h, #touchui .tbtn.fx-k,
		.ts-ov::after, .ts-mark, .rp-scan, .raum-code span,
		#raumchip::before, #updatepill, #rotate .rot { animation:none !important; }
		.raum-code span { filter:none; transform:none; }
		.rp-scan { display:none; }
		.play { transition:none; }
	}
	#touchui .tbtn:active, #touchui .tbtn.held {
		background:rgba(156,20,5,0.66); border-color:#e6431f; color:#fff;
		box-shadow:0 0 16px rgba(224,46,18,0.6), inset 0 0 12px rgba(0,0,0,0.4); }
	#touchui .tbtn.big:active, #touchui .tbtn.big.held { background:rgba(214,34,12,0.82); }
	/* AKTION hebt sich ab, wenn wirklich etwas zu benutzen ist (TSUI:use).
	   Vorher sah der Knopf immer gleich aus -- er ist einer von acht, und wer
	   nicht weiss, wo eine Wandwaffe haengt, uebersieht ihn. Kein Blinken:
	   das zoege den Blick vom Spielfeld ab, waehrend Zombies unterwegs sind. */
	#touchui .tbtn.bereit {
		background:rgba(150,18,4,calc(0.52 * var(--talpha)));
		border-color:rgba(255,86,48,calc(0.95 * var(--talpha)));
		color:rgba(255,255,255,var(--talpha));
		box-shadow:0 0 15px rgba(230,52,20,0.5), inset 0 0 12px rgba(0,0,0,0.4); }
	#touchui .tbtn.on {                                     /* Aim-Lock aktiv (Marker-synchron) */
		background:rgba(140,20,5,0.6); border-color:#ff5030; color:#fff;
		box-shadow:0 0 18px rgba(255,60,25,0.65), inset 0 0 12px rgba(0,0,0,0.4); }
	/* Schnell-Einstellungen (Slide-in links) */
	#gearsheet {
		position:absolute; left:0; top:0; bottom:0; width:clamp(230px, 46vmin, 360px);
		display:none; pointer-events:auto; touch-action:none; z-index:var(--z-gear); overflow-y:auto;
		background:rgba(8,6,5,0.94); border-right:1px solid rgba(210,60,30,0.55);
		padding:calc(3vmin + env(safe-area-inset-top)) 2vmin 3vmin calc(2vmin + env(safe-area-inset-left));
		box-shadow:8px 0 30px rgba(0,0,0,0.6); }
	#gearsheet .gs-title { color:#e2361a; font-weight:bold; letter-spacing:2px;
		font-size:clamp(11px,2vmin,14px); margin:2px 6px 12px; text-shadow:0 0 12px rgba(211,22,0,0.5); }
	#gearsheet .gs-row {
		display:flex; justify-content:space-between; align-items:center; gap:10px;
		margin:8px 4px; padding:13px 14px; border-radius:10px;
		background:rgba(28,21,18,0.85); border:1px solid rgba(200,60,30,0.4);
		color:#ece5d7; font-weight:bold; font-size:clamp(11px,2vmin,14px); letter-spacing:0.5px; }
	#gearsheet .gs-row:active { background:rgba(156,20,5,0.6); border-color:#e6431f; }
	#gearsheet .gs-state { color:#b8a488; }
	#gearsheet .gs-state.on { color:#3ad16a; text-shadow:0 0 10px rgba(40,170,70,0.6); }
	#gearsheet .gs-close { justify-content:center; background:rgba(60,14,6,0.7); margin-top:14px; }
	/* Auto-Sprint-Feedback am Stick */
	#stick.sprint { border-color:rgba(255,84,40,0.95);
		box-shadow:inset 0 0 24px rgba(0,0,0,0.55), 0 0 26px rgba(230,52,20,0.6); }
	#stick.sprint #stickthumb { box-shadow:0 0 22px rgba(255,74,32,0.85); }
	/* Erste-Runde-Hinweise */
	/* --- Schnellrufe und Chat (Koop) ------------------------------------
	   Der RUF-Knopf erscheint NUR im Koop: im Alleingang waere er ein Knopf,
	   der niemanden erreicht. Er ist ein normaler .tbtn und wird dadurch von
	   meldeRandbreite() automatisch mitgemessen -- der obere linke Streifen
	   (ts_hudtop) waechst von selbst, und die Perk-Zeichen ruecken darunter. */
	#touchui #rufbtn { display:none; }
	#touchui.koop #rufbtn { display:flex; }
	/* Zwei Spalten, nicht sieben Zeilen: als Liste reichte das Blatt bis zum
	   Joystick hinunter, und wer um Hilfe ruft, will sich meist noch bewegen
	   koennen. Zwei Spalten halbieren die Hoehe und verkuerzen den Weg des
	   Daumens. */
	/* Kompakt: dieser Umschalter teilt sich rund 154 px Tab-Seite mit der
	   Liste, um die es geht. Jeder Pixel hier ist eine halbe Zeile weniger. */
	.rank-schalter { display:flex; gap:5px; justify-content:center; margin:2px 0 4px; flex-wrap:wrap; }
	.rank-schalter .dtab { padding:2px 8px; font-size:clamp(9px,1.7vmin,12px); }
	.pl-wert.pl-unten { color:#ff5a3c; font-weight:bold; }
	#rufmenu {
		position:absolute; display:none; pointer-events:auto; touch-action:none;
		/* Waagerecht mittig, nicht oben links: links unten liegt der Joystick,
		   rechts die Knopfspalte. Ein Blatt am linken Rand streifte die
		   Oberkante des Sticks -- ein neuer Finger dort haette das Blatt
		   getroffen statt die Bewegung. In der Mitte bleiben beide Daumen frei,
		   und das Blatt ist ohnehin nur einen Tipp lang da. */
		z-index:var(--z-ruf); left:50%; transform:translateX(-50%);
		top:calc(3vmin + env(safe-area-inset-top));
		width:clamp(240px, 52vmin, 380px);
		display:none; grid-template-columns:1fr 1fr; gap:4px;
		background:rgba(6,5,4,0.97); border:1px solid rgba(210,60,30,0.55);
		border-radius:10px; padding:8px; box-shadow:0 8px 30px rgba(0,0,0,0.7); }
	#rufmenu.auf { display:grid; }
	#rufmenu .ruf-row {
		padding:8px 9px; min-height:44px; display:flex; align-items:center;
		background:rgba(24,20,18,0.9); border:1px solid rgba(255,255,255,0.09);
		border-radius:6px;
		color:#ece5d7; letter-spacing:1px; font-size:clamp(11px,2.1vmin,15px);
		cursor:pointer; }
	#rufmenu .ruf-row.zu {
		grid-column:1 / -1; color:#e2361a; justify-content:center;
		background:transparent; border-color:transparent; min-height:34px; }
	/* Der Chat gehoert der Shell, nicht der Engine: dort ist er in der
	   Konsolenschrift gesetzt (~8 CSS-Pixel auf dem Handy) und nicht
	   umbruchfaehig. Hier nimmt er keine Beruehrungen an -- wer liest, will
	   weiterspielen. */
	#chatlog {
		position:fixed; display:none; pointer-events:none; z-index:var(--z-ruf);
		left:calc(3vmin + env(safe-area-inset-left)); top:32%;
		width:min(52vw, 460px); max-height:26vh; overflow:hidden;
		display:flex; flex-direction:column; gap:3px;
		transition:opacity .5s ease; }
	#chatlog .cl-zeile {
		background:rgba(6,5,4,0.72); border-left:2px solid #e2361a;
		padding:3px 7px; border-radius:0 4px 4px 0;
		color:#ece5d7; font-size:clamp(11px,2.2vmin,16px); line-height:1.25;
		word-break:break-word; }
	#chatlog .cl-zeile b { color:#ff7a55; font-weight:normal; }

	#hints { position:fixed; inset:0; z-index:var(--z-hints); display:none; align-items:center; justify-content:center;
		background:rgba(0,0,0,0.64); font-family:monospace; -webkit-user-select:none; user-select:none; }
	#hints .hint-card { max-width:min(600px, 86vw); text-align:center; padding:20px 26px;
		background:rgba(10,8,7,0.92); border:1px solid rgba(210,22,0,0.55); border-radius:14px;
		color:#ece5d7; box-shadow:0 0 44px rgba(211,22,0,0.28); }
	#hints p { margin:10px 0; font-size:clamp(13px,2.5vmin,17px); letter-spacing:0.4px; }
	#hints .hint-ok { color:#ff5030; font-weight:bold; margin-top:16px; letter-spacing:1.5px; }
	#stick {
		position:absolute; pointer-events:auto; touch-action:none;
		left:calc(4vmin + env(safe-area-inset-left)); bottom:calc(5vmin + env(safe-area-inset-bottom));
		width:var(--stick); height:var(--stick); border-radius:50%;
		background:radial-gradient(circle at 50% 45%, rgba(34,12,9,0.32), rgba(13,11,11,0.44));
		border:1px solid rgba(200,60,30,0.40); box-shadow:inset 0 0 24px rgba(0,0,0,0.55);
	}
	#stickthumb {
		position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
		width:40%; height:40%; border-radius:50%; pointer-events:none;
		background:radial-gradient(circle at 40% 34%, rgba(242,236,223,0.62), rgba(196,62,42,0.52));
		border:1px solid rgba(232,226,212,0.5); box-shadow:0 0 14px rgba(224,52,26,0.45);
	}

	/* ---- TOTES SIGNAL: dead-radio-signal theme (start gate + loading + rotate + death) ---- */
	/* #settingsui gehoerte von Anfang an in diese Liste -- es stand nur
	   darunter mit z-index:49 und OHNE position. z-index wirkt auf statische
	   Elemente nicht, also lag der ganze Einstellungsschirm als normaler
	   Block UNTER dem 100%-hohen Canvas: top 408 bei 390 px Viewport, und
	   body hat overflow:hidden. Er war nie zu sehen. */
	/* Das Stapelregister. Vorher lagen diese Zahlen ueber acht Regeln
	   verstreut, und genau deshalb blieb ein Jahr lang unbemerkt, dass
	   #rotate (geerbte 50) UEBER dem Todesbildschirm (45) liegt: wer sein
	   Handy nach dem Tod drehte, verlor seine Auswertung ersatzlos --
	   Zurueckdrehen holte sie nicht wieder, weil TS_DEATH.show laengst
	   gelaufen war. An einer Stelle ist so ein Fehler auf einen Blick zu
	   sehen. NEUE OVERLAYS TRAGEN HIER IHRE ZAHL EIN. */
	:root {
		--z-touch:10; --z-gear:12; --z-ruf:13; --z-hints:40;
		--z-rotate:44;      /* UNTER allem, was Inhalt zeigt */
		--z-death:45; --z-konto:47; --z-set:49;
		--z-lobby:46;       /* Koop: Gastgeber-Schirm */
		--z-spieler:48;     /* Koop: Spielerliste, ueber dem Konto-Schirm */
		--z-gate:50; --z-join:51; --z-load:52;
		--z-konto-gate:51; /* Konto, vom Gate aus geoeffnet: MUSS ueber dem Gate liegen */
		--z-einw:72;       /* Einwilligung vor dem Konto: modal, ueber allem */
		--z-install:60; --z-build:65; --z-update:70;
	}
	/* An der KLASSE, nicht an einer ID-Liste. Jedes neue Overlay bekommt
	   position:fixed, indem es die Klasse traegt -- es kann nicht mehr
	   vergessen werden. Genau dieses Vergessen hat den Einstellungsschirm
	   ueber seine gesamte Auslieferungszeit unsichtbar gemacht (er stand
	   darunter mit z-index:49 und OHNE position; z-index wirkt auf statische
	   Elemente nicht). */
	.ts-ov {
		position:fixed; inset:0; z-index:var(--z-gate); display:none;
		background:radial-gradient(120% 90% at 50% 35%, #12100e 0%, #070605 55%, #000 100%);
		color:#e6e1d2; font-family:monospace;
		align-items:center; justify-content:center; text-align:center; padding:24px;
		-webkit-user-select:none; user-select:none; overflow:hidden;
	}
	#loadscreen { z-index:var(--z-load); }
	/* Der Dreh-Hinweis ist eine BITTE, kein Inhalt -- er gehoert unter alles,
	   was etwas zu sagen hat. Siehe Stapelregister oben. */
	#rotate { z-index:var(--z-rotate); }
	/* Death-Overlay: unter Gate/Ladescreen, ueber Touch-HUD; Spiel bleibt leicht sichtbar */
	#deathui { z-index:var(--z-death); background:radial-gradient(120% 90% at 50% 35%, rgba(18,10,8,0.93) 0%, rgba(7,4,3,0.95) 55%, rgba(0,0,0,0.97) 100%); }
	/* Konto- und Fortschrittsansicht: erbt die Grundgestaltung oben, liegt
	   ueber dem Todes-Overlay aber unter Gate und Ladescreen. */
	#accountui { z-index:var(--z-konto); overflow-y:auto; align-items:flex-start; }
	#accountui .box { max-width:min(760px, 94vw); width:100%; padding:14px 0 28px; }
	/* Bis 23.09.2026 oeffnete KONTO & FORTSCHRITT auf dem Gate den Schirm mit
	   z 47 UNTER dem Gate (50): der Knopf tat sichtbar nichts. Vom Gate aus
	   geoeffnet traegt er deshalb diese Klasse (TS_KONTO.zeigen). */
	#accountui.ueber-gate { z-index:var(--z-konto-gate); }
	#einwui { z-index:var(--z-einw); }
	#einwui .box { max-width:min(560px, 92vw); }
	/* .ts-sub ist fuer die kurze Zeile KEIN SIGNAL gesperrt -- Fliesstext wird
	   damit unlesbar. Hier normale Laufweite. */
	#einwui .ts-sub { text-align:left; line-height:1.55; letter-spacing:0.01em; font-size:min(3.6vw,15px); color:#d6d0c0; }
	#einwui a { color:#e6e1d2; }
	/* Credits und Recht auf dem Gate. Im Fluss der Box, NICHT fest am Rand:
	   unten liegt schon der Installieren-Knopf. Ziele per Innenabstand
	   vergroessert, die Schrift bleibt klein. */
	.gate-fuss { margin-top:18px; font-size:min(2.6vw,11px); line-height:1.7; color:#8c8474; max-width:min(96vw,820px); margin-left:auto; margin-right:auto; }
	.gate-fuss a { color:#c9c2b0; text-decoration:underline; padding:6px 2px; }
	.gate-fuss small { display:block; font-size:inherit; opacity:0.8; }
	/* Handy quer (~390 px hoch): die Box war schon vorher hoeher als das
	   Fenster. Hier nur EINE Zeile -- der Fanprojekt-Hinweis steht zusaetzlich
	   im Abspann und im Repo. */
	@media (max-height:500px){ .gate-fuss { margin-top:4px; line-height:1.3; font-size:10px; } .gate-fuss small { display:none; } #mstart .ts-skull { width:min(20vw,64px); } }
	#accountui h3 { margin:16px 0 8px; font-size:min(2.4vh,13px); letter-spacing:2px;
		color:#c9a06a; text-transform:uppercase; font-weight:normal; }
	.acc-kopf { display:flex; align-items:baseline; justify-content:center; gap:12px; flex-wrap:wrap; }
	.acc-name { font-size:min(4vh,22px); letter-spacing:2px; color:#e6e1d2; }
	.acc-lvl  { font-size:min(2.4vh,13px); color:#e8b04b; }
	.acc-bar  { height:6px; background:rgba(255,255,255,0.08); border-radius:3px; margin:8px auto; max-width:420px; }
	.acc-bar i { display:block; height:100%; background:#b31200; border-radius:3px; }
	.acc-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin:10px 0; }
	.acc-chip { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
		border-radius:6px; padding:8px 6px; }
	.acc-chip b { display:block; font-size:min(3vh,17px); color:#e6e1d2; }
	.acc-chip span { font-size:min(1.9vh,10px); color:#a8a094; letter-spacing:1px; }
	.acc-ach { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:6px; text-align:left; }
	.acc-a { display:flex; gap:8px; align-items:flex-start; padding:7px 9px; border-radius:6px;
		background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); }
	.acc-a.auf { border-color:rgba(232,176,75,0.45); background:rgba(232,176,75,0.07); }
	.acc-a.zu  { opacity:0.42; }
	.acc-a i   { font-style:normal; font-size:min(2.4vh,14px); line-height:1.1; }
	.acc-a div { min-width:0; }
	.acc-a b   { display:block; font-size:min(2.1vh,11px); color:#e6e1d2; letter-spacing:0.5px; }
	.acc-a span{ font-size:min(1.8vh,10px); color:#a8a094; }
	/* Einstellungen: erbt die Grundgestaltung der anderen Overlays. */
	#settingsui { z-index:var(--z-set); overflow-y:auto; align-items:flex-start; padding:12px; }
	#settingsui .box { max-width:min(560px,94vw); width:100%; padding:4px 0 16px; }
	/* Im Querformat ist Hoehe knapp: die 60-px-Wortmarke frass ein Viertel des
	   Bildschirms und schob die Regler unter die Kante. Titel klein halten,
	   Zeilen enger -- so passen Empfindlichkeit bis Sparsam-Modus ohne Scrollen. */
	#settingsui .ts-mark { font-size:min(4.6vh,26px); letter-spacing:3px; margin:0 0 6px; }
	#settingsui .set-row { padding:7px 12px; }
	/* Server beitreten: das einzige echte Eingabefeld der Anwendung. Die
	   Engine kann auf dem Handy keine Texteingabe, ein HTML-input schon --
	   mitsamt Systemtastatur, Einfuegen und Autokorrektur-Abschaltung. */
	#joinui { z-index:var(--z-join); }
	/* Gastgeber-Bildschirm. Steht im Sammelselektor oben -- ohne das haette er
	   kein position:fixed, und z-index wirkt auf statische Elemente nicht
	   (genau so war der Einstellungsschirm ueber seine gesamte
	   Auslieferungszeit unsichtbar). */
	#lobbyui { z-index:var(--z-lobby); }
	#lobbyui .ts-mark { font-size:min(5vh,28px); letter-spacing:3px; margin:0 0 4px; }
	#lobbyui .death-actions { gap:14px; margin-top:6px; }
	#lobbyui .play, #lobbyui .play.alt { margin-top:10px; }
	#lobbyui .set-row { width:min(420px,86vw); margin:10px auto 0; border-bottom:0; }
	#lobbyui #hp-set .set-row { margin-top:4px; }
	.hp-hinweis { color:#9a9384; font-size:0.82em; letter-spacing:0; }
	.hp-wert { flex:0 0 auto; min-width:132px; padding:6px 10px; }
	#hp-tabs { margin-bottom:2px; }
	/* Fester Kopf, fester Fuss, EIN nachgiebiger Teil. Ohne diese Struktur
	   waechst die Karte mit ihrem Inhalt und schiebt ihre eigenen Knoepfe
	   hinaus -- beim Hinzufuegen des Sichtbarkeits-Schalters sofort passiert:
	   KARTE WAEHLEN sass im Querformat bei 397 px, der Schirm ist 390 hoch.
	   Genau derselbe Fehler wie einst im Todesbildschirm (Footgun 20). */
	#lobbyui .box { display:flex; flex-direction:column; max-height:100%; }
	.lb-koerper { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
	/* Im Querformat auf dem Handy sind 390 px Hoehe alles, was es gibt. Der
	   Koerper WUERDE rollen -- aber dann liegt der Schalter fuer die
	   oeffentliche Sichtbarkeit unter der Kante, und ein Schalter, den niemand
	   findet, ist so gut wie keiner. Also passt hier alles hinein: kleinerer
	   Code, engere Abstaende. Dieselbe Schwelle wie bei der Wortmarke. */
	@media (max-height: 520px) {
		#lobbyui .raum-platte { padding:4px min(4.5vw,18px) 5px; margin:4px auto 0; }
		#lobbyui .raum-code { font-size:min(7.5vw,34px); letter-spacing:4px; }
		/* Die Reiterleiste kostet Hoehe, und im Querformat gibt es keine.
		   Der Hinweis unter dem Titel ist entbehrlich -- der Code darunter
		   erklaert sich selbst. */
		#lobbyui .ts-mark { font-size:min(4vh,22px); margin:0; }
		#lobbyui > .box > .hint[data-i18n="hostHint"] { display:none; }
		#lobbyui .raum-zeile .play.alt { padding:5px 12px; font-size:min(3vw,13px); }
		#lobbyui .hint { margin-top:6px; }
		#lobbyui .set-row { margin-top:6px; padding:6px 12px; }
		/* Der Einstellungs-Reiter traegt vier Zeilen -- auf WebKit im
		   Querformat rollte er sonst, und ein Wert, den man erst suchen muss,
		   wird nicht eingestellt. */
		#lobbyui #hp-set .set-row { margin-top:2px; padding:4px 10px; }
		#lobbyui #hp-set .set-row label { font-size:min(2vh,11px); }
		#lobbyui .hp-hinweis { display:none; }
		#lobbyui .hp-wert { min-width:110px; padding:4px 8px; }
		#hp-tabs .dtab { padding:5px 12px; }
		#lobbyui .raum-zeile { margin-top:6px; }
		#lobbyui .play, #lobbyui .play.alt { margin-top:6px; }
		#lobbyui .death-actions { margin-top:2px; }
	}
	/* Der Code ist das Einzige, was der Gastgeber weitergeben muss. Also ist er
	   das Groesste auf dem Schirm, sitzt auf einer eigenen Platte und liest
	   sich wie eine empfangene Frequenz -- die Handschrift des Spiels ist ein
	   totes Funksignal, und genau hier wird eines gefunden. */
	.raum-platte { position:relative; display:inline-block; margin:10px auto 2px;
		padding:10px min(6vw,28px) 12px; border-radius:12px;
		background:linear-gradient(180deg, rgba(28,16,12,0.92), rgba(12,7,6,0.92));
		box-shadow:inset 0 0 30px rgba(194,21,0,0.18), 0 0 26px rgba(0,0,0,0.6);
		overflow:hidden; }
	/* Vier Eckmarken statt eines Rahmens: der Blick faellt auf den Inhalt,
	   nicht auf die Kante. */
	.rp-ecke { position:absolute; width:12px; height:12px; pointer-events:none;
		border-color:#c21500; border-style:solid; border-width:0; opacity:0.9; }
	.rp-lo { top:6px; left:6px;  border-top-width:2px; border-left-width:2px; }
	.rp-ro { top:6px; right:6px; border-top-width:2px; border-right-width:2px; }
	.rp-lu { bottom:6px; left:6px;  border-bottom-width:2px; border-left-width:2px; }
	.rp-ru { bottom:6px; right:6px; border-bottom-width:2px; border-right-width:2px; }
	/* Ein Suchlauf, der einmal alle paar Sekunden ueber die Platte streicht. */
	.rp-scan { position:absolute; left:-30%; top:0; width:30%; height:100%;
		pointer-events:none; animation:rpscan 5.5s ease-in-out infinite;
		background:linear-gradient(90deg, transparent, rgba(255,120,90,0.13), transparent); }
	@keyframes rpscan { 0%,72%{left:-30%} 100%{left:100%} }
	.raum-code { font-family:monospace; font-size:min(13vw,64px); letter-spacing:8px;
		color:#f2ede0; margin:0; line-height:1.15;
		text-shadow:0 0 4px rgba(242,237,224,0.5), 0 0 22px rgba(224,52,26,0.6);
		-webkit-user-select:all; user-select:all; }
	/* Jedes Zeichen taucht einzeln auf -- der Code wird empfangen, nicht
	   hingeschrieben.
	   KEIN opacity in der Animation: mit `both` gilt vor dem Start der
	   from-Zustand, und lief die Animation nie (verstecktes Element,
	   abgeschaltete Animationen, ein Browser der sie ueberspringt), blieb der
	   Code FUER IMMER unsichtbar. Genau das war auf einer Aufnahme zu sehen --
	   eine leere Platte, waehrend jede Messung "passt" meldete. Ein Code, den
	   man nicht lesen kann, ist das Gegenteil seines Zwecks.
	   Unschaerfe und Versatz reichen voellig: sie sehen genauso aus und
	   koennen den Text nicht verschwinden lassen. */
	.raum-code span { display:inline-block; animation:rpein 0.5s both; }
	@keyframes rpein { from{ transform:translateY(-6px); filter:blur(5px) }
	                     to{ transform:none;             filter:none } }
	.raum-zeile { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
	.raum-zeile .play.alt { margin-top:0; font-size:min(3.6vw,15px); padding:9px 16px; }
	/* Waehrend einer angebotenen Runde bleibt der Code sichtbar -- sonst muss
	   der Gastgeber das Spiel verlassen, um ihn nachzusehen. */
	#raumchip { position:fixed; z-index:var(--z-gear);
		left:50%; transform:translateX(-50%);
		top:calc(4px + env(safe-area-inset-top));
		display:none; padding:4px 10px; border-radius:8px; cursor:pointer;
		background:rgba(10,7,6,0.72); border:1px solid rgba(194,21,0,0.55);
		color:#e6e1d2; font:600 min(3.4vw,13px)/1.5 monospace; letter-spacing:2px;
		box-shadow:0 0 16px rgba(194,21,0,0.35); transition:box-shadow 200ms ease; }
	#raumchip:hover { box-shadow:0 0 26px rgba(194,21,0,0.6); }
	/* Die Wartezone liegt ueber dem Spiel, faengt aber KEINE Beruehrungen ab
	   -- nur ihr Knopf tut das. Wer auf Freunde wartet, will sich umsehen
	   koennen, nicht gegen eine Glasscheibe tippen. */
	#spielerui { z-index:var(--z-spieler); }
	#spielerui .ts-mark { font-size:min(5vh,26px); letter-spacing:3px; margin:0 0 6px; }
	#spielerui .box { display:flex; flex-direction:column; max-height:100%; width:min(560px,94vw); }
	.pl-liste { flex:1 1 auto; min-height:0; overflow-y:auto; text-align:left; margin:6px 0 2px; }
	.pl-zeile { display:flex; align-items:center; gap:10px; padding:9px 12px; margin-bottom:6px;
		border:1px solid rgba(194,21,0,0.3); border-radius:10px;
		background:rgba(20,14,12,0.72); font-family:monospace; font-size:min(3.4vw,14px); }
	.pl-name { flex:1 1 auto; color:#f2ede0; letter-spacing:1px;
		overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	.pl-ich { color:#c9a06a; }
	.pl-wert { color:#9a9384; white-space:nowrap; font-size:0.9em; }
	.pl-raus { flex:0 0 auto; padding:4px 10px; border-radius:7px; cursor:pointer;
		border:1px solid rgba(210,60,40,0.6); background:rgba(60,14,8,0.6);
		color:#e6b0a0; font:inherit; font-size:0.86em; }
	.pl-raus:hover { background:rgba(120,24,12,0.7); color:#fff; }
	/* Kurzmeldung: liegt ueber allem, faengt nichts ab, geht von selbst weg. */
	#toast { position:fixed; z-index:var(--z-update); pointer-events:none;
		left:50%; transform:translateX(-50%);
		bottom:calc(16px + env(safe-area-inset-bottom));
		display:none; max-width:min(90vw,520px); padding:10px 16px; border-radius:10px;
		background:rgba(12,8,7,0.92); border:1px solid rgba(194,21,0,0.6);
		box-shadow:0 0 24px rgba(0,0,0,0.6);
		color:#e6e1d2; font:min(3.6vw,14px)/1.5 monospace; text-align:center; }
	#toast.an { display:block; }
	#browseui { z-index:var(--z-join); }
	#browseui .ts-mark { font-size:min(5vh,28px); letter-spacing:3px; margin:0 0 4px; }
	#browseui .death-actions { gap:12px; margin-top:6px; }
	#browseui .play, #browseui .play.alt { margin-top:8px; font-size:min(3.6vw,15px); padding:10px 18px; }
	/* Fester Kopf, fester Fuss, EIN nachgiebiger Teil -- sonst schiebt eine
	   lange Liste ihre eigenen Knoepfe unter den Bildrand (Footgun 20). */
	#browseui .box { display:flex; flex-direction:column; max-height:100%; width:min(680px,94vw); }
	.br-liste { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
		margin:10px 0 2px; text-align:left; }
	.br-zeile { display:flex; align-items:center; gap:10px; width:100%;
		padding:10px 12px; margin-bottom:6px; cursor:pointer;
		border:1px solid rgba(194,21,0,0.35); border-radius:10px;
		background:rgba(20,14,12,0.75); color:#e6e1d2;
		font-family:monospace; font-size:min(3.4vw,14px); text-align:left;
		transition:border-color 140ms ease, background 140ms ease; }
	.br-zeile:hover { border-color:#c21500; background:rgba(40,18,12,0.85); }
	.br-name { flex:1 1 auto; color:#f2ede0; letter-spacing:1px;
		overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	.br-karte { color:#9a9384; font-size:0.86em; }
	.br-zahl { color:#c9a06a; white-space:nowrap; }
	.br-runde { color:#9a9384; white-space:nowrap; font-size:0.86em; }
	.br-leer { padding:22px 8px; color:#9a9384; line-height:1.6; }
	#lobbybar { position:fixed; z-index:var(--z-gear); pointer-events:none;
		left:50%; transform:translateX(-50%);
		top:calc(4px + env(safe-area-inset-top));
		display:none; align-items:center; gap:12px;
		padding:6px 8px 6px 14px; border-radius:10px;
		background:rgba(10,7,6,0.82); border:1px solid rgba(194,21,0,0.6);
		box-shadow:0 0 22px rgba(194,21,0,0.35);
		color:#e6e1d2; font:600 min(3.4vw,13px)/1.5 monospace; letter-spacing:2px;
		/* NICHT umbrechen. Als der SPIELER-Knopf dazukam, brach der Raumcode
		   mitten durch ("XAC-" / "JVR") -- und ein umgebrochener Code ist beim
		   Vorlesen wertlos. Lieber schmaler werden als falsch aussehen: der
		   Hinweistext darf kuerzen, der Code nie. */
		flex-wrap:nowrap; white-space:nowrap; max-width:96vw; }
	#lb-code { flex:0 0 auto; }
	#lb-zahl { flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; }
	#lobbybar.an { display:flex; }
	#lb-code { color:#f2ede0; text-shadow:0 0 12px rgba(224,52,26,0.6); }
	#lb-code::before { content:'●'; color:#e0341a; margin-right:7px;
		animation:tspulse 2.2s ease-in-out infinite; }
	#lb-zahl { color:#c9a06a; }
	#lobbybar .play.alt { pointer-events:auto; margin:0; padding:6px 14px;
		font-size:min(3.2vw,13px); }
	/* Beim Gast entfaellt nur der START-Knopf -- die Spielerliste sieht jeder. */
	#lobbybar.gast #lb-los { display:none; }
	/* Offenes Einstiegsfenster: warm statt signalrot. Rot heisst in diesem
	   Spiel "Achtung"; hier geht es um eine Gelegenheit, die sich schliesst --
	   das ist ein anderer Ton, und er soll sich auch anders anfuehlen. */
	#lobbybar.einstieg { border-color:rgba(201,160,106,0.7);
		box-shadow:0 0 20px rgba(201,160,106,0.28); }
	#lobbybar.einstieg #lb-code::before { color:#c9a06a; }
	#lobbybar.einstieg #lb-zahl { color:#e0c9a0; }
	/* Der Punkt davor zeigt: hier laeuft etwas, es wird gesendet. */
	#raumchip::before { content:'●'; color:#e0341a; margin-right:7px;
		animation:tspulse 2.2s ease-in-out infinite; }
	/* Wie beim Einstellungsschirm: im Querformat ist Hoehe knapp, die
	   60-px-Wortmarke schoebe Feld und Knoepfe unter die Kante. */
	#joinui .ts-mark { font-size:min(5vh,28px); letter-spacing:3px; margin:0 0 4px; }
	#joinui .death-actions { gap:14px; margin-top:6px; }
	#joinui .play, #joinui .play.alt { margin-top:10px; }
	#joinui input { width:min(560px,86vw); margin-top:14px; padding:12px 14px;
		font-family:monospace; font-size:min(4.4vw,17px); letter-spacing:0.5px;
		color:#f2ede0; background:rgba(20,14,12,0.9); border:2px solid #6b3a2a;
		border-radius:10px; outline:none; }
	#joinui input:focus { border-color:#c21500; }
	.set-row { display:flex; align-items:center; gap:10px; padding:10px 12px; text-align:left;
		border-bottom:1px solid rgba(255,255,255,0.07); }
	.set-row label { flex:1 1 auto; font-size:min(2.2vh,12px); letter-spacing:1px; color:#e6e1d2; }
	.set-row .wert { min-width:70px; text-align:right; font-size:min(2.1vh,11px); color:#c9a06a; }
	.set-row input[type=range] { flex:0 0 46%; accent-color:#b31200; }
	.set-schalter { flex:0 0 64px; text-align:center; padding:5px 0; border-radius:5px; cursor:pointer;
		border:1px solid rgba(255,255,255,0.18); font-size:min(2vh,11px); letter-spacing:1px; }
	.set-schalter.an { border-color:#b31200; color:#ff5a3c; background:rgba(179,18,0,0.14); }

	/* Linkshaender: das gesamte Touch-HUD spiegeln und jedes Kind
	   zurueckspiegeln, damit Positionen tauschen aber Text lesbar bleibt.
	   Einzeln umzupositionieren waere bei zehn inline-gesetzten Knoepfen
	   deutlich fehleranfaelliger. */
	#touchui.lefty { transform:scaleX(-1); }
	#touchui.lefty > * { transform:scaleX(-1); }
	/* Der Bildroehren-Look ist die Handschrift des Spiels -- und er hing an
	   einer ID-Liste. Gate, Dreh-Hinweis, Ladeschirm und Todesbildschirm
	   hatten ihn, Beitritt, Konto, Einstellungen und der Gastgeber-Schirm
	   nicht: dieselben vier Overlays sahen aus wie aus einem anderen Spiel.
	   Jetzt an der Klasse (Footgun 14). */
	.ts-ov::before {
		content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
		background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.30) 2px 3px);
	}
	/* rolling static grain + gentle flicker */
	.ts-ov::after {
		content:''; position:absolute; inset:-60%; pointer-events:none; z-index:1; opacity:0.06;
		background-image:radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.7px);
		background-size:3px 3px; animation:tsnoise 0.9s steps(4) infinite;
	}
	@keyframes tsnoise { 0%{transform:translate(0,0)} 25%{transform:translate(-4%,3%)} 50%{transform:translate(3%,-2%)} 75%{transform:translate(-2%,-4%)} 100%{transform:translate(0,0)} }
	.ts-ov .box { position:relative; z-index:2; max-width:92%; }
	/* Gate-Backdrop (Still via poster, Loop lazy) — liegt UNTER Scanlines/Grain */
	#mstart #gatevid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
		z-index:0; opacity:0.5; filter:brightness(1.2) saturate(0.85); }
	.ts-skull { width:min(20vw,92px); height:auto; margin:0 auto 8px; display:block; filter:drop-shadow(0 0 14px rgba(180,20,0,0.6)); opacity:0.95; }
	.ts-mark { color:#c21500; font-size:min(11vw,60px); font-weight:bold; margin:0; letter-spacing:6px;
		text-shadow:0 0 4px #c21500, 0 0 22px rgba(194,21,0,0.55); animation:tsflk 4.5s infinite; }
	.ts-sub { color:#9a9384; font-size:min(3.2vw,14px); letter-spacing:5px; margin:3px 0 0; opacity:0.85; }
	@keyframes tsflk { 0%,92%,100%{opacity:1} 93%{opacity:0.35} 94%{opacity:1} 96%{opacity:0.55} 97%{opacity:1} }
	.ts-ov p.hint, #rotate p { font-size:min(4.2vw,17px); line-height:1.55; opacity:0.82; margin:12px 0 0; }
	/* Die Knopfregel galt urspruenglich nur fuer #mstart und #deathui. Jedes
	   neue Overlay musste einzeln nachgetragen werden -- und dreimal wurde es
	   vergessen: im Konto standen ENABLE und CLOSE als nackter Text da, im
	   Beitritts-Dialog CONNECT und CANCEL. Deshalb jetzt an der KLASSE, nicht
	   am Overlay: .play wird ausschliesslich fuer diese Knoepfe benutzt. */
	/* .play ist seit 08/2026 ein echtes <button>. Vorher war es ein <span> mit
	   click-Zuhoerer -- damit war NICHTS im Start-Gate fokussierbar, und an
	   einem Rechner ohne Maus liess sich das Spiel ueberhaupt nicht starten
	   (WCAG 2.1.1, und zwar auf dem allerersten Bildschirm). Ein <button>
	   loest bei Enter und Leertaste von selbst ein click-Ereignis aus, also
	   brauchte kein einziger Handler geaendert zu werden.
	   font/appearance muessen zurueckgesetzt werden: ein Knopf erbt weder die
	   Schrift noch verzichtet er von allein auf die Systemdarstellung. */
	.play {
		margin-top:26px; display:inline-block; padding:16px 32px; cursor:pointer;
		font-family:inherit; text-align:center; line-height:normal;
		-webkit-appearance:none; appearance:none;
		border:2px solid #c21500; border-radius:12px; color:#f2ede0;
		font-size:min(6vw,24px); font-weight:bold; letter-spacing:1px;
		background:rgba(138,18,0,0.28); box-shadow:0 0 26px rgba(194,21,0,0.4);
		vertical-align:middle;
	}
	/* Ein Knopf, der auf Beruehrung nicht antwortet, fuehlt sich kaputt an.
	   transform statt Farbe allein: die Bewegung ist auch dann zu sehen, wenn
	   der Finger die Flaeche verdeckt. */
	.play { transition:background 120ms ease, box-shadow 160ms ease, transform 90ms ease; }
	.play:hover { background:rgba(178,24,4,0.42); box-shadow:0 0 34px rgba(194,21,0,0.55); }
	.play:active { background:rgba(194,21,0,0.55); transform:translateY(1px) scale(0.985); }
	.play.alt:hover { background:rgba(60,36,28,0.7); box-shadow:0 0 18px rgba(0,0,0,0.5); }
	/* Sieht aus wie ein Link, ist ein Knopf -- damit erreichbar per Tab. */
	.linkbtn { background:none; border:0; padding:0; margin:0; cursor:pointer;
		font:inherit; color:inherit; text-decoration:underline; }
	/* Es gab bis 08/2026 NIRGENDS eine Fokusanzeige. Signalrot als Kontur,
	   knochenweisser Innenring -- damit sie auf der dunklen Karte UND auf dem
	   roten Hauptknopf sichtbar bleibt. */
	:focus-visible { outline:3px solid #e0341a; outline-offset:2px;
		box-shadow:0 0 0 2px rgba(242,237,224,0.85); border-radius:6px; }
	/* Zweitknopf im Gate: gleiche Groesse, ruhiger -- er ist ein Angebot,
	   nicht der Hauptweg. */
	.play.alt { margin-top:14px; border-color:#6b3a2a; color:#e6e1d2;
		background:rgba(40,24,18,0.55); box-shadow:none; font-size:min(4.4vw,18px);
		padding:12px 24px; }
	#deathui .death-actions { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
	#deathui .play { margin-top:12px; font-size:min(4vw,17px); padding:11px 20px; }
	#deathui .play.alt { border-color:rgba(210,200,180,0.55); background:rgba(40,36,32,0.4);
		box-shadow:0 0 18px rgba(0,0,0,0.5); color:#e0d9c8; }
	#deathui .play.alt:active { background:rgba(90,80,70,0.5); }
	/* Der Todes-Bildschirm ist eine SPALTE: fester Kopf, fester Fuss, und genau
	   ein nachgiebiger Teil dazwischen -- die Tab-Seite. Vorher wuchs die Box
	   mit ihrem Inhalt und schob NOCHMAL/ZUR LOBBY unter den Bildschirmrand,
	   also genau die beiden Knoepfe, wegen derer der Bildschirm da ist.
	   Nachgemessen (844x390 Querformat): auf iOS reichte EIN frisch verdienter
	   Erfolg im Kopf -- Knopfunterkante 391 px bei 390 px Viewport; auf Android
	   kippte es bei sechs (404 px). Die alte Deckelung an #rank-liste half nur
	   der Liste, nicht dem Kopf darueber. */
	#deathui .box { width:min(680px,94%); max-height:94vh; overflow-y:auto;
		display:flex; flex-direction:column; }
	#deathui #dpage-stats, #deathui #dpage-board, #deathui #dpage-rank {
		flex:1 1 auto; min-height:0; overflow-y:auto; }
	#deathui .death-actions { flex:0 0 auto; }
	#deathui #deathart { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
		z-index:0; opacity:0.32; filter:saturate(0.8); }

	<script type='text/javascript'>
// QuakeC->JS-Bruecke: das Menue druckt bei jedem Menue<->Spiel-Wechsel einen
// TSUI-Marker (menu/main.qc m_draw). VERIFIZIERT (07/2026): die Engine gibt
// QuakeC-stdout DIREKT ueber console.log aus, NICHT ueber Module.print ->
// console.log wird hier (vor dem Engine-Script, das erst in begin() injiziert
// wird) gewrappt, damit die Engine unseren Wrapper bindet. Module.print bleibt
// als zweiter Kanal angeschlossen (schadet nicht, setInGame dedupliziert).
// Der eigene WebRTC-Vermittler. Nur der Hostname -- die Engine baut daraus
// wss://<host>/NZP-REBOOT-WEB/<raum> und wirft jeden Pfad weg, den man hier
// mitgibt.
var TS_VERMITTLER = 'wss://totersignal.de';

// Klartext-Meldungen der Engine. tsMarker steigt bei allem ohne "TSUI:" sofort
// aus -- das ist richtig so, sein Vertrag sind die Marker. Meldungen wie ein
// Rauswurf kommen aber als gewoehnliche englische Konsolenzeile, und dafuer
// braucht es eine eigene, sehr kurze Liste. Alles hier ist Text, den ein
// Spieler sonst gar nicht oder auf Englisch zu sehen bekaeme.
function tsEngineText(msg)
{
	// Nach einem Rauswurf setzt die Engine "oh noes! something bad happened!"
	// hinterher. Wer entfernt wurde, soll wissen WARUM und nicht denken, das
	// Spiel sei kaputt.
	if (msg.indexOf('You were kicked') !== -1) {
		tsEngineText._rauswurf = Date.now();
		tsHinweis(T('kicked'), 7000);
		return;
	}
	// Verbindung zum Gastgeber weg. Der Gastgeber-Browser IST der Server --
	// geht er, ist die Runde vorbei. Das gehoert gesagt, nicht verschwiegen.
	//
	// ABER: nach einem Rauswurf schickt die Engine genau diese Zeile gleich
	// hinterher und ueberschrieb damit die genauere Meldung. Wer entfernt
	// wurde, las danach "Verbindung verloren" -- als waere es ein technisches
	// Problem gewesen. Die spezifischere Meldung gewinnt fuer ein paar
	// Sekunden.
	if (msg.indexOf('Host_EndGame') !== -1 || msg.indexOf('Server disconnected') !== -1) {
		if (Date.now() - (tsEngineText._rauswurf || 0) < 8000) return;
		tsHinweis(T('joinLost'), 6000);
	}
}

function tsMarker(msg)
{
	if (typeof msg !== 'string' || msg.indexOf('TSUI:') === -1)
		return;
	var stateChange = msg.indexOf('TSUI:game') !== -1 || msg.indexOf('TSUI:menu') !== -1;
	// Der Raumcode-Streifen haengt am Spielzustand: im Menue hat er nichts zu
	// suchen, im Spiel ist er die einzige Stelle, an der der Gastgeber seinen
	// Code nachsehen kann.
	if (stateChange && window.TS_LOBBY) TS_LOBBY.chip();
	if (msg.indexOf('TSUI:chat:') !== -1 && window.TS_CHAT)
		TS_CHAT.empfangen(String(msg.split('TSUI:chat:')[1] || '').split('\n')[0]);
	if (msg.indexOf('TSUI:mp:') !== -1 && window.TS_RUF)
		TS_RUF.koop(+String(msg.split('TSUI:mp:')[1] || '').split('|')[0] > 1);
	if (msg.indexOf('TSUI:mp:') !== -1 && window.TS_RUN){
		// Hoechststand, nicht Momentaufnahme: wer zum Schluss allein uebrig
		// ist, hat trotzdem zu viert gespielt.
		var mz = +String(msg.split('TSUI:mp:')[1] || '').split('|')[0];
		if (mz > (TS_RUN.maxSpieler || 1)) TS_RUN.maxSpieler = mz;
	}
	if (window.TS_CTRL && stateChange)                       // Touch-HUD (nur Touch-Geraete)
		TS_CTRL.setInGame(msg.indexOf('TSUI:game') !== -1);
	if (msg.indexOf('TSUI:game') !== -1){                     // Presets idempotent re-anwenden
		// Der Engine sagen, dass die Shell den Todes-Bildschirm uebernimmt --
		// sonst zeichnet sie ihre eigene Fassung darunter und es stehen zwei
		// SIGNAL-VERLOREN uebereinander. Gilt auch auf dem Desktop, deshalb
		// hier und nicht im touch-gebundenen Block.
		// ... und dass sie den Chat uebernimmt. Die Engine setzt ihn in der
		// Konsolenschrift (auf dem Handy rund 8 CSS-Pixel) und bricht nicht um;
		// die Shell kann beides. Gilt auf BEIDEN Plattformen -- deshalb liegt
		// #chatlog auch nicht in #touchui.
		if (window.tsCmd) tsCmd('ts_shell_death 1\nset ts_shell_chat 1\n');
		if (window.TS_CHAT) TS_CHAT.anzeigen(true);
		if (window.__ts_applyBright) __ts_applyBright();
		if (window.__ts_applyHud)    __ts_applyHud();
		// Der Name gehoert NICHT hinter TS_ORIGIN_OK: ihn zu setzen ist eine
		// reine Cvar-Sache ohne API, und im Spiegel spielt man genauso Koop.
		// Ohne das hiessen dort alle "Ueberlebender".
		if (window.TS_API) TS_API.nameNachschieben();
		if (window.TS_RUN && TS_ORIGIN_OK) TS_RUN.erfolgeWiederherstellen();
		if (window.TS_SET) TS_SET.allesAnwenden();
		// NACH TS_SET: Knopfgroesse und Linkshaender-Modus verschieben die
		// Knoepfe, und erst danach stimmt die gemessene Randbreite.
		if (window.__ts_hudRand) __ts_hudRand();
		if (window.TS_LANG) TS_LANG.anwenden();
		if (window.__ts_renderMode) __ts_renderMode('game');
		// AKTION zurueck in den Ruhezustand: wer an einer Kaufstelle stirbt,
		// faende den Knopf im naechsten Lauf sonst leuchtend vor.
		var ub0 = document.getElementById('usebtn');
		if (ub0) ub0.classList.remove('bereit');
		// Onboarding am Rechner. Auf Touch macht das TS_CTRL.setInGame -- dort
		// haengt es am HUD-Zustand und darf nicht doppelt kommen.
		if (!IS_TOUCH && window.__ts_hints && !window.__ts_hintsGezeigt){
			window.__ts_hintsGezeigt = true;
			setTimeout(function(){ __ts_hints(false); }, 600);
		}
	}
	if (msg.indexOf('TSUI:menu') !== -1){
		// Das Menue hat einen EIGENEN virtuellen Raum: 480 Zeilen, der Wert aus
		// nzportable.cfg. Ohne diese Zeile erbt das Menue nach dem ersten Spiel
		// den HUD-Preset des Spielers (380/300) -- und mehrere Zeichenroutinen in
		// m_menu.qc sind hart auf 480 ausgelegt (u. a. die Ja/Nein-Abfrage, deren
		// unterer Rand auf frame_h-160 sitzt und nur bei 480 auf die Blockkante
		// faellt). ts_touchui gehoert ebenfalls hierher und nicht erst nach
		// TSUI:game, sonst laeuft das erste Menue nach dem Kaltstart in
		// Desktop-Metrik.
		if (window.tsCmd)
			tsCmd('vid_conheight 480\n' +
				(IS_TOUCH ? 'ts_touchui 1\n' : '') +
				// Der Vermittler fuer Koop. Ab Werk zeigt net_ice_broker auf
				// master.frag-net.com -- einen FREMDEN Dienst. Wir betreiben
				// einen eigenen (systemd ts-broker, nginx-Route
				// /NZP-REBOOT-WEB/ auf totersignal.de).
				//
				// Nur der HOSTNAME gehoert hier hin: die Engine haengt
				// "/<Protokollkennung>/<raum>" selbst an und SCHNEIDET einen
				// mitgegebenen Pfad ab. "wss://totersignal.de/broker" wuerde
				// also stillschweigend zu "wss://totersignal.de/…" -- der
				// Zusatz verschwindet spurlos.
				//
				// Geschrieben wird bei JEDEM Menue-Eintritt, nicht einmalig:
				// Cvars sind aus JS nicht lesbar, also gibt es kein "ist schon
				// gesetzt?" -- dieselbe Regel wie bei Sprache und HUD-Raendern.
				'net_ice_broker "' + TS_VERMITTLER + '"\n');
		// Die Sprache gehoert hierher und nicht nur zu TSUI:game -- das Menue
		// ist die Flaeche, auf der sie am meisten zaehlt, und vor dem ersten
		// TSUI:menu nimmt die Engine keine Konsolenbefehle an.
		if (window.TS_LANG) TS_LANG.anwenden();
		if (window.__ts_renderMode) __ts_renderMode('menu');
		// Zurueck im Hauptmenue heisst: die Koop-Runde ist vorbei. Ohne das
		// haengt der Raumcode in der Shell weiter, und ein anschliessendes
		// SOLO-Spiel zeigte "Beitritt bis Runde 3" -- fuer einen Raum, den
		// es nicht mehr gibt. Nicht raeumen, solange der Gastgeber-Schirm
		// offen ist: dort ist der Code gerade erst entstanden.
		if (window.TS_LOBBY){
			var lu = document.getElementById('lobbyui');
			if (!lu || lu.style.display !== 'flex') TS_LOBBY.beenden();
		}
		// Und wir sind wieder unser eigener Server: die KI-Mitspieler-Zeile
		// gehoert zurueck in die Einstellungen.
		if (window.TS_JOIN) TS_JOIN.alsGast = false;
		if (window.TS_CHAT){ TS_CHAT.leeren(); TS_CHAT.anzeigen(false); }
		if (window.TS_RUF) TS_RUF.koop(false);
		// Einladungslink: einmal, beim ersten Menue nach dem Start. Wer mit
		// ?raum=ABC-234 ankommt, will genau eines -- beitreten. Danach ist
		// die Einladung verbraucht, sonst poppt sie bei jeder Rueckkehr ins
		// Menue wieder auf.
		if (window.__ts_raumEinladung && window.TS_JOIN){
			var einl = window.__ts_raumEinladung;
			window.__ts_raumEinladung = null;
			setTimeout(function(){ TS_JOIN.zeigen();
				var f = document.getElementById('join-adr'); if (f) f.value = einl; }, 500);
		}
		// Die Karte beschreibt die Bedienung IM SPIEL.
		if (!IS_TOUCH && window.__ts_hintsWeg) __ts_hintsWeg();
		if (window.TS_WEITER) TS_WEITER.einloesen();
	}
	// Pausemenue (CSQC): gleiche absolute Cursorlogik wie das Hauptmenue, aber im
	// HUD-Raum -- vid_conheight bleibt deshalb unangetastet, nur 1:1-Rendern.
	var mp = msg.match(/TSUI:pause:([01])/);
	if (mp){
		if (window.__ts_renderMode) __ts_renderMode(mp[1] === '1' ? 'menu' : 'game');
		if (window.TS_PAUSE) TS_PAUSE.setzen(mp[1] === '1');
		// Das Touch-HUD gehoert waehrend der Pause weg: Joystick und FEUER lagen
		// sonst ueber den Menuezeilen (der Stick genau ueber "NEIN, ICH MACHE
		// WEITER"). Vor TSUI:pause wusste die Shell von diesem Zustand nichts.
		if (window.TS_CTRL) TS_CTRL.setInGame(mp[1] === '0');
	}
	// Das Menue kann die Shell-Einstellungen aufrufen. Sie liegen in der Shell
	// (Empfindlichkeit, Y-Achse, Zielhilfe, Knopfgroesse, Linkshaender,
	// Sparsam-Modus) und waren vom Hauptmenue aus bisher nicht erreichbar --
	// man musste erst ein Spiel starten und das Zahnrad oeffnen.
	// Der Sprachumschalter im Menue (menu_opts.qc Menu_Options_ToggleLanguage)
	// meldet seine neue Wahl zurueck. Ohne diesen Zweig sprachen Spiel und
	// Overlays nach dem Umschalten zwei verschiedene Sprachen.
	var ml = msg.match(/TSUI:lang:([01])/);
	if (ml && window.TS_LANG)
		TS_LANG.uebernehmen(ml[1] === '1' ? 'de' : 'en');
	if (msg.indexOf('TSUI:open:settings') !== -1 && window.TS_SET)
		TS_SET.zeigen();
	if (msg.indexOf('TSUI:open:join') !== -1 && window.TS_JOIN)
		TS_JOIN.zeigen();
	if (msg.indexOf('TSUI:open:host') !== -1 && window.TS_LOBBY)
		TS_LOBBY.zeigen();
	if (msg.indexOf('TSUI:open:browse') !== -1 && window.TS_BROWSE)
		TS_BROWSE.zeigen();
	if (msg.indexOf('TSUI:mp:') !== -1 && window.TS_LOBBY)
		TS_LOBBY.mp(msg.split('TSUI:mp:')[1].split('\n')[0].trim());
	if (msg.indexOf('TSUI:mprow:') !== -1 && window.TS_SPIELER)
		TS_SPIELER.auf(msg.split('TSUI:mprow:')[1].split('\n')[0].trim());
	if (window.TS_DEATH){                                    // Death-Overlay (auch Desktop)
		var m = msg.match(/TSUI:dead:(-?\d+)/);
		if (m) TS_DEATH.show(parseInt(m[1], 10));
		else if (stateChange) TS_DEATH.hide();
	}
	// Ist hier gerade etwas zu benutzen? Dann hebt sich AKTION ab. Der Knopf
	// sah bisher immer gleich aus, egal ob er etwas tat.
	var mu = msg.match(/TSUI:use:([01])/);
	if (mu){
		var ub = document.getElementById('usebtn');
		if (ub) ub.classList.toggle('bereit', mu[1] === '1');
	}
	var ma = msg.match(/TSUI:ads:([01])/);                   // Aim-Lock-Glow-Sync (nur Touch-Shell)
	if (ma && window.__ts_setAds) __ts_setAds(ma[1] === '1');
	if (window.TS_DEATH){                                     // Death-Screen 2.0: Daten VOR dem dead-Trigger
		var md = msg.match(/TSUI:dstats:([^\n]*)/);
		if (md) TS_DEATH.setStats(md[1]);
		var mb = msg.match(/TSUI:dboard:([^\n]*)/);
		if (mb) TS_DEATH.addRow(mb[1]);
	}
	if (window.TS_RUN){                                       // Bestenliste
		var mn = msg.match(/TSUI:rname:([^\n]*)/);  if (mn) TS_WEITER.name = mn[1].trim();
		var mr = msg.match(/TSUI:rstart:([^\n]*)/); if (mr) { TS_RUN.onStart(mr[1]); TS_WEITER.merken(mr[1]); }
		var mh = msg.match(/TSUI:hb:([^\n]*)/);     if (mh) TS_RUN.onBeat(mh[1]);
		var mm = msg.match(/TSUI:dmeta:([^\n]*)/);  if (mm) TS_RUN.onMeta(mm[1]);
		var mc = msg.match(/TSUI:ach:([^\n]*)/);    if (mc) TS_RUN.onAch(mc[1]);
	}
	if (window.TS_FX){                                        // Treffer/Erschuetterung
		// fx:r bleibt bewusst aussen vor: Gamepad-Rumble, kein Schaden.
		var mf = msg.match(/TSUI:fx:([hkd])/);      if (mf) TS_FX.ausloesen(mf[1]);
	}
}
(function(){
	var orig = console.log.bind(console);
	console.log = function(){
		try { for (var i = 0; i < arguments.length; i++){
			var z = String(arguments[i]);
			tsMarker(z);
			tsEngineText(z);
		} } catch(e){}
		return orig.apply(null, arguments);
	};
})();

// Build-Kennung dieser Shell. Bei JEDEM Shell-Deploy zusammen mit
// web/version.json hochzaehlen (siehe CLAUDE.md) — der Update-Checker unten
// vergleicht beide und bietet Geraeten mit alter Shell einen 1-Tap-Refresh an.
var TS_BUILD = '2026-09-23a';

// JS->Engine: beliebigen Konsolenbefehl ausfuehren (FTEC.cbufadd). Dieser Build
// exportiert malloc/free nur auf Module (u. a. als _emscripten_builtin_*) —
// cbufadd erwartet sie aber als Globals -> vor dem Aufruf shimen.
function tsCmd(cmd)
{
	try {
		if (!window.FTEC || !FTEC.cbufadd || !window.Module) return false;
		if (typeof window._malloc === 'undefined')
			window._malloc = Module._malloc || Module._emscripten_builtin_malloc;
		if (typeof window._free === 'undefined')
			window._free = Module._free || Module._emscripten_builtin_free || function(){};
		FTEC.cbufadd(cmd);
		return true;
	} catch(e) { return false; }
}

// connect to canvas
var Module = {
	files:
	{
		"default.fmf" : "default.fmf",
		"nzp/game.pk3" : "nzp/game.pk3",
		"nzp/progs.pk3" : "nzp/progs.pk3"
	},
	print: function(msg)
	{	//stdout...
		console.log(msg);
		tsMarker(msg);
		tsEngineText(msg);
	},
	printErr: function(text)
	{	//stderr...
		console.log(text);
	},
	canvas: document.getElementById('canvas'),	//for webgl to attach to
	setStatus: function(text)
	{	//gets spammed some prints during startup. blame emscripten.
		if (Module.setStatus.interval)
			clearInterval(Module.setStatus.interval);
		var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
		var statusElement = document.getElementById('status');
		var progressElement = document.getElementById('progress');
		if (m) {
			text = m[1];
			progressElement.value = parseInt(m[2])*100;
			progressElement.max = parseInt(m[4])*100;
			progressElement.hidden = false;
		} else {
			progressElement.value = null;
			progressElement.max = null;
			progressElement.hidden = true;
		}
		statusElement.innerHTML = text;
		statusElement.hidden = text.length==0;
		if (window.TS_LOAD) TS_LOAD.fromEngine(text, m);
	},
//	preRun: [],
	totalDependencies: 0,
	monitorRunDependencies: function(left)
	{	//progress is progress...
		this.totalDependencies = Math.max(this.totalDependencies, left);
		Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
	},
//	onRuntimeInitialized: function(){},
	postRun:
	[	//each of these are called after main was run. we should have our mainloop set up now
		function()
		{
			if (Module["sched"] === undefined)
			{	//our main function failed to set up the main loop. ie: main didn't get called. panic.
				alert(T('initErr'));
				Module.setStatus(T('initErr'));
			}
		}
	],
};
function begin()
{
	if (Module.began)
		return;
	Module.began = true;
	document.getElementById('dropzone').hidden = true;
	document.getElementById('begin').hidden = true;
	if (window.TS_LOAD) TS_LOAD.show();
	Module.setStatus(T('ldRecv') + ' (~90 MB)...');

	// make a script. do it the hard way for the error.
	var s = document.createElement('script');
	// set it up
	s.setAttribute('src',"ftewebgl.js");
	s.setAttribute('type',"text/javascript");
	s.setAttribute('charset',"utf-8");
	s.addEventListener('error', function() {alert(T('ldEngErr')); Module.setStatus(T('ldEngErr'));}, false);
	// add to DOM
	document.head.appendChild(s);
}

//stuff to facilitate our drag+drop filesystem support
function fixupfilepath(fname, path)
{	//we just have a filename, try to guess where to put it.
	if (path != "")
		return path+fname;	//already has a path. use it. this allows people to drag+drop gamedirs.
	var ext = fname.substr(fname.lastIndexOf('.') + 1);
	if (ext == 'fmf' || ext == 'kpf')	//these are the only files that really make sense in the root.
		return fname;
	if (ext == 'bsp' || ext == 'map' || ext == 'lit' || ext == 'lux')
		return "id1/maps/" + fname;	//bsps get their own extra subdir
	return "id1/" + fname;	//probably a pak. maybe a cfg, no idea really.
}
function showfiles()
{	//print the pending file list in some pretty way
	if (Module.began)
		return;
	Module.setStatus('');
	document.getElementById('dropzone').hidden = false;
	document.getElementById('begin').hidden = false;
	var nt = "Drag gamedirs or individual package files here to make them available!<br/>Active Files:<br/><pre>";
	var keys = Object.keys(Module.files);
	for(var i = 0; i < keys.length; i++)
	{
		if (Module.files[keys[i]] instanceof ArrayBuffer)
		{
			var sz = Module.files[keys[i]].byteLength;
			if (sz > 512*1024)
				sz = (sz / (1024*1024)) + "mb";
			else if (sz > 512)
				sz = (sz / 1024) + "kb";
			else
				sz = (sz) + " bytes";
			nt += "    " + keys[i] + " ("+sz+")<br/>";
		}
		else
			nt += "    " + keys[i] + "<br/>";
	}
	nt += "</pre>("+keys.length+" files)";
	document.getElementById('dropzone').innerHTML = nt;
}
function scanfiles(item,path)
{	//for directory drops
	if (item.isFile)
	{
		item.file(function(f)
		{
			let n = fixupfilepath(f.name, path);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
    	});
	}
	else if (item.isDirectory)
	{
		// Get folder contents
		var dirReader = item.createReader();
		dirReader.readEntries(function(entries)
		{
			for (var i=0; i<entries.length; i++)
				scanfiles(entries[i], path + item.name + "/");
		});
	}
}
function gotdrop(ev)
{	//user drag+dropped something. 
	ev.preventDefault();
	for (var i = 0; i < ev.dataTransfer.items.length; i++)
		if (ev.dataTransfer.items[i].webkitGetAsEntry)
		{
			var d = ev.dataTransfer.items[i].webkitGetAsEntry();
			if (d)
				scanfiles(d, "");
		}
		else if (ev.dataTransfer.items[i].kind === 'file')
		{
			var f = ev.dataTransfer.items[i].getAsFile();
			var n = fixupfilepath(f.name);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
		}
	showfiles();
}

function T(k){ return (I18N[LANG] || I18N.en)[k]; }
// Aus einer IIFE herausgezogen: seit die Sprache zur Laufzeit wechseln kann,
// muss dieser Durchlauf wiederholbar sein. Alles, was nicht data-i18n traegt,
// wird ohnehin bei jedem Zeichnen ueber T() gebildet.
function applyI18N(){
	var t = I18N[LANG] || I18N.en;
	var els = document.querySelectorAll('[data-i18n]');
	for (var i=0;i<els.length;i++){ var k = els[i].getAttribute('data-i18n'); if (typeof t[k] === 'string') els[i].textContent = t[k]; }
	document.documentElement.setAttribute('lang', LANG);
}
applyI18N();

// --- Sprache -------------------------------------------------------------
// Eine Wahrheit, zwei Anzeigeflaechen. Der Umschalter bleibt im Menue (dort
// erwartet man ihn); die Shell speichert die Wahl, schreibt sie in die Engine
// und faerbt ihre eigenen Texte um.
var TS_LANG = {
	SCHLUESSEL: 'ts_lang',
	// In die Engine schreiben. ts_lang_set gleich mit: die Sentinel-Cvar aus
	// Localization_Init wuerde sonst beim naechsten Kaltstart wieder Deutsch
	// erzwingen (Footgun 2).
	anwenden: function(){
		if (window.tsCmd)
			tsCmd('seta cl_language ' + (LANG === 'de' ? 1 : 0) + '\nseta ts_lang_set 1\n');
	},
	// Wahl aus der Shell heraus: speichern, anzeigen, weiterreichen.
	setzen: function(code){
		if (code !== 'de' && code !== 'en') return;
		LANG = code;
		try { localStorage.setItem(this.SCHLUESSEL, code); } catch(e){}
		applyI18N();
		this.anwenden();
	},
	// Gegenrichtung: das Menue hat umgeschaltet und es per TSUI:lang gemeldet.
	// Hier wird NICHT zurueckgeschrieben -- die Engine kennt den Wert bereits,
	// und ein Rueckschreiben waere eine Rueckkopplung.
	uebernehmen: function(code){
		if (code !== 'de' && code !== 'en' || code === LANG) return;
		LANG = code;
		try { localStorage.setItem(this.SCHLUESSEL, code); } catch(e){}
		applyI18N();
		// Was schon gezeichnet ist, muss neu gezeichnet werden -- der
		// Todes-Bildschirm und die Einstellungen bauen ihren Text ueber T()
		// erst beim Oeffnen zusammen.
		if (window.TS_DEATH && TS_DEATH.stats) TS_DEATH.render(TS_DEATH.stats.rounds);
	}
};

		s.style.display = 'flex';
		this.label = T('ldRecv');
		this.rotateTip(); this.tipTimer = setInterval(this.rotateTip.bind(this), 4500);
		var self = this;
		this.t0 = Date.now();
		(function tick(){
			if (self.done) self.p = 100;
			else if (self.echt){
				// ECHTER Fortschritt, sobald die Engine Byte-Zahlen meldet.
				// Vorher stand hier ausschliesslich die Kriechkurve unten --
				// sie lief in Sekunden auf 95 % und stand dann minutenlang
				// still. Bei 90 MB ueber Mobilfunk ist so ein Balken schlimmer
				// als gar keiner: er behauptet, es sei gleich soweit.
				// Auf 97 gedeckelt, die letzten Prozent gehoeren dem Start der
				// Engine (Entpacken, main()), das die Byte-Zahl nicht abdeckt.
				var ziel = Math.min(97, self.target);
				self.p += (ziel - self.p) * 0.25;          // leicht geglaettet
				if (self.p > ziel) self.p = ziel;
			}
			else { self.p += (60 - self.p) * 0.02; if (self.p > 60) self.p = 60; }
			self.render();
			if (!self.finished) self.raf = requestAnimationFrame(tick);
		})();
		// Der Canvas ist via .emscripten{display:block} immer sichtbar (das
		// hidden-Attribut bleibt gesetzt) -> nicht darauf warten. Echtes Signal:
		// Engine-Mainloop läuft (Module.sched gesetzt) = Downloads fertig + main().
		var iv = setInterval(function(){
			if (window.Module && Module.began && Module.sched !== undefined){
				clearInterval(iv); setTimeout(function(){ self.finish(); }, 1600); // Puffer fürs erste Menü-Frame
			}
		}, 300);
		setTimeout(function(){ if (!self.finished){ try { clearInterval(iv); } catch(e){} self.finish(); } }, 90000); // harte Notbremse
	},
	rotateTip:function(){
		var tips = T('tips') || []; if (!tips.length) return;
		var e = this.el('loadtip'); if (e) e.textContent = tips[this.tipI % tips.length]; this.tipI++;
	},
	// Restzeit lesbar machen: "noch 2:15" sagt mehr als "37 %".
	zeit:function(sek){
		if (!(sek > 0) || sek > 3600) return '';
		var m = Math.floor(sek / 60), s = Math.round(sek % 60);
		return m + ':' + (s < 10 ? '0' : '') + s;
	},
	render:function(){
		var bar = this.el('loadbar'); if (bar) bar.style.width = Math.min(100, Math.round(this.p)) + '%';
		var pct = this.el('loadpct'); if (!pct) return;
		var line = (this.label || T('ldRecv'));
		if (this.total > 5e5){
			line += ' · ' + (this.loaded/1048576).toFixed(0) + '/' + (this.total/1048576).toFixed(0) + ' MB';
			if (this.rate > 0) line += ' · ' + (this.rate/1048576).toFixed(1) + ' MB/s';
			var r = this.zeit(this.rest);
			if (r) line += ' · ' + T('ldRest') + ' ' + r;
		}
		pct.textContent = line + '  ·  ' + Math.min(100, Math.round(this.p)) + '%';
	},
	fromEngine:function(text, m){
		if (!this.on) return;
		// ACHTUNG, langjaehriger Fehler: Emscripten meldet "All downloads
		// complete" bereits nach der Vorbereitungsphase (Preparing... 0/1) --
		// also SEKUNDEN bevor die 90 MB ueberhaupt anfangen. Frueher setzte
		// das hier done=true und p=100; der Balken stand danach die gesamte
		// echte Ladezeit auf 100 %, waehrend im Text noch "2/89 MB" lief.
		//
		// Fertig ist ausschliesslich, wenn die Engine-Hauptschleife laeuft
		// (Module.sched gesetzt) -- das prueft der Intervall in show().
		if (/All downloads complete/i.test(text)) return;
		if (m){ var a = parseFloat(m[2]), b = parseFloat(m[4]);
			if (b > 0){
				this.target = (a/b)*100;
				if (b > 5e5){
					this.loaded = a; this.total = b;
					this.echt = true;                     // ab jetzt echte Zahlen
					// Rate ueber ein gleitendes Mittel: die Momentanrate
					// springt bei jedem Fortschrittsbericht und liesse die
					// Restzeit unruhig wirken.
					var jetzt = Date.now();
					if (this.letztT && jetzt > this.letztT){
						var momentan = (a - this.letztB) * 1000 / (jetzt - this.letztT);
						if (momentan >= 0) this.rate = this.rate ? this.rate * 0.7 + momentan * 0.3 : momentan;
						if (this.rate > 0) this.rest = (b - a) / this.rate;
					}
					this.letztB = a; this.letztT = jetzt;
				}
			}
		}
		if (/Preparing/i.test(text)) this.label = T('ldPrep');
		else if (/Downloading|Signal|data|pk3|wasm/i.test(text)) this.label = T('ldRecv');
	},
	finish:function(){
		if (this.finished) return; this.finished = true; this.done = true; this.p = 100; this.render();
		if (this.tipTimer) clearInterval(this.tipTimer);
		if (this.raf) cancelAnimationFrame(this.raf);
		var s = this.el('loadscreen');
		if (s){ s.classList.add('fade'); setTimeout(function(){ s.style.display = 'none'; }, 650); }
	}
};

// ---- Post-Death-Overlay "SIGNAL VERLOREN" (Marker TSUI:dead:<runden>) ----
// 3,5s Verzoegerung: Death-Cam + Musik atmen lassen, dann Auswahl anbieten.
// NOCHMAL = restart (gleiche Karte), ZUR LOBBY = disconnect + ts_maps
// (eigenes MenuQC-Konsolenkommando -> springt direkt in die Solo-Kartenwahl).
var TS_DEATH = {
	timer: 0, stats: null, board: [],
	strip: function(x){ return String(x || '').replace(/\^./g, ''); },   // Quake-Farbcodes raus
	setStats: function(raw){
		var p = String(raw).split('|');
		this.board = [];                                   // neuer Death-Report beginnt
		this.stats = { rounds:+p[0]||0, score:+p[1]||0, kills:+p[2]||0, heads:+p[3]||0,
			downs:+p[4]||0, revs:+p[5]||0, secs:+p[6]||0, map:this.strip(p[7]) };
		// Einziger Punkt, an dem alle Endwerte beisammen sind. dmeta ist da
		// bereits eingetroffen -- CSQC druckt es vor dem dead-Marker.
		if (window.TS_RUN) TS_RUN.abschliessen(this.stats);
	},
	addRow: function(raw){
		var p = String(raw).split('|');
		if (this.board.length < 4)
			this.board.push({ name:this.strip(p[0]) || '???', pts:+p[1]||0, kills:+p[2]||0,
				heads:+p[3]||0, downs:+p[4]||0, revs:+p[5]||0 });
	},
	// N-Wege statt der frueheren Zwei-Wege-Logik: mit der Bestenliste sind es
	// drei Tabs, und ein weiterer soll nicht wieder eine Umschreibung kosten.
	tabs: ['stats', 'board', 'rank'],
	tab: function(which){
		this.tabs.forEach(function(name){
			var seite = document.getElementById('dpage-' + name);
			var reiter = document.getElementById('dtab-' + name);
			if (seite)  seite.hidden = (name !== which);
			if (reiter) reiter.classList.toggle('active', name === which);
		});
		if (which === 'rank' && window.TS_BOARD) TS_BOARD.laden();
	},
	render: function(r){
		var d = this.stats;
		var waves = Math.max(1, d ? d.rounds : r);
		var wv = document.getElementById('deathwaves');
		var wl = document.getElementById('deathwaveslbl');
		if (wv) wv.textContent = waves;
		if (wl) wl.textContent = T(waves === 1 ? 'waves1' : 'wavesN');
		var tabs = document.getElementById('deathtabs');
		var page = document.getElementById('dpage-stats');
		if (!d){                                           // Fallback: stale progs -> nur Rundenzahl
			if (tabs) tabs.style.display = 'none';
			if (page) page.hidden = true;
			return;
		}
		if (tabs) tabs.style.display = 'flex';
		this.tab('stats');
		function set(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; }
		set('ds-kills', d.kills);
		set('ds-heads', d.heads);
		set('ds-quota', (d.kills > 0 ? Math.round(d.heads / d.kills * 100) : 0) + '%');
		set('ds-points', d.score);
		set('ds-downs', d.downs);
		set('ds-revs', d.revs);
		var mm = Math.floor(d.secs / 60), ss = d.secs % 60;
		set('deathfoot', T('timeLbl') + ' ' + mm + ':' + (ss < 10 ? '0' : '') + ss + (d.map ? ' \u00b7 ' + d.map : ''));
		var tb = document.getElementById('dboardrows');
		if (tb){
			tb.innerHTML = '';
			for (var i = 0; i < this.board.length; i++){
				var b = this.board[i], tr = document.createElement('tr');
				[b.name, b.pts, b.kills, b.heads, b.downs, b.revs].forEach(function(v){
					var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
				});
				tb.appendChild(tr);
			}
		}
	},
	show: function(r){
		var el = document.getElementById('deathui'); if (!el) return;
		// Neue Runde, neue Vorgabe fuer die Bestenliste: nach einer Koop-Runde
		// steht sie auf Koop. Ohne das Zuruecksetzen gilt die Wahl der VORIGEN
		// Runde weiter -- und wer nach einer Vierer- eine Solo-Runde spielt,
		// suchte seinen Platz auf der falschen Liste.
		if (window.TS_BOARD) TS_BOARD.vorgabeGesetzt = false;
		var da = document.getElementById('deathart');
		if (da && !da.getAttribute('src')){ da.src = 'img/death-keyart.jpg'; da.hidden = false;
			da.onerror = function(){ da.hidden = true; }; }
		this.render(r);
		if (this.timer) clearTimeout(this.timer);
		this.timer = setTimeout(function(){
			el.style.display = 'flex';
			if (window.TS_CTRL) TS_CTRL.applyVisibility();   // Touch-HUD weg
		}, 3500);
	},
	hide: function(){
		if (this.timer){ clearTimeout(this.timer); this.timer = 0; }
		var el = document.getElementById('deathui'); if (el) el.style.display = 'none';
		if (window.TS_CTRL) TS_CTRL.applyVisibility();       // Touch-HUD zurueck
	}
};

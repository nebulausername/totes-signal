<!doctype html>
<html lang="en-us">
  <head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name=viewport content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta content="Endzeit: Untot" property="og:title" />
    	<meta content="Koop-Zombie-Shooter im Browser (WebGL) - ein Fan-Fork von Nazi Zombies: Portable. / Co-op zombie shooter in your browser, a fan fork of NZ:P." property="og:description" />
	<meta content="#6e0d00" data-react-helmet="true" name="theme-color" />
	<title>Endzeit: Untot</title>
	<link rel="icon" href="favicon.ico">
	<style>
	html,body { background-color:#000000; color:#808080; height:100%;width:100%;margin:0;padding:0; overflow:hidden; overscroll-behavior:none; }
	.emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
	div.emscripten { text-align: center; padding:0; margin: 0;}
	/* the canvas *must not* have any border or padding, or mouse coords will be wrong */
	canvas.emscripten { border: 0px none; width:100%; height:100%; padding:0; margin: 0; touch-action:none; }

	/* ---- touch controls overlay (only shown on touch devices) ---- */
	#touchui { position:fixed; inset:0; pointer-events:none; display:none; z-index:10;
	           -webkit-user-select:none; user-select:none; font-family:monospace; }
	#touchui .tbtn {
		position:absolute; pointer-events:auto; touch-action:none;
		display:flex; align-items:center; justify-content:center;
		background:rgba(20,20,20,0.35); color:rgba(230,225,210,0.85);
		border:1px solid rgba(230,225,210,0.35); border-radius:50%;
		font-size:13px; font-weight:bold; letter-spacing:0.5px;
	}
	#touchui .tbtn:active, #touchui .tbtn.held { background:rgba(110,13,0,0.55); }
	#stick {
		position:absolute; pointer-events:auto; touch-action:none;
		left:calc(24px + env(safe-area-inset-left)); bottom:calc(28px + env(safe-area-inset-bottom));
		width:150px; height:150px; border-radius:50%;
		background:rgba(20,20,20,0.30); border:1px solid rgba(230,225,210,0.30);
	}
	#stickthumb {
		position:absolute; left:50px; top:50px; width:50px; height:50px; border-radius:50%;
		background:rgba(230,225,210,0.45); pointer-events:none;
	}
	</style>
  </head>
  <body ondrop="gotdrop(event);" ondragover="event.preventDefault()">
	<div class="emscripten" id="status">Please allow/unblock our javascript to play.</div>
	<div id="dropzone" ondrop="gotdrop(event);" ondragover="event.preventDefault()" hidden=1>Drop Zone</div>
	<button type="button" onclick="begin()" id="begin" hidden=1>Click To Begin!</button>
	<div class="emscripten">
		<progress value="0" max="100" id="progress" hidden=1></progress>  
	</div>
	<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" hidden=1></canvas>
	<div id="touchui">
		<div id="stick"><div id="stickthumb"></div></div>
		<!-- right-hand action cluster; look/fire = drag/tap directly on the canvas -->
		<div class="tbtn" data-key="32"  data-code="Space"        style="right:calc(24px + env(safe-area-inset-right));  bottom:calc(120px + env(safe-area-inset-bottom)); width:64px; height:64px;">JUMP</div>
		<div class="tbtn" data-key="82"  data-code="KeyR"         style="right:calc(100px + env(safe-area-inset-right)); bottom:calc(44px + env(safe-area-inset-bottom));  width:56px; height:56px;">RLD</div>
		<div class="tbtn" data-key="69"  data-code="KeyE"         style="right:calc(168px + env(safe-area-inset-right)); bottom:calc(110px + env(safe-area-inset-bottom)); width:56px; height:56px;">USE</div>
		<div class="tbtn" data-key="81"  data-code="KeyQ"         style="right:calc(24px + env(safe-area-inset-right));  bottom:calc(196px + env(safe-area-inset-bottom)); width:56px; height:56px;">AIM</div>
		<div class="tbtn" data-key="86"  data-code="KeyV"         style="right:calc(100px + env(safe-area-inset-right)); bottom:calc(176px + env(safe-area-inset-bottom)); width:48px; height:48px;">KNF</div>
		<div class="tbtn" data-key="71"  data-code="KeyG"         style="right:calc(168px + env(safe-area-inset-right)); bottom:calc(190px + env(safe-area-inset-bottom)); width:48px; height:48px;">NADE</div>
		<div class="tbtn" data-key="17"  data-code="ControlLeft"  style="right:calc(24px + env(safe-area-inset-right));  top:calc(96px + env(safe-area-inset-top));     width:48px; height:48px;">SWAP</div>
		<div class="tbtn" data-key="27"  data-code="Escape" data-tap="1" style="right:calc(24px + env(safe-area-inset-right)); top:calc(16px + env(safe-area-inset-top)); width:48px; height:48px;">MENU</div>
		<div class="tbtn" id="fsbtn" data-tap="1"                 style="left:calc(24px + env(safe-area-inset-left)); top:calc(16px + env(safe-area-inset-top)); width:48px; height:48px;">⛶</div>
	</div>
	<script type='text/javascript'>
// connect to canvas
var Module = {
	files:
	{
		"default.fmf" : "default.fmf",
		"nzp/game.pk3" : "nzp/game.pk3",
		"nzp/progs.pk3" : "nzp/progs.pk3"
	},
	print: function(msg)
	{	//stdout...
		console.log(msg);
	},
	printErr: function(text)
	{	//stderr...
		console.log(text);
	},
	canvas: document.getElementById('canvas'),	//for webgl to attach to
	setStatus: function(text)
	{	//gets spammed some prints during startup. blame emscripten.
		if (Module.setStatus.interval)
			clearInterval(Module.setStatus.interval);
		var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
		var statusElement = document.getElementById('status');
		var progressElement = document.getElementById('progress');
		if (m) {
			text = m[1];
			progressElement.value = parseInt(m[2])*100;
			progressElement.max = parseInt(m[4])*100;
			progressElement.hidden = false;
		} else {
			progressElement.value = null;
			progressElement.max = null;
			progressElement.hidden = true;
		}
		statusElement.innerHTML = text;
		statusElement.hidden = text.length==0;
	},
//	preRun: [],
	totalDependencies: 0,
	monitorRunDependencies: function(left)
	{	//progress is progress...
		this.totalDependencies = Math.max(this.totalDependencies, left);
		Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
	},
//	onRuntimeInitialized: function(){},
	postRun:
	[	//each of these are called after main was run. we should have our mainloop set up now
		function()
		{
			if (Module["sched"] === undefined)
			{	//our main function failed to set up the main loop. ie: main didn't get called. panic.
				alert("Unable to initialise. You may need to restart your browser. If you get this often and inconsistently, consider using a 64bit browser instead.");
				Module.setStatus("Initialisation Failure");
			}
		}
	],
};
function begin()
{
	if (Module.began)
		return;
	Module.began = true;
	document.getElementById('dropzone').hidden = true;
	document.getElementById('begin').hidden = true;
	Module.setStatus('Downloading game data (~95 MB, cached after first visit)...');

	// make a script. do it the hard way for the error.
	var s = document.createElement('script');
	// set it up
	s.setAttribute('src',"ftewebgl.js");
	s.setAttribute('type',"text/javascript");
	s.setAttribute('charset',"utf-8");
	s.addEventListener('error', function() {alert("Oh noes! we got an error!"); Module.setStatus("Unable to download engine javascript");}, false);
	// add to DOM
	document.head.appendChild(s);
}

//stuff to facilitate our drag+drop filesystem support
function fixupfilepath(fname, path)
{	//we just have a filename, try to guess where to put it.
	if (path != "")
		return path+fname;	//already has a path. use it. this allows people to drag+drop gamedirs.
	var ext = fname.substr(fname.lastIndexOf('.') + 1);
	if (ext == 'fmf' || ext == 'kpf')	//these are the only files that really make sense in the root.
		return fname;
	if (ext == 'bsp' || ext == 'map' || ext == 'lit' || ext == 'lux')
		return "id1/maps/" + fname;	//bsps get their own extra subdir
	return "id1/" + fname;	//probably a pak. maybe a cfg, no idea really.
}
function showfiles()
{	//print the pending file list in some pretty way
	if (Module.began)
		return;
	Module.setStatus('');
	document.getElementById('dropzone').hidden = false;
	document.getElementById('begin').hidden = false;
	var nt = "Drag gamedirs or individual package files here to make them available!<br/>Active Files:<br/><pre>";
	var keys = Object.keys(Module.files);
	for(var i = 0; i < keys.length; i++)
	{
		if (Module.files[keys[i]] instanceof ArrayBuffer)
		{
			var sz = Module.files[keys[i]].byteLength;
			if (sz > 512*1024)
				sz = (sz / (1024*1024)) + "mb";
			else if (sz > 512)
				sz = (sz / 1024) + "kb";
			else
				sz = (sz) + " bytes";
			nt += "    " + keys[i] + " ("+sz+")<br/>";
		}
		else
			nt += "    " + keys[i] + "<br/>";
	}
	nt += "</pre>("+keys.length+" files)";
	document.getElementById('dropzone').innerHTML = nt;
}
function scanfiles(item,path)
{	//for directory drops
	if (item.isFile)
	{
		item.file(function(f)
		{
			let n = fixupfilepath(f.name, path);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
    	});
	}
	else if (item.isDirectory)
	{
		// Get folder contents
		var dirReader = item.createReader();
		dirReader.readEntries(function(entries)
		{
			for (var i=0; i<entries.length; i++)
				scanfiles(entries[i], path + item.name + "/");
		});
	}
}
function gotdrop(ev)
{	//user drag+dropped something. 
	ev.preventDefault();
	for (var i = 0; i < ev.dataTransfer.items.length; i++)
		if (ev.dataTransfer.items[i].webkitGetAsEntry)
		{
			var d = ev.dataTransfer.items[i].webkitGetAsEntry();
			if (d)
				scanfiles(d, "");
		}
		else if (ev.dataTransfer.items[i].kind === 'file')
		{
			var f = ev.dataTransfer.items[i].getAsFile();
			var n = fixupfilepath(f.name);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
		}
	showfiles();
}
if (window.location.hash != "" || Object.keys(Module.files).length)
	begin();		//if the url has a #foo.fmf then just begin instantly,
else
	showfiles();	//otherwise show our lame file dropper and wait for the user to click 'go'.

//---------------------------------------------------------------------
// Touch controls: virtual joystick -> WASD key events, action buttons
// -> key events for the binds in default.cfg/autoexec.cfg. Look + fire
// are handled natively by the engine (drag/tap on the canvas).
//---------------------------------------------------------------------
(function(){
	var isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
	if (!isTouch)
		return;
	var ui = document.getElementById('touchui');
	ui.style.display = 'block';

	var canvas = document.getElementById('canvas');
	function sendKey(type, keyCode, code)
	{	//the engine reads legacy keyCode, which the KeyboardEvent
		//constructor refuses to set - force it via defineProperty.
		var ev = new KeyboardEvent(type, {code: code, bubbles: true, cancelable: true});
		Object.defineProperty(ev, 'keyCode', {get: function(){return keyCode;}});
		Object.defineProperty(ev, 'which',   {get: function(){return keyCode;}});
		canvas.dispatchEvent(ev);
	}

	// --- action buttons ---
	var btns = ui.querySelectorAll('.tbtn[data-key]');
	for (var i = 0; i < btns.length; i++)
	{
		(function(b){
			var keyCode = parseInt(b.getAttribute('data-key'), 10);
			var code = b.getAttribute('data-code');
			var tapOnly = b.getAttribute('data-tap') == '1';
			b.addEventListener('pointerdown', function(e){
				e.preventDefault();
				b.setPointerCapture(e.pointerId);
				b.classList.add('held');
				sendKey('keydown', keyCode, code);
				if (tapOnly)
					sendKey('keyup', keyCode, code);
			});
			function release(e){
				if (!b.classList.contains('held'))
					return;
				b.classList.remove('held');
				if (!tapOnly)
					sendKey('keyup', keyCode, code);
			}
			b.addEventListener('pointerup', release);
			b.addEventListener('pointercancel', release);
		})(btns[i]);
	}

	// --- fullscreen + landscape ---
	document.getElementById('fsbtn').addEventListener('pointerdown', function(e){
		e.preventDefault();
		var el = document.documentElement;
		var req = el.requestFullscreen || el.webkitRequestFullscreen;
		if (req)
			req.call(el).catch(function(){});
		if (screen.orientation && screen.orientation.lock)
			screen.orientation.lock('landscape').catch(function(){});
	});

	// --- virtual joystick ---
	var stick = document.getElementById('stick');
	var thumb = document.getElementById('stickthumb');
	var KEYS = { w: [87,'KeyW'], a: [65,'KeyA'], s: [83,'KeyS'], d: [68,'KeyD'] };
	var held = { w:false, a:false, s:false, d:false };
	var stickPointer = -1;

	function applyDirs(next)
	{
		for (var k in KEYS)
		{
			if (next[k] && !held[k]) sendKey('keydown', KEYS[k][0], KEYS[k][1]);
			if (!next[k] && held[k]) sendKey('keyup',   KEYS[k][0], KEYS[k][1]);
			held[k] = next[k];
		}
	}
	function resetStick()
	{
		stickPointer = -1;
		thumb.style.left = '50px';
		thumb.style.top = '50px';
		applyDirs({w:false,a:false,s:false,d:false});
	}
	stick.addEventListener('pointerdown', function(e){
		e.preventDefault();
		stick.setPointerCapture(e.pointerId);
		stickPointer = e.pointerId;
	});
	stick.addEventListener('pointermove', function(e){
		if (e.pointerId != stickPointer)
			return;
		e.preventDefault();
		var r = stick.getBoundingClientRect();
		var cx = r.left + r.width/2, cy = r.top + r.height/2;
		var dx = e.clientX - cx, dy = e.clientY - cy;
		var max = r.width/2;
		var len = Math.sqrt(dx*dx + dy*dy);
		if (len > max) { dx *= max/len; dy *= max/len; }
		thumb.style.left = (50 + dx) + 'px';
		thumb.style.top  = (50 + dy) + 'px';
		var dead = max * 0.30;
		applyDirs({
			w: dy < -dead, s: dy > dead,
			a: dx < -dead, d: dx > dead
		});
	});
	stick.addEventListener('pointerup', resetStick);
	stick.addEventListener('pointercancel', resetStick);
})();
    </script>  
  </body>
</html>

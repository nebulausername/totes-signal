// ---- Erste-Runde-Hinweise, fuer beide Plattformen --------------------------
// Die Karte lag in der Touch-Klammer und beschrieb ausschliesslich Finger-
// gesten. Am Rechner gab es GAR KEIN Onboarding -- wer zum ersten Mal
// hereinkommt, muss dort raten, dass UMSCHALT sprintet und ALT die Haltung
// wechselt (beides sind keine Standardbelegungen).
//
// Der Text haengt jetzt an der Plattform, die Mechanik nicht. Umgesetzt wird
// das ATTRIBUT data-i18n und nicht der Text: applyI18N() faehrt bei jedem
// Sprachwechsel ueber alle [data-i18n] und wuerde gesetztes textContent
// wieder ueberschreiben.
(function(){
	var el = document.getElementById('hints');
	if (!el) return;
	if (!IS_TOUCH){
		var karten = el.querySelectorAll('[data-i18n]');
		for (var i = 0; i < karten.length; i++){
			var k = karten[i].getAttribute('data-i18n');
			if (I18N.de['pc' + k]){
				karten[i].setAttribute('data-i18n', 'pc' + k);
				karten[i].textContent = T('pc' + k);
			}
		}
	}
	var uhr = 0;
	window.__ts_hints = function(erzwingen){
		if (!erzwingen){ try { if (localStorage.getItem('ts_seen_hints') === '1') return; } catch(e){} }
		el.style.display = 'flex';
		// Notbremse: die Karte liegt ueber allem und sperrt die Eingabe. Wer
		// sie nicht wegklickt (weil er sie fuer Deko haelt), soll nicht
		// dauerhaft festsitzen -- nach 12 s verschwindet sie von selbst und
		// gilt als gesehen.
		if (uhr) clearTimeout(uhr);
		uhr = setTimeout(function(){
			uhr = 0;
			if (el.style.display === 'flex'){
				el.style.display = 'none';
				try { localStorage.setItem('ts_seen_hints', '1'); } catch(e){}
			}
		}, 12000);
	};
	window.__ts_hintsWeg = function(){
		if (uhr){ clearTimeout(uhr); uhr = 0; }
		el.style.display = 'none';
	};
	// Am Rechner gibt es kein TS_CTRL, das den Spielzustand kennt -- der
	// Ausloeser haengt dort direkt am Marker (siehe tsMarker).
	if (!IS_TOUCH){
		el.addEventListener('mousedown', function(e){
			e.preventDefault();
			try { localStorage.setItem('ts_seen_hints', '1'); } catch(err){}
			__ts_hintsWeg();
		});
		// Eine Taste zaehlt genauso. Wer schon WASD drueckt, will die Karte weg.
		document.addEventListener('keydown', function(){
			if (el.style.display !== 'flex') return;
			try { localStorage.setItem('ts_seen_hints', '1'); } catch(err){}
			__ts_hintsWeg();
		}, true);
	}
})();

// ---- Bild-Einstellungen, die BEIDE Plattformen brauchen --------------------
// HUD-Groesse und Helligkeit lagen bis hierher INNERHALB der Touch-Klammer
// weiter unten. Die steigt auf einem Rechner in ihrer ersten Zeile aus -- ein
// Desktop-Spieler hatte deshalb weder das eine noch das andere, und
// `__ts_applyHud` / `__ts_applyBright` waren dort schlicht undefiniert. Die
// Aufrufe in tsMarker sind mit `if (window....)` gewachst und liefen still ins
// Leere; genau deshalb ist es niemandem aufgefallen.
//
// Die MESSUNG der Knopfspalte bleibt in der Touch-Klammer (`__ts_randMessen`):
// sie misst ein Layout, das es nur dort gibt. TS_VIEW ruft sie auf, wenn es sie
// gibt -- das ist die einzige Naht zwischen beiden.
// --- Schnellrufe und Chat (Koop) -----------------------------------------
//
// `say` ist ein echtes Kommando dieser Engine -- am 2026-08-30 am gepinnten
// Build gemessen: `say <text>` UND `cmd say <text>` erreichen den Server und
// erscheinen bei allen. Es braucht dafuer KEIN QuakeC.
//
// Der Ring erscheint nur im Koop. Im Alleingang waere er ein Knopf, der
// niemanden erreicht -- und auf dem Handy ist jeder Knopf, der nichts tut,
// ein Knopf zu viel.
var TS_RUF = {
	// ASCII 33-126, ausnahmslos. Der Satz geht durch die Engine und wird bei
	// einem nativen Mitspieler mit der Spielschrift gezeichnet -- die kann
	// keine Umlaute (Footgun 3). "HILFE!" geht, "Munition?" auch; ein "ae"
	// waere haesslicher als die Wortwahl daneben.
	RUFE: ['ruf1', 'ruf2', 'ruf3', 'ruf4', 'ruf5', 'ruf6'],
	offen: false,

	koop: function(an){
		var ui = document.getElementById('touchui');
		if (ui) ui.classList.toggle('koop', !!an);
		if (!an) this.schliessen();
	},

	zeichnen: function(){
		var m = document.getElementById('rufmenu'); if (!m) return;
		var self = this;
		m.innerHTML = '';
		this.RUFE.forEach(function(k){
			var z = document.createElement('div');
			z.className = 'ruf-row'; z.textContent = T(k);
			z.addEventListener('click', function(e){ e.preventDefault(); self.senden(T(k)); });
			m.appendChild(z);
		});
		var zu = document.createElement('div');
		zu.className = 'ruf-row zu'; zu.textContent = T('gsClose');
		zu.addEventListener('click', function(e){ e.preventDefault(); self.schliessen(); });
		m.appendChild(zu);
	},

	// Ueber eine KLASSE auf/zu, nicht ueber style.display: das Blatt ist ein
	// Grid, und ein 'block' im Inline-Stil haette das Zweispaltige wieder
	// aufgehoben.
	oeffnen: function(){
		this.zeichnen();
		var m = document.getElementById('rufmenu');
		if (m) m.classList.add('auf');
		this.offen = true;
	},
	schliessen: function(){
		var m = document.getElementById('rufmenu');
		if (m) m.classList.remove('auf');
		this.offen = false;
	},
	umschalten: function(){ this.offen ? this.schliessen() : this.oeffnen(); },

	senden: function(text){
		this.schliessen();
		// Streng saeubern: die Zeichenkette landet in einer Konsolenzeile, und
		// tsCmd fuehrt JEDE Zeile aus. Ein Zeilenumbruch oder ein Semikolon
		// darin waere ein zweiter Befehl. Die Rufe sind zwar fest verdrahtet --
		// aber eine Uebersetzung ist Text, den irgendwann jemand anfasst.
		// Steuerzeichen werden durch ein LEERZEICHEN ersetzt, nicht geloescht:
		// aus "Hilfe\nquit" wuerde sonst "Hilfequit" -- harmlos, aber ein Wort,
		// das niemand geschrieben hat. Semikolon und Anfuehrungszeichen fliegen
		// ganz raus, sie trennen bzw. klammern Befehle.
		var sicher = String(text || '').replace(/[^\x20-\x7E]/g, ' ')
		                               .replace(/[;"\\]/g, '')
		                               .replace(/\s+/g, ' ').trim().slice(0, 48);
		if (!sicher) return;
		if (window.tsCmd) tsCmd('cmd say ' + sicher + '\n');
	}
};

// Der Chat gehoert der Shell (Marker TSUI:chat:, ts_shell_chat 1). Die Engine
// setzt ihn in der Konsolenschrift und bricht nicht um; auf dem Handy sind das
// rund 8 CSS-Pixel auf genau der Flaeche, auf der "ich brauche Hilfe" steht.
var TS_CHAT = {
	MAX: 4,          // mehr verdeckt das Spiel, weniger verschluckt Antworten
	DAUER: 9000,
	zeilen: [],
	timer: 0,

	anzeigen: function(an){
		var el = document.getElementById('chatlog');
		if (el) el.style.display = an ? 'flex' : 'none';
	},
	leeren: function(){
		this.zeilen = [];
		var el = document.getElementById('chatlog');
		if (el) el.innerHTML = '';
	},

	// "<id>|<name>|<text>" -- der TEXT steht ganz hinten, weil er ein '|'
	// enthalten darf; alles dahinter wieder zusammensetzen.
	empfangen: function(roh){
		var t = String(roh || '').split('|');
		if (t.length < 3) return;
		var name = t[1], text = t.slice(2).join('|');
		// Farbcodes der Engine (^xRGB, ^1..^9) entfernen -- die Shell faerbt selbst.
		text = text.replace(/\^x[0-9A-Fa-f]{3}/g, '').replace(/\^[0-9]/g, '');
		if (!text.trim()) return;
		this.zeilen.push({ name: name, text: text });
		while (this.zeilen.length > this.MAX) this.zeilen.shift();
		this.render();

		var self = this;
		if (this.timer) clearTimeout(this.timer);
		this.timer = setTimeout(function(){ self.timer = 0; self.leeren(); }, this.DAUER);
	},

	render: function(){
		var el = document.getElementById('chatlog'); if (!el) return;
		el.innerHTML = '';
		this.zeilen.forEach(function(z){
			var d = document.createElement('div');
			d.className = 'cl-zeile';
			var b = document.createElement('b');
			b.textContent = z.name + ': ';
			d.appendChild(b);
			// textContent, nicht innerHTML: der Text kommt von einem fremden
			// Mitspieler und darf kein Markup in diese Seite tragen.
			d.appendChild(document.createTextNode(z.text));
			el.appendChild(d);
		});
	}
};

var TS_VIEW = (function(){
	// gamma + v_contrastboost via Konsole. vid_hardwaregamma=1 ist gesetzt ->
	// wirkt sofort. Persistenz primaer ueber localStorage (saveconfig ist im
	// Web-Dateisystem unsicher), Re-Apply bei jedem TSUI:game.
	var BRIGHT = [
		{ key:'bright0', gamma:'1.0', cb:'1.0'  },
		{ key:'bright1', gamma:'1.3', cb:'1.15' },
		{ key:'bright2', gamma:'1.6', cb:'1.3'  }
	];
	// Das Spiel zeichnet sein HUD in einen virtuellen Raum von 480 Zeilen Hoehe
	// (vid_conheight, gesetzt in nzportable.cfg INNERHALB der unantastbaren
	// game.pk3). Kleinerer Wert = weniger virtuelle Zeilen auf derselben
	// Flaeche = groesseres HUD. An diesem Build geprueft: 480 -> 260 macht den
	// Punktestand rund 1,85x groesser, die gesamte 2D-Ebene skaliert mit.
	//
	// vid_conautoscale waere der dokumentierte Weg, hat hier aber KEINE
	// Wirkung: ein explizit gesetztes vid_conheight schlaegt die Automatik.
	// Und `fps_preset` ohne Argument oeffnet ein blockierendes Engine-Menue
	// ueber dem Spiel; niemals ohne Stufe aufrufen.
	var HUD = [
		{ key:'hud0', conheight:480 },   // Standard
		{ key:'hud1', conheight:380 },   // Gross
		{ key:'hud2', conheight:300 }    // Sehr gross
	];

	var hell = 0;
	var groesse = IS_TOUCH ? 1 : 0;      // am Handy ist GROSS die bessere Vorgabe
	try {
		hell = Math.min(BRIGHT.length - 1, Math.max(0,
			parseInt(localStorage.getItem('ts_bright') || '0', 10) || 0));
		var gespeichert = localStorage.getItem('ts_hudscale');
		if (gespeichert !== null)
			groesse = Math.min(HUD.length - 1, Math.max(0, parseInt(gespeichert, 10) || 0));
	} catch(e){}

	function stand(id, text, an){
		var st = document.getElementById(id);
		if (st){ st.textContent = text; st.classList.toggle('on', !!an); }
	}

	function helligkeitAnwenden(sichern){
		var p = BRIGHT[hell];
		tsCmd('gamma ' + p.gamma + '\nv_contrastboost ' + p.cb + '\n' +
			(sichern ? 'saveconfig user_settings.cfg\n' : ''));
		stand('gs-bright-state', T(p.key), hell > 0);
	}

	function hudAnwenden(){
		var h = HUD[groesse];
		// ts_touchui sagt dem HUD, dass unten links ein Joystick liegt. Die
		// Engine kann das nicht selbst wissen -- platform_is_web gilt auch fuer
		// den Desktop. Am Rechner MUSS die Cvar 0 bleiben, sonst reservierte
		// GetTouchRightInset Rand fuer Knoepfe, die es dort nicht gibt.
		tsCmd((IS_TOUCH ? 'ts_touchui 1\n' : '') + 'vid_conheight ' + h.conheight + '\n');
		if (window.__ts_randMessen) __ts_randMessen(h.conheight);
		stand('gs-hud-state', T(h.key), groesse > 0);
	}

	// Re-Apply bei jedem Spielstart: die Engine liest beim Kartenladen ihre
	// eigene Konfiguration neu, unsere Uebersteuerung muss danach wieder greifen.
	window.__ts_applyBright = function(){ if (hell > 0) helligkeitAnwenden(false); };
	window.__ts_applyHud    = function(){ hudAnwenden(); };
	// Einzeln aufrufbar: Knopfgroesse und Linkshaender-Modus verschieben die
	// Knoepfe, ohne den Preset anzufassen. Gibt die Rechnung zurueck --
	// tools/verify/specs/35-hud.spec.js liest sie.
	window.__ts_hudRand = function(){
		return window.__ts_randMessen ? __ts_randMessen(HUD[groesse].conheight) : undefined;
	};

	return {
		naechsteHelligkeit: function(){
			hell = (hell + 1) % BRIGHT.length;
			try { localStorage.setItem('ts_bright', String(hell)); } catch(e){}
			helligkeitAnwenden(true);
		},
		naechsteHud: function(){
			groesse = (groesse + 1) % HUD.length;
			try { localStorage.setItem('ts_hudscale', String(groesse)); } catch(e){}
			hudAnwenden();
		},
		staendeZeigen: function(){
			stand('gs-bright-state', T(BRIGHT[hell].key), hell > 0);
			stand('gs-hud-state',    T(HUD[groesse].key), groesse > 0);
		},
		// Fuer die Einstellungsliste (TS_SET). Das Zahnrad-Sheet gibt es nur
		// auf Touch -- ohne diese zwei Zeilen waeren HUD-Groesse und
		// Helligkeit am Rechner weiterhin unerreichbar, nur eben aus einem
		// anderen Grund als vorher.
		hudLabel:  function(){ return T(HUD[groesse].key); },
		hellLabel: function(){ return T(BRIGHT[hell].key); }
	};
})();

//---------------------------------------------------------------------
// Touch controls: virtual joystick -> WASD key events, action buttons
// -> key events for the binds in default.cfg/autoexec.cfg. Look + fire
// are handled natively by the engine (drag/tap on the canvas).
//---------------------------------------------------------------------
(function(){
	var isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
	if (!isTouch)
		return;
	var ui = document.getElementById('touchui');
	var canvas = document.getElementById('canvas');
	// Alle "gehaltenen" Aktionen registrieren -> bei Menue/Blur garantiert freigeben,
	// damit nie eine Taste in der Engine haengen bleibt.
	var releasers = [];
	// Aim-Zustand (Hybrid-ZIELEN): adsOn = Engine-Wahrheit via TSUI:ads-Marker;
	// aimHoldActive = klassisches Halten (Taste 81 gerade unten).
	var adsOn = false, aimHoldActive = false;
	function aimEngaged(){ return adsOn || aimHoldActive; }
	function sendKey(type, keyCode, code)
	{	//the engine reads legacy keyCode, which the KeyboardEvent
		//constructor refuses to set - force it via defineProperty.
		var ev = new KeyboardEvent(type, {code: code, bubbles: true, cancelable: true});
		Object.defineProperty(ev, 'keyCode', {get: function(){return keyCode;}});
		Object.defineProperty(ev, 'which',   {get: function(){return keyCode;}});
		// AUF document dispatchen, NICHT auf den Canvas: die Engine haengt ihre
		// Tastatur-Listener an BEIDE (jeweils capture). Ein auf dem Canvas
		// dispatchtes Ereignis laeuft document -> canvas und wird deshalb ZWEIMAL
		// verarbeitet. Bei +-Binds faellt das nicht auf (Druecken und Loslassen
		// sind idempotent) -- bei Umschaltern schon: MENUE (togglemenu) oeffnete
		// das Pausemenue und schloss es im selben Tipp, Haltung (impulse 30) sprang
		// eine Stufe zu weit. An diesem Build nachgemessen: auf dem Canvas
		// dispatchtes Escape -> TSUI:pause:1 UND :0, auf document -> nur :1.
		// Ein echter Tastendruck landet ebenfalls nur einmal (er zielt auf body,
		// der Canvas liegt dann gar nicht im Ausbreitungspfad).
		document.dispatchEvent(ev);
	}

	// --- action buttons ---
	var btns = ui.querySelectorAll('.tbtn[data-key]');
	for (var i = 0; i < btns.length; i++)
	{
		(function(b){
			var keyCode = parseInt(b.getAttribute('data-key'), 10);
			var code = b.getAttribute('data-code');
			var tapOnly = b.getAttribute('data-tap') == '1';
			b.addEventListener('pointerdown', function(e){
				e.preventDefault();
				try { b.setPointerCapture(e.pointerId); } catch(err){}
				if (b.classList.contains('held')) return;
				b.classList.add('held');
				sendKey('keydown', keyCode, code);
				if (tapOnly) { b.classList.remove('held'); sendKey('keyup', keyCode, code); }
			});
			function release(e){
				if (!b.classList.contains('held'))
					return;
				b.classList.remove('held');
				if (!tapOnly)
					sendKey('keyup', keyCode, code);
			}
			b.addEventListener('pointerup', release);
			b.addEventListener('pointercancel', release);
			b.addEventListener('lostpointercapture', release);   // Finger rutscht ab -> Taste loslassen
			releasers.push(release);
		})(btns[i]);
	}

	// --- Auto-Feuer-Zustand lebt auf IIFE-Ebene (FEUER-Block + ⚙-Sheet teilen ihn) ---
	var autoFire = false;
	try { autoFire = localStorage.getItem('ts_autofire') === '1'; } catch(e){}
	var fireStop = null;                                    // vom FEUER-Block gesetzt

	// --- dedicated FIRE button. Drives the native MOUSE1 (+attack) path so the
	// look-drag on the canvas never fires by accident (touch is captured on the
	// button). AUTO on (via ⚙-Sheet): tap FEUER to start/stop a pulsed fire
	// loop (no holding) — works for semi- and full-autos. ---
	(function(){
		var fire = document.getElementById('firebtn');
		if (!fire) return;
		function mouse(type, down){
			var r = canvas.getBoundingClientRect();
			var ev = new MouseEvent(type, { bubbles:true, cancelable:true, view:window,
				button:0, buttons: down ? 1 : 0,
				clientX: r.left + r.width/2, clientY: r.top + r.height/2 });
			canvas.dispatchEvent(ev);
		}
		var loop = 0, looping = false;
		function startLoop(){
			if (looping) return; looping = true; fire.classList.add('held');
			mouse('mousedown', true);
			loop = setInterval(function(){ mouse('mouseup', false); mouse('mousedown', true); }, 110);
		}
		function stopLoop(){
			if (!looping) return; looping = false; clearInterval(loop); loop = 0;
			fire.classList.remove('held'); mouse('mouseup', false);
		}
		fireStop = stopLoop;
		fire.addEventListener('pointerdown', function(e){
			e.preventDefault();
			try { fire.setPointerCapture(e.pointerId); } catch(err){}
			if (autoFire){ if (looping) stopLoop(); else startLoop(); return; }   // AUTO = tap-latch
			fire.classList.add('held'); mouse('mousedown', true);
		});
		function rel(){
			if (autoFire) return;                                 // AUTO latched -> ignore release
			if (!fire.classList.contains('held')) return;
			fire.classList.remove('held'); mouse('mouseup', false);
		}
		fire.addEventListener('pointerup', rel);
		fire.addEventListener('pointercancel', rel);
		fire.addEventListener('lostpointercapture', rel);
		// bei Menue/Blur: Dauerfeuer stoppen + Feuer freigeben
		releasers.push(function(){ stopLoop(); if (fire.classList.contains('held')){ fire.classList.remove('held'); mouse('mouseup', false); } });
	})();

	// --- Vollbild + Landscape-Lock (aus dem ⚙-Sheet; beim Start uebernimmt das Gate) ---
	function fsToggle(){
		var el = document.documentElement;
		var req = el.requestFullscreen || el.webkitRequestFullscreen;
		if (req) { try { var p = req.call(el); if (p && p.catch) p.catch(function(){}); } catch(e){} }
		if (screen.orientation && screen.orientation.lock)
			screen.orientation.lock('landscape').catch(function(){});
	}

	// --- Erste-Runde-Hinweise (Onboarding; via ⚙ > HILFE jederzeit wieder) ---
	// Mechanik und Notbremse liegen weiter oben in __ts_hints -- die Karte
	// gibt es auf beiden Plattformen, nur mit anderem Text.
	var hintsEl = document.getElementById('hints');
	function showHints(force){ if (window.__ts_hints) __ts_hints(force); }
	if (hintsEl) hintsEl.addEventListener('pointerdown', function(e){
		e.preventDefault(); hintsEl.style.display = 'none';
		try { localStorage.setItem('ts_seen_hints', '1'); } catch(err){}

		// Den Tipp nicht verschlucken. Die Karte liegt ueber dem ganzen Bild --
		// wer sie fuer Deko haelt und auf MENUE tippt, erlebt sonst, dass der
		// sichtbare Knopf "nichts tut". Lag einer darunter, bekommt er den Tipp
		// jetzt nachtraeglich (down UND up, sonst bliebe ein Halte-Knopf haengen).
		var unten = document.elementFromPoint(e.clientX, e.clientY);
		if (unten && unten.classList && unten.classList.contains('tbtn')){
			var bau = function(typ){
				return new PointerEvent(typ, { bubbles:true, cancelable:true,
					pointerId: e.pointerId || 1, pointerType: e.pointerType || 'touch',
					clientX: e.clientX, clientY: e.clientY });
			};
			unten.dispatchEvent(bau('pointerdown'));
			setTimeout(function(){ unten.dispatchEvent(bau('pointerup')); }, 80);
		}
	});

	// Helligkeit und HUD-Groesse leben jetzt in TS_VIEW, weiter oben und
	// ausserhalb dieser Klammer -- beides brauchte auch der Desktop.

	// --- HUD-Groesse: das Spiel zeichnet sein HUD in einen virtuellen Raum von
	// 480 Zeilen Hoehe (vid_conheight, gesetzt in nzportable.cfg INNERHALB der
	// unantastbaren game.pk3). Auf einem Handy sind die 12-px-Texte darin kaum
	// lesbar, und der Punktestand verschwindet halb hinter dem Joystick.
	//
	// Kleinerer Wert = weniger virtuelle Zeilen auf derselben Flaeche = groesseres
	// HUD. An DIESEM Build geprueft: 480 -> 260 macht den Punktestand rund 1,85x
	// groesser, die gesamte 2D-Ebene skaliert mit (Scoreboard, Hinweise, Schrift).
	//
	// vid_conautoscale waere der dokumentierte Weg, hat hier aber KEINE Wirkung:
	// ein explizit gesetztes vid_conheight schlaegt die Automatik -- ebenfalls
	// an diesem Build geprueft. Und `fps_preset` ohne Argument oeffnet ein
	// blockierendes Engine-Menue ueber dem Spiel; niemals ohne Stufe aufrufen.
	// Wie breit die Knopfspalte am rechten Rand ist -- in HUD-Einheiten, damit
	// die Engine Munition, Granaten und Kapitelkarte davor zeichnet statt
	// darunter. GetTouchLift/GetTouchShift machen dasselbe fuer den
	// Punkteblock links; rechts fehlte es, und am Bild lag "8/32" unter dem
	// Feuerknopf.
	//
	// Gemessen wird das echte Layout, nicht geschaetzt: im Linkshaender-Modus
	// wandern die Knoepfe nach links, dann faellt der Abstand von selbst auf 0.
	function meldeRandbreite(conheight){
		var ui = document.getElementById('touchui');
		if (!ui || !window.tsCmd) return;
		var breit = window.innerWidth, hoch = window.innerHeight;
		if (!breit || !hoch) return;
		var linkeste = breit;
		// Der Stick MUSS mitgezaehlt werden: im Linkshaender-Modus wandert er
		// nach rechts und stand dann genau ueber der Munitionsanzeige -- am Bild
		// gesehen, nachdem die erste Fassung nur .tbtn befragte.
		var teile = ui.querySelectorAll('.tbtn, #stick');   // Zahnrad steckt in .tbtn
		for (var i = 0; i < teile.length; i++){
			var b = teile[i];
			if (getComputedStyle(b).display === 'none') continue;
			var r = b.getBoundingClientRect();
			if (!r.width) continue;
			if (r.left + r.width / 2 < breit / 2) continue;  // linke Haelfte zaehlt nicht
			if (r.left < linkeste) linkeste = r.left;
		}
		var cssRand = Math.max(0, breit - linkeste);

		// Und dasselbe fuer OBEN LINKS: dort steht das Zahnrad, und die
		// Perk-Zeichen laufen als Spalte von der oberen linken Ecke nach unten.
		// Am Bild ueberdeckten sich Zahnrad und Speed-Cola-Flasche zur Haelfte.
		// Gemessen wird nur, was wirklich oben links steht -- im
		// Linkshaender-Modus wandert das Zahnrad nach rechts und der Wert faellt
		// von selbst auf 0.
		var unterste = 0;
		for (var j = 0; j < teile.length; j++){
			var t = teile[j];
			if (getComputedStyle(t).display === 'none') continue;
			var q = t.getBoundingClientRect();
			if (!q.width) continue;
			if (q.left + q.width / 2 >= breit / 2) continue;   // rechte Haelfte zaehlt hier nicht
			if (q.top > hoch / 3) continue;                    // und nur der obere Streifen
			if (q.bottom > unterste) unterste = q.bottom;
		}

		// CSS-Pixel -> HUD-Einheiten: die 2D-Ebene ist conheight hoch.
		var faktor = conheight / hoch;
		var rand = Math.round(cssRand * faktor) + 6;      // 6 Einheiten Luft
		var oben = unterste > 0 ? Math.round(unterste * faktor) + 4 : 0;
		tsCmd('ts_hudright ' + rand + '\nts_hudtop ' + oben + '\n');
		return { cssRand: cssRand, rand: rand, linkeste: Math.round(linkeste),
		         cssOben: Math.round(unterste), oben: oben };
	}

	// Die Messung gehoert der Touch-Schicht -- sie misst ein Layout, das es
	// nur hier gibt. TS_VIEW ruft sie ueber diesen Einstieg auf; das ist die
	// einzige Naht zwischen plattformneutraler Anzeige und Touch-Bedienung.
	window.__ts_randMessen = meldeRandbreite;

	// --- Zahnrad + Schnell-Einstellungen-Sheet (ersetzt die HUD-Buttons
	// SPRINT/DUCKEN/GR.2/AUTO/VOLLBILD -> weniger Controls, gleiche Funktion) ---
	var sheet = document.getElementById('gearsheet');
	function sheetShow(v){ if (sheet) sheet.style.display = v ? 'block' : 'none'; }
	function updateGsAuto(){
		var st = document.getElementById('gs-auto-state');
		if (st){ st.textContent = T(autoFire ? 'on' : 'off'); st.classList.toggle('on', autoFire); }
	}
	(function(){
		var gear = document.getElementById('gearbtn');
		if (!gear || !sheet) return;
		updateGsAuto();
		TS_VIEW.staendeZeigen();
		gear.addEventListener('pointerdown', function(e){
			e.preventDefault(); sheetShow(sheet.style.display !== 'block');
			if (window.TS_RUF) TS_RUF.schliessen();   // nie beide Blaetter zugleich
		});
		// Schnellrufe. pointerdown wie beim Zahnrad -- ein 'click' auf dem
		// Canvas daneben wuerde die Engine als Blickeingabe verarbeiten.
		var ruf = document.getElementById('rufbtn');
		if (ruf) ruf.addEventListener('pointerdown', function(e){
			e.preventDefault(); e.stopPropagation();
			sheetShow(false);
			if (window.TS_RUF) TS_RUF.umschalten();
		});
		function row(id, fn){
			var el = document.getElementById(id);
			if (el) el.addEventListener('pointerdown', function(e){ e.preventDefault(); e.stopPropagation(); fn(); });
		}
		row('gs-auto', function(){
			autoFire = !autoFire;
			try { localStorage.setItem('ts_autofire', autoFire ? '1' : '0'); } catch(err){}
			if (!autoFire && fireStop) fireStop();
			updateGsAuto();
		});
		row('gs-bright', function(){
			TS_VIEW.naechsteHelligkeit();
		});
		row('gs-hud', function(){
			TS_VIEW.naechsteHud();
		});
		row('gs-duck', function(){ sendKey('keydown', 18, 'AltLeft'); sendKey('keyup', 18, 'AltLeft'); });  // impulse 30
		row('gs-nade', function(){ tsCmd('impulse 25\n'); });   // 2. Granate waehlen
		row('gs-fs',   fsToggle);
		row('gs-set',   function(){ sheetShow(false); if (window.TS_SET) TS_SET.zeigen(); });
		row('gs-konto', function(){ sheetShow(false); if (window.TS_KONTO) TS_KONTO.zeigen(); });
		row('gs-help', function(){ sheetShow(false); showHints(true); });
		row('gs-close', function(){ sheetShow(false); });
		releasers.push(function(){ sheetShow(false); });
		// Tap irgendwo ausserhalb schliesst das Sheet (Capture: sieht auch Canvas-Taps)
		document.addEventListener('pointerdown', function(e){
			if (!sheet || sheet.style.display !== 'block') return;
			if (sheet.contains(e.target) || e.target === gear || gear.contains(e.target)) return;
			sheetShow(false);
		}, true);
	})();

	// --- ZIELEN hybrid (V2): kurzer Tipp = Aim-Lock an/aus (natives impulse 26,
	// inkl. Auto-Snap aufs naechste Ziel beim Einrasten), gedrueckt halten
	// (>=250ms) = klassisches Zielen solange der Finger liegt. Der Glow kommt
	// NUR vom TSUI:ads-Marker (Server kann den Latch still loesen). ---
	(function(){
		var aim = document.getElementById('aimbtn');
		if (!aim) return;
		var AIM_TAP_MS = 250;
		var downAt = 0, holdTimer = 0;
		window.__ts_setAds = function(b){
			adsOn = !!b;
			aim.classList.toggle('on', adsOn);
			aim.textContent = adsOn ? 'ZIELEN \u25cf' : 'ZIELEN';
		};
		// WICHTIG: Tap und Hold benutzen getrennte Engine-Pfade, die sich NIE
		// vermischen duerfen (button8-Release + impulse 26 im selben/naechsten
		// Server-Frame loescht den frischen Latch -- framerate-abhaengig!).
		// Darum: Tap = NUR impulse 26; Hold = keydown erst NACH der Tap-Frist.
		aim.addEventListener('pointerdown', function(e){
			e.preventDefault();
			try { aim.setPointerCapture(e.pointerId); } catch(err){}
			downAt = Date.now();
			aim.classList.add('held');
			if (!adsOn){
				holdTimer = setTimeout(function(){
					holdTimer = 0;
					if (!downAt) return;               // schon losgelassen (Tap)
					aimHoldActive = true;
					sendKey('keydown', 81, 'KeyQ');    // klassisches Hold-Aim ab 250ms
				}, AIM_TAP_MS);
			}
		});
		function aimUp(){
			if (!downAt) return;
			var dur = Date.now() - downAt;
			downAt = 0;
			if (holdTimer){ clearTimeout(holdTimer); holdTimer = 0; }
			aim.classList.remove('held');
			if (aimHoldActive){
				aimHoldActive = false;
				sendKey('keyup', 81, 'KeyQ');          // Hold beenden -- kein Impulse im Spiel
			} else if (dur < AIM_TAP_MS || adsOn){
				tsCmd('impulse 26\n');                // Tap: Lock togglen (mit Auto-Snap)
			}
		}
		aim.addEventListener('pointerup', aimUp);
		aim.addEventListener('pointercancel', aimUp);
		aim.addEventListener('lostpointercapture', aimUp);
		releasers.push(function(){
			if (holdTimer){ clearTimeout(holdTimer); holdTimer = 0; }
			if (aimHoldActive){ aimHoldActive = false; sendKey('keyup', 81, 'KeyQ'); }
			aim.classList.remove('held');
			downAt = 0;
			// Latch absichtlich NICHT loesen -- der Marker synct den Glow zurueck.
		});
	})();

	// --- Virtueller Joystick -> WASD (M1-gehaertet). Grundsaetze:
	//  * window-weite Listener, KEIN setPointerCapture (Finger geht nie verloren)
	//  * Active-Pointer-Registry = Quelle der Wahrheit: NUR echtes pointerup/
	//    pointercancel entfernt einen Finger — Blur-/Menue-Blips nicht
	//  * Soft-Release (Tasten los, Stick-Besitz bleibt) vs. Hard-Release
	//  * Watchdog re-presst nach Soft-Release und adoptiert lebende Finger
	// Der alte Killer: releaseAll() bei JEDEM blur nullte stickId, waehrend der
	// Finger noch auflag (Engine ruft window.focus() bei jedem mousedown/cbufadd
	// -> im iframe Dauer-Blur-Rauschen) -> Bewegung tot bis zum Neu-Tippen.
	var stick = document.getElementById('stick');
	var thumb = document.getElementById('stickthumb');
	var KEYS = { w:[87,'KeyW'], a:[65,'KeyA'], s:[83,'KeyS'], d:[68,'KeyD'] };
	var held = { w:false, a:false, s:false, d:false };
	var stickId = null;
	var lastDirs = { w:false, s:false, a:false, d:false };

	// Active-Pointer-Registry (Capture-Phase: sieht auch Finger auf Buttons/Canvas)
	var activePtrs = new Map();
	function inStickZone(x, y){
		var r = stick.getBoundingClientRect();
		if (!r.width) return false;
		var cx = r.left + r.width/2, cy = r.top + r.height/2;
		var half = (r.width/2) * 1.4;
		return Math.abs(x - cx) <= half && Math.abs(y - cy) <= half;
	}
	window.addEventListener('pointerdown', function(e){
		activePtrs.set(e.pointerId, { x:e.clientX, y:e.clientY, onStick: inStickZone(e.clientX, e.clientY) });
	}, true);
	window.addEventListener('pointermove', function(e){
		var p = activePtrs.get(e.pointerId);
		if (p){ p.x = e.clientX; p.y = e.clientY; }
		else if (e.buttons){
			// Unbekannter, aber gedrueckter Finger (Registry wurde hart geleert,
			// Kontakt besteht aber noch) -> wieder aufnehmen, Watchdog adoptiert.
			activePtrs.set(e.pointerId, { x:e.clientX, y:e.clientY, onStick: inStickZone(e.clientX, e.clientY) });
		}
	}, true);
	function dropPtr(e){ activePtrs.delete(e.pointerId); }
	window.addEventListener('pointerup', dropPtr, true);
	window.addEventListener('pointercancel', dropPtr, true);
	window.__ts_busy = function(){ return activePtrs.size > 0; };

	function applyDirs(next)
	{
		for (var k in KEYS)
		{
			if (next[k] && !held[k]) sendKey('keydown', KEYS[k][0], KEYS[k][1]);
			if (!next[k] && held[k]) sendKey('keyup',   KEYS[k][0], KEYS[k][1]);
			held[k] = next[k];
		}
		lastDirs = next;
	}
	function moveThumb(dx, dy){
		thumb.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
	}
	function flushPendingResize(){
		// aufgestauten M9-Aufloesungswechsel nachholen: wenn kein Finger mehr
		// aufliegt ODER der Wechsel schon >2s haengt (nie unendlich deferren)
		if (!(window.M9 && M9.pendingResize)) return;
		var stale = M9.pendingSince && (Date.now() - M9.pendingSince > 2000);
		if (activePtrs.size === 0 || stale){
			M9.pendingResize = false;
			M9.pendingSince = 0;
			if (typeof window.onresize === 'function') window.onresize();
		}
	}

	// Auto-Sprint + Longpress-Ducken (Tuning-Konstanten; live pruefen via ?tsdebug=1)
	var SPRINT_DEFLECT = 0.85;    // Anteil Vollausschlag, ab dem gesprintet wird (V2: 0.90 -> 0.85)
	var SPRINT_RETAP_MS = 2500;   // QC beendet Sprint selbst (Stamina/Richtung) -> solange gehalten, re-tippen
	// 600 statt frueher 350 ms, und die Auslenkung muss deutlich enger bleiben
	// (0.12 statt 0.28). Grund: 350 ms sind kuerzer als das normale Nachgreifen
	// am Stick -- wer kurz absetzt und dann erst schiebt, hat die Geste
	// ausgeloest. `impulse 30` SCHALTET die Haltung weiter (stehen -> ducken ->
	// liegen), und liegend gilt maxspeed * 0.25: mitten in der Horde praktisch
	// ein Todesurteil. Die Geste ist ohnehin redundant, das Zahnrad-Sheet hat
	// HALTUNG.
	var DUCK_HOLD_MS = 600;       // Stick so lange ruhig halten = Haltung wechseln
	var DUCK_MAX_LEN = 0.12;      // dabei nie weiter auslenken als das
	var lastSprintTap = 0;
	var lastAimUnlock = 0;        // Sprint-Intent loest aktiven Aim-Lock (einmal je 800ms)
	var duckTimer = 0, duckMaxLen = 0;

	function resetStick()
	{
		stickId = null;
		window.__ts_stick_active = false;
		if (duckTimer){ clearTimeout(duckTimer); duckTimer = 0; }
		stick.classList.remove('sprint');
		lastSprintTap = 0;
		moveThumb(0, 0);
		applyDirs({ w:false, s:false, a:false, d:false });
		flushPendingResize();
	}
	function stickCompute(clientX, clientY)
	{
		var r = stick.getBoundingClientRect();
		var cx = r.left + r.width/2, cy = r.top + r.height/2;
		var dx = clientX - cx, dy = clientY - cy;
		var max = r.width/2;
		var rawLen = Math.sqrt(dx*dx + dy*dy) || 1;
		if (rawLen > max){ dx *= max/rawLen; dy *= max/rawLen; }
		moveThumb(dx, dy);
		var dead = max * 0.28;
		applyDirs({ w: dy < -dead, s: dy > dead, a: dx < -dead, d: dx > dead });
		var frac = Math.min(rawLen, max) / max;
		if (frac > duckMaxLen) duckMaxLen = frac;
		// Auto-Sprint: Vollausschlag im Vorwaerts-Kegel (nicht beim Zielen).
		// impulse 23 STARTET den Sprint; stoppen macht die QC selbst (Stamina,
		// Richtungswechsel, Feuern) -> wir senden nur zeit-gedrosselte Start-Taps.
		var forward = dy < -dead && Math.abs(dy) >= 0.8 * Math.abs(dx);   // V2: Kegel weiter
		var full = rawLen >= max * SPRINT_DEFLECT;
		if (forward && full && !aimEngaged()){
			var now = Date.now();
			if (now - lastSprintTap > SPRINT_RETAP_MS){
				lastSprintTap = now;
				sendKey('keydown', 16, 'ShiftLeft');   // LSHIFT-Tap = impulse 23
				sendKey('keyup', 16, 'ShiftLeft');
			}
			stick.classList.add('sprint');
		} else if (forward && full && adsOn && !aimHoldActive){
			// Vollausschlag bei aktivem Aim-Lock = Sprint-Intent: Lock loesen,
			// Sprint-Tap folgt ~250ms spaeter (W_SprintStart verlangt zoom==0;
			// impulse 26 und impulse 23 duerfen nie im selben Frame laufen).
			var nowU = Date.now();
			if (nowU - lastAimUnlock > 800){
				lastAimUnlock = nowU;
				tsCmd('impulse 26\n');
				lastSprintTap = nowU - SPRINT_RETAP_MS + 250;
			}
		} else {
			stick.classList.remove('sprint');
			lastSprintTap = 0;
		}
	}
	stick.addEventListener('pointerdown', function(e){
		e.preventDefault();
		// Immer (neu) akquirieren - auch bei klebender alter ID -> ein noch
		// aufliegender, vom Browser ge-cancelter Finger greift sofort wieder.
		stickId = e.pointerId;
		window.__ts_stick_active = true;
		duckMaxLen = 0;
		if (duckTimer) clearTimeout(duckTimer);
		duckTimer = setTimeout(function(){
			duckTimer = 0;
			if (stickId !== null && duckMaxLen < DUCK_MAX_LEN){   // fast unbewegt = bewusstes Halten
				sendKey('keydown', 18, 'AltLeft');            // LALT-Tap = impulse 30 (Haltung)
				sendKey('keyup', 18, 'AltLeft');
				if (navigator.vibrate) try { navigator.vibrate(30); } catch(err){}
			}
		}, DUCK_HOLD_MS);
		stickCompute(e.clientX, e.clientY);
	});
	// window-weit lauschen (kein Capture): Finger wird auch ausserhalb der Box verfolgt.
	window.addEventListener('pointermove', function(e){
		if (stickId === null || e.pointerId !== stickId) return;
		e.preventDefault();
		stickCompute(e.clientX, e.clientY);
	}, { passive:false });
	function stickEnd(e){
		if (stickId === null || (e && e.pointerId !== stickId)) return;
		resetStick();
	}
	window.addEventListener('pointerup', stickEnd);
	window.addEventListener('pointercancel', stickEnd);
	window.addEventListener('lostpointercapture', stickEnd);

	// Watchdog (120ms): heilt verschluckte pointermoves, re-presst Tasten nach
	// einem Soft-Release und ADOPTIERT einen lebenden Stick-Finger, dessen
	// Besitz durch einen Hard-Release verloren ging.
	setInterval(function(){
		if (stickId !== null){
			var p = activePtrs.get(stickId);
			if (!p) resetStick();                             // Finger ist real weg
			else stickCompute(p.x, p.y);
		} else {
			var adoptId = null, adopt = null;
			activePtrs.forEach(function(pp, id){ if (adopt === null && pp.onStick){ adoptId = id; adopt = pp; } });
			if (adopt && inGame){
				stickId = adoptId;
				window.__ts_stick_active = true;
				stickCompute(adopt.x, adopt.y);
			}
			else if (held.w || held.a || held.s || held.d)
				applyDirs({ w:false, s:false, a:false, d:false });
		}
		flushPendingResize();
	}, 120);

	// --- Sichtbarkeit: HUD nur im Spiel (TSUI-Print-Bruecke) + Querformat.
	// M1: Hide laeuft ueber visibility (nicht display) und ist 500ms debounced ->
	// ein transienter Portrait-/Menue-Blip toetet den Stick nicht mehr. Input
	// wird nur bei NACHHALTIGEM Hide freigegeben (soft), nie hart resettet. ---
	var inGame = false, bridgeSeen = false, hintsShown = false;
	var hideTimer = 0;
	ui.style.display = 'block';                // Sichtbarkeit laeuft ab jetzt ueber visibility
	ui.style.visibility = 'hidden';
	function releaseKeys(){
		// Soft-Release: Engine-Tasten loslassen; stickId/Registry BLEIBEN ->
		// ein noch aufliegender Finger wird vom Watchdog nahtlos re-presst.
		applyDirs({ w:false, s:false, a:false, d:false });
		for (var j = 0; j < releasers.length; j++){ try { releasers[j](); } catch(err){} }
	}
	function releaseAll(){
		// Hard-Release: Finger sind sicher weg (App-Wechsel, pagehide).
		releaseKeys();
		resetStick();
		activePtrs.clear();
	}
	function applyVisibility(){
		var portrait = window.matchMedia('(orientation: portrait)').matches;
		// Waehrend SIGNAL VERLOREN gehoert der Bildschirm dem Todes-Panel.
		// Die Knoepfe daneben stehen zu lassen sah nicht nur unaufgeraeumt aus
		// -- man konnte sie auch antippen und blind ins Nichts feuern.
		var tot = false;
		try {
			var d = document.getElementById('deathui');
			tot = !!d && d.style.display === 'flex';
		} catch(e){}
		var show = inGame && !portrait && !tot;
		if (show){
			if (hideTimer){ clearTimeout(hideTimer); hideTimer = 0; }
			ui.style.visibility = 'visible';
		} else if (!hideTimer){
			hideTimer = setTimeout(function(){
				hideTimer = 0;
				ui.style.visibility = 'hidden';
				releaseKeys();
			}, 500);
		}
	}
	window.TS_CTRL = {
		setInGame: function(b){
			bridgeSeen = true; b = !!b;
			if (b && !hintsShown){
				hintsShown = true;
				// Frueher 4000 ms: die Karte erschien MITTEN in Runde 1 und
				// sperrte jede Eingabe, bis jemand tippte. Jetzt sofort beim
				// Betreten (da laeuft noch nichts auf einen zu) und mit einer
				// Notbremse, falls der Spieler sie ueberliest.
				setTimeout(function(){ if (inGame) showHints(false); }, 600);
			}
			if (!b && hintsEl) hintsEl.style.display = 'none';   // Hints beschreiben In-Game-Controls
			if (inGame === b) return;
			inGame = b;
			applyVisibility();
		},
		applyVisibility: applyVisibility,
		releaseAll: releaseAll
	};
	applyVisibility();   // Boot -> Hauptmenue: HUD aus, bis die Engine "im Spiel" meldet.

	// Fokus-Handling: Engine ruft window.focus() bei jedem mousedown/cbufadd ->
	// blur ist (v. a. im iframe) Dauerrauschen. Nur bei ECHTEM Fokusverlust
	// soft-releasen; hart nur, wenn die Seite wirklich in den Hintergrund geht.
	window.addEventListener('blur', function(){
		setTimeout(function(){ if (!document.hasFocus()) releaseKeys(); }, 0);
	});
	window.addEventListener('pagehide', releaseAll);
	document.addEventListener('visibilitychange', function(){ if (document.hidden) releaseAll(); });

	// Ausfallsicherung: sollte die QuakeC-Print-Bruecke je fehlen, HUD trotzdem
	// einblenden sobald das Spiel laeuft -> Steuerung geht nie komplett verloren.
	setTimeout(function failopen(){
		if (bridgeSeen) return;
		if (window.Module && Module.began){ inGame = true; applyVisibility(); return; }
		setTimeout(failopen, 2000);
	}, 10000);

	// --- Soak-Hook + Debug-Overlay (?tsdebug=1 oder localStorage.ts_debug=1) ---
	window.__ts_state = function(){
		return { stickId: stickId, held: { w:held.w, a:held.a, s:held.s, d:held.d },
			inGame: inGame, hasFocus: document.hasFocus(), ptrs: activePtrs.size,
			vis: ui.style.visibility, sprint: stick.classList.contains('sprint') };
	};
	(function(){
		var dbgOn = false;
		try { dbgOn = /[?&]tsdebug=1/.test(location.search) || localStorage.getItem('ts_debug') === '1'; } catch(e){}
		if (!dbgOn) return;
		var d = document.createElement('div');
		d.style.cssText = 'position:fixed;left:4px;bottom:4px;z-index:99;background:rgba(0,0,0,0.72);color:#7f7;font:10px/1.4 monospace;padding:3px 6px;pointer-events:none;white-space:pre';
		document.body.appendChild(d);
		setInterval(function(){
			var s = window.__ts_state();
			d.textContent = 'stick:' + s.stickId + ' ptrs:' + s.ptrs +
				' wasd:' + (s.held.w?'W':'-') + (s.held.a?'A':'-') + (s.held.s?'S':'-') + (s.held.d?'D':'-') +
				' inGame:' + (s.inGame?1:0) + ' focus:' + (s.hasFocus?1:0) +
				' vis:' + s.vis + (s.sprint ? ' SPRINT' : '');
		}, 250);
	})();
})();
    </script>  
  </body>

<!doctype html>
<html lang="de">
  <head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name=viewport content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta content="Totes Signal" property="og:title" />
    	<meta content="Totes Signal - Koop-Zombie-Shooter im Browser (WebGL). Kein Empfang. Nur Untote." property="og:description" />
	<meta content="#6e0d00" data-react-helmet="true" name="theme-color" />
	<title>Totes Signal</title>
	<link rel="icon" href="favicon.ico">
	<!-- PWA (M8): installierbar + offline. Alles relativ → funktioniert unter
	     /zombie/, GitHub Pages und local dev gleichzeitig. -->
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="apple-touch-icon" href="icons/icon-192.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Totes Signal">
	<!-- KEIN COOP/COEP: Engine ist single-threaded (kein SharedArrayBuffer/pthread);
	     Cross-Origin-Isolation wuerde den kaufmeinewebsite.de-iframe-Embed via
	     demo_security_headers.frame-ancestors brechen. Der SW braucht keine Isolation. -->
	<style>
	html,body { background-color:#000000; color:#808080; height:100%;width:100%;margin:0;padding:0; overflow:hidden; overscroll-behavior:none; }
	.emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
	div.emscripten { text-align: center; padding:0; margin: 0;}
	/* the canvas *must not* have any border or padding, or mouse coords will be wrong */
	canvas.emscripten { border: 0px none; width:100%; height:100%; padding:0; margin: 0; touch-action:none; }

	/* ---- Touch-Controls-Overlay (nur Touch-Geraete, nur im Spiel) ----
	   Alles skaliert mit vmin -> gleich bedienbar auf Handy wie Tablet. */
	#touchui { position:fixed; inset:0; pointer-events:none; display:none; z-index:10;
	           -webkit-user-select:none; user-select:none; font-family:monospace;
	           --tb: clamp(50px, 12vmin, 88px);            /* Grundbreite / Rund-Durchmesser */
	           --th: clamp(40px, 8.6vmin, 62px);           /* Pillen-Hoehe (Tap-Ziel >=40px) */
	           --stick: clamp(126px, 31vmin, 216px); }
	#touchui .tbtn {
		position:absolute; pointer-events:auto; touch-action:none;
		box-sizing:border-box; min-width:var(--tb); height:var(--th); padding:0 clamp(7px,1.5vmin,13px);
		display:flex; align-items:center; justify-content:center; text-align:center; white-space:nowrap;
		background:rgba(16,14,13,0.46); color:rgba(236,229,215,0.94);
		border:1px solid rgba(200,60,30,0.45); border-radius:11px;
		font-size:clamp(10px,1.95vmin,14px); font-weight:bold; letter-spacing:0.6px; line-height:1;
		text-shadow:0 1px 2px rgba(0,0,0,0.6); box-shadow:inset 0 0 12px rgba(0,0,0,0.42);
		transition:background 0.05s, box-shadow 0.05s;
	}
	#touchui .tbtn.big {                                    /* FEUER: primaer, gross, rot */
		height:calc(var(--th)*1.55); min-width:calc(var(--tb)*1.55); border-radius:15px;
		font-size:clamp(13px,2.6vmin,19px); background:rgba(150,18,4,0.5);
		border-color:rgba(232,42,16,0.8); color:#fff; }
	#touchui .tbtn.round {                                  /* Icon-Buttons (Zahnrad) */
		min-width:0; width:var(--tb); height:var(--tb); border-radius:50%; padding:0;
		font-size:clamp(15px,2.8vmin,22px); }
	#touchui .tbtn:active, #touchui .tbtn.held {
		background:rgba(156,20,5,0.66); border-color:#e6431f; color:#fff;
		box-shadow:0 0 16px rgba(224,46,18,0.6), inset 0 0 12px rgba(0,0,0,0.4); }
	#touchui .tbtn.big:active, #touchui .tbtn.big.held { background:rgba(214,34,12,0.82); }
	/* Schnell-Einstellungen (Slide-in links) */
	#gearsheet {
		position:absolute; left:0; top:0; bottom:0; width:clamp(230px, 46vmin, 360px);
		display:none; pointer-events:auto; touch-action:none; z-index:12; overflow-y:auto;
		background:rgba(8,6,5,0.94); border-right:1px solid rgba(210,60,30,0.55);
		padding:calc(3vmin + env(safe-area-inset-top)) 2vmin 3vmin calc(2vmin + env(safe-area-inset-left));
		box-shadow:8px 0 30px rgba(0,0,0,0.6); }
	#gearsheet .gs-title { color:#e2361a; font-weight:bold; letter-spacing:2px;
		font-size:clamp(11px,2vmin,14px); margin:2px 6px 12px; text-shadow:0 0 12px rgba(211,22,0,0.5); }
	#gearsheet .gs-row {
		display:flex; justify-content:space-between; align-items:center; gap:10px;
		margin:8px 4px; padding:13px 14px; border-radius:10px;
		background:rgba(28,21,18,0.85); border:1px solid rgba(200,60,30,0.4);
		color:#ece5d7; font-weight:bold; font-size:clamp(11px,2vmin,14px); letter-spacing:0.5px; }
	#gearsheet .gs-row:active { background:rgba(156,20,5,0.6); border-color:#e6431f; }
	#gearsheet .gs-state { color:#b8a488; }
	#gearsheet .gs-state.on { color:#3ad16a; text-shadow:0 0 10px rgba(40,170,70,0.6); }
	#gearsheet .gs-close { justify-content:center; background:rgba(60,14,6,0.7); margin-top:14px; }
	/* Auto-Sprint-Feedback am Stick */
	#stick.sprint { border-color:rgba(255,84,40,0.95);
		box-shadow:inset 0 0 24px rgba(0,0,0,0.55), 0 0 26px rgba(230,52,20,0.6); }
	#stick.sprint #stickthumb { box-shadow:0 0 22px rgba(255,74,32,0.85); }
	/* Erste-Runde-Hinweise */
	#hints { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
		background:rgba(0,0,0,0.64); font-family:monospace; -webkit-user-select:none; user-select:none; }
	#hints .hint-card { max-width:min(600px, 86vw); text-align:center; padding:20px 26px;
		background:rgba(10,8,7,0.92); border:1px solid rgba(210,22,0,0.55); border-radius:14px;
		color:#ece5d7; box-shadow:0 0 44px rgba(211,22,0,0.28); }
	#hints p { margin:10px 0; font-size:clamp(13px,2.5vmin,17px); letter-spacing:0.4px; }
	#hints .hint-ok { color:#ff5030; font-weight:bold; margin-top:16px; letter-spacing:1.5px; }
	#stick {
		position:absolute; pointer-events:auto; touch-action:none;
		left:calc(4vmin + env(safe-area-inset-left)); bottom:calc(5vmin + env(safe-area-inset-bottom));
		width:var(--stick); height:var(--stick); border-radius:50%;
		background:radial-gradient(circle at 50% 45%, rgba(34,12,9,0.32), rgba(13,11,11,0.44));
		border:1px solid rgba(200,60,30,0.40); box-shadow:inset 0 0 24px rgba(0,0,0,0.55);
	}
	#stickthumb {
		position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
		width:40%; height:40%; border-radius:50%; pointer-events:none;
		background:radial-gradient(circle at 40% 34%, rgba(242,236,223,0.62), rgba(196,62,42,0.52));
		border:1px solid rgba(232,226,212,0.5); box-shadow:0 0 14px rgba(224,52,26,0.45);
	}

	/* ---- TOTES SIGNAL: dead-radio-signal theme (start gate + loading + rotate + death) ---- */
	#mstart, #rotate, #loadscreen, #deathui {
		position:fixed; inset:0; z-index:50; display:none;
		background:radial-gradient(120% 90% at 50% 35%, #12100e 0%, #070605 55%, #000 100%);
		color:#e6e1d2; font-family:monospace;
		align-items:center; justify-content:center; text-align:center; padding:24px;
		-webkit-user-select:none; user-select:none; overflow:hidden;
	}
	#loadscreen { z-index:52; }
	/* Death-Overlay: unter Gate/Ladescreen, ueber Touch-HUD; Spiel bleibt leicht sichtbar */
	#deathui { z-index:45; background:radial-gradient(120% 90% at 50% 35%, rgba(18,10,8,0.93) 0%, rgba(7,4,3,0.95) 55%, rgba(0,0,0,0.97) 100%); }
	/* CRT scanlines */
	#mstart::before, #rotate::before, #loadscreen::before, #deathui::before {
		content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
		background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.30) 2px 3px);
	}
	/* rolling static grain + gentle flicker */
	#mstart::after, #rotate::after, #loadscreen::after, #deathui::after {
		content:''; position:absolute; inset:-60%; pointer-events:none; z-index:1; opacity:0.06;
		background-image:radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.7px);
		background-size:3px 3px; animation:tsnoise 0.9s steps(4) infinite;
	}
	@keyframes tsnoise { 0%{transform:translate(0,0)} 25%{transform:translate(-4%,3%)} 50%{transform:translate(3%,-2%)} 75%{transform:translate(-2%,-4%)} 100%{transform:translate(0,0)} }
	#mstart .box, #rotate .box, #loadscreen .box, #deathui .box { position:relative; z-index:2; max-width:92%; }
	/* Gate-Backdrop (Still via poster, Loop lazy) — liegt UNTER Scanlines/Grain */
	#mstart #gatevid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
		z-index:0; opacity:0.5; filter:brightness(1.2) saturate(0.85); }
	.ts-skull { width:min(20vw,92px); height:auto; margin:0 auto 8px; display:block; filter:drop-shadow(0 0 14px rgba(180,20,0,0.6)); opacity:0.95; }
	.ts-mark { color:#c21500; font-size:min(11vw,60px); font-weight:bold; margin:0; letter-spacing:6px;
		text-shadow:0 0 4px #c21500, 0 0 22px rgba(194,21,0,0.55); animation:tsflk 4.5s infinite; }
	.ts-sub { color:#9a9384; font-size:min(3.2vw,14px); letter-spacing:5px; margin:3px 0 0; opacity:0.85; }
	@keyframes tsflk { 0%,92%,100%{opacity:1} 93%{opacity:0.35} 94%{opacity:1} 96%{opacity:0.55} 97%{opacity:1} }
	#mstart p.hint, #rotate p, #loadscreen p.hint { font-size:min(4.2vw,17px); line-height:1.55; opacity:0.82; margin:12px 0 0; }
	#mstart .play, #deathui .play {
		margin-top:26px; display:inline-block; padding:16px 32px; cursor:pointer;
		border:2px solid #c21500; border-radius:12px; color:#f2ede0;
		font-size:min(6vw,24px); font-weight:bold; letter-spacing:1px;
		background:rgba(138,18,0,0.28); box-shadow:0 0 26px rgba(194,21,0,0.4);
	}
	#mstart .play:active, #deathui .play:active { background:rgba(194,21,0,0.55); }
	#deathui .death-actions { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
	#deathui .play { margin-top:24px; font-size:min(5vw,21px); padding:14px 26px; }
	#deathui .play.alt { border-color:rgba(210,200,180,0.55); background:rgba(40,36,32,0.4);
		box-shadow:0 0 18px rgba(0,0,0,0.5); color:#e0d9c8; }
	#deathui .play.alt:active { background:rgba(90,80,70,0.5); }
	#deathui .ts-mark { font-size:min(9vw,52px); }
	#rotate .rot { font-size:min(16vw,90px); margin-bottom:14px; display:block; color:#c21500; animation:rotwig 1.7s ease-in-out infinite; }
	@keyframes rotwig { 0%,100%{transform:rotate(6deg)} 50%{transform:rotate(-84deg)} }
	/* loading bar */
	.ts-barwrap { position:relative; z-index:2; width:min(78vw,420px); height:14px; margin:24px auto 8px;
		border:1px solid rgba(194,21,0,0.5); border-radius:7px; background:rgba(0,0,0,0.5); overflow:hidden; }
	.ts-bar { height:100%; width:0%; border-radius:6px;
		background:linear-gradient(90deg, #6e0d00, #c21500); box-shadow:0 0 12px rgba(194,21,0,0.6);
		transition:width 0.35s ease-out; }
	.ts-barwrap::after { content:''; position:absolute; inset:0; pointer-events:none;
		background:repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 8px, rgba(0,0,0,0.22) 8px 10px); }
	#loadpct { z-index:2; position:relative; font-size:min(3.6vw,14px); color:#c9c2b0; letter-spacing:1px; }
	#loadtip { z-index:2; position:relative; margin-top:16px; font-size:min(3.4vw,13px); color:#9a9384; opacity:0.85; min-height:2.8em; max-width:min(82vw,440px); }
	#loadscreen.fade { opacity:0; transition:opacity 0.6s ease; }

	/* ---- PWA install affordance (nur wenn installierbar, erst nach Load) ---- */
	#installbtn {
		position:fixed; left:50%; transform:translateX(-50%);
		bottom:calc(16px + env(safe-area-inset-bottom)); z-index:60; display:none;
		padding:10px 18px; border:1px solid #8a1200; border-radius:9px; cursor:pointer;
		background:rgba(138,18,0,0.30); color:#f2ede0; font-family:monospace; font-size:13px;
		-webkit-user-select:none; user-select:none;
	}
	#installbtn:active { background:rgba(138,18,0,0.55); }
	</style>

  <body ondrop="gotdrop(event);" ondragover="event.preventDefault()">
	<div class="emscripten" id="status">Bitte JavaScript aktivieren, um zu spielen.</div>
	<div id="dropzone" ondrop="gotdrop(event);" ondragover="event.preventDefault()" hidden=1>Drop Zone</div>
	<button type="button" onclick="begin()" id="begin" hidden=1>Click To Begin!</button>
	<div class="emscripten">
		<progress value="0" max="100" id="progress" hidden=1></progress>  
	</div>
	<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" hidden=1></canvas>
	<div id="touchui">
		<!-- Links: grosser Bewegungs-Stick. Voll nach vorn = Auto-Sprint,
		     lange halten ohne Auslenkung = Haltung/Ducken (Longpress). -->
		<div id="stick"><div id="stickthumb"></div></div>
		<!-- Rechter Kampf-Cluster (9er-Set); Umsehen/Zielen = direkt auf dem Bildschirm wischen. -->
		<div class="tbtn big" id="firebtn"                    style="right:calc(4vmin + env(safe-area-inset-right));  bottom:calc(4vmin + env(safe-area-inset-bottom));">FEUER</div>
		<div class="tbtn" data-key="82" data-code="KeyR"      style="right:calc(24vmin + env(safe-area-inset-right)); bottom:calc(5vmin + env(safe-area-inset-bottom));">LADEN</div>
		<div class="tbtn" data-key="81" data-code="KeyQ"      style="right:calc(23vmin + env(safe-area-inset-right)); bottom:calc(20vmin + env(safe-area-inset-bottom));">ZIELEN</div>
		<div class="tbtn" data-key="32" data-code="Space"     style="right:calc(4vmin + env(safe-area-inset-right));  bottom:calc(40vmin + env(safe-area-inset-bottom));">SPRUNG</div>
		<div class="tbtn" data-key="86" data-code="KeyV"      style="right:calc(42vmin + env(safe-area-inset-right)); bottom:calc(6vmin + env(safe-area-inset-bottom));">MESSER</div>
		<div class="tbtn" data-key="71" data-code="KeyG"      style="right:calc(41vmin + env(safe-area-inset-right)); bottom:calc(21vmin + env(safe-area-inset-bottom));">GRANATE</div>
		<div class="tbtn" data-key="17" data-code="ControlLeft" style="right:calc(41vmin + env(safe-area-inset-right)); bottom:calc(36vmin + env(safe-area-inset-bottom));">WAFFE</div>
		<div class="tbtn" data-key="69" data-code="KeyE"      style="right:calc(6vmin + env(safe-area-inset-right));  bottom:calc(55vmin + env(safe-area-inset-bottom));">AKTION</div>
		<!-- Ecken: Menue oben rechts, Schnell-Einstellungen (Zahnrad) oben links. -->
		<div class="tbtn" data-key="27" data-code="Escape" data-tap="1" style="right:calc(4vmin + env(safe-area-inset-right)); top:calc(4vmin + env(safe-area-inset-top));">MENÜ</div>
		<div class="tbtn round" id="gearbtn"                  style="left:calc(4vmin + env(safe-area-inset-left)); top:calc(4vmin + env(safe-area-inset-top));">⚙</div>
		<!-- Schnell-Einstellungen: alles, was keinen eigenen HUD-Button mehr braucht. -->
		<div id="gearsheet">
			<div class="gs-title" data-i18n="gsTitle"></div>
			<div class="gs-row" id="gs-auto"><span data-i18n="gsAuto"></span><span class="gs-state" id="gs-auto-state"></span></div>
			<div class="gs-row" id="gs-duck"><span data-i18n="gsDuck"></span></div>
			<div class="gs-row" id="gs-nade"><span data-i18n="gsNade"></span></div>
			<div class="gs-row" id="gs-fs"><span data-i18n="gsFs"></span></div>
			<div class="gs-row" id="gs-help"><span data-i18n="gsHelp"></span></div>
			<div class="gs-row gs-close" id="gs-close"><span data-i18n="gsClose"></span></div>

	</div>
	<!-- Erste-Runde-Hinweise (eigener Layer: ueberlebt HUD-Hide, tippen schliesst) -->
	<div id="hints"><div class="hint-card">
		<p data-i18n="hint1"></p>
		<p data-i18n="hint2"></p>
		<p data-i18n="hint3"></p>
		<p class="hint-ok" data-i18n="hintOk"></p>
	</div></div>
	<div id="mstart">
		<!-- Atmosphaerischer Loop hinterm Gate: poster zeigt sofort das Still,
		     das eigentliche Video laedt lazy in mobileStart() (nie bei
		     prefers-reduced-motion); beim Start wird es pausiert+entladen. -->
		<video id="gatevid" muted loop playsinline preload="none" poster="img/gate-poster.jpg"></video>
	<div class="box">
		<svg class="ts-skull" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 92C166 92 116 156 116 234c0 58 32 94 60 114v44c0 15 13 26 29 26h102c16 0 29-11 29-26v-44c28-20 60-56 60-114 0-78-50-142-140-142z" fill="#d8d2be"/><ellipse cx="204" cy="252" rx="42" ry="48" fill="#0a0604"/><ellipse cx="308" cy="252" rx="42" ry="48" fill="#0a0604"/><circle cx="204" cy="258" r="13" fill="#d31600"/><circle cx="308" cy="258" r="13" fill="#d31600"/><path d="M256 288l-20 46h40z" fill="#0a0604"/></svg>
		<p class="ts-mark">TOTES SIGNAL</p>
		<p class="ts-sub" data-i18n="sub"></p>
		<p class="hint" data-i18n="tap"></p>
		<span class="play" data-i18n="play"></span>
	</div></div>
	<div id="rotate"><div class="box">
		<span class="rot">⟳</span>
		<p data-i18n="rotate"></p>
	</div></div>
	<!-- Post-Death: SIGNAL VERLOREN + Auswahl (Marker TSUI:dead:<runden> aus CSQC) -->
	<div id="deathui"><div class="box">
		<svg class="ts-skull" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 92C166 92 116 156 116 234c0 58 32 94 60 114v44c0 15 13 26 29 26h102c16 0 29-11 29-26v-44c28-20 60-56 60-114 0-78-50-142-140-142z" fill="#d8d2be"/><ellipse cx="204" cy="252" rx="42" ry="48" fill="#0a0604"/><ellipse cx="308" cy="252" rx="42" ry="48" fill="#0a0604"/><circle cx="204" cy="258" r="13" fill="#d31600"/><circle cx="308" cy="258" r="13" fill="#d31600"/><path d="M256 288l-20 46h40z" fill="#0a0604"/></svg>
		<p class="ts-mark" data-i18n="deadTitle"></p>
		<p class="ts-sub" id="deathround"></p>
		<div class="death-actions">
			<span class="play" id="deathagain" data-i18n="again"></span>
			<span class="play alt" id="deathlobby" data-i18n="lobby"></span>
		</div>
	</div></div>
	<div id="loadscreen"><div class="box">
		<svg class="ts-skull" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 92C166 92 116 156 116 234c0 58 32 94 60 114v44c0 15 13 26 29 26h102c16 0 29-11 29-26v-44c28-20 60-56 60-114 0-78-50-142-140-142z" fill="#d8d2be"/><ellipse cx="204" cy="252" rx="42" ry="48" fill="#0a0604"/><ellipse cx="308" cy="252" rx="42" ry="48" fill="#0a0604"/><circle cx="204" cy="258" r="13" fill="#d31600"/><circle cx="308" cy="258" r="13" fill="#d31600"/><path d="M256 288l-20 46h40z" fill="#0a0604"/></svg>
		<p class="ts-mark">TOTES SIGNAL</p>
		<p class="ts-sub" data-i18n="sub"></p>
		<div class="ts-barwrap"><div class="ts-bar" id="loadbar"></div></div>
		<div id="loadpct"></div>
		<div id="loadtip"></div>
	</div></div>
	<button id="installbtn" type="button" data-i18n="install"></button>
	<script type='text/javascript'>
// QuakeC->JS-Bruecke: das Menue druckt bei jedem Menue<->Spiel-Wechsel einen
// TSUI-Marker (menu/main.qc m_draw). VERIFIZIERT (07/2026): die Engine gibt
// QuakeC-stdout DIREKT ueber console.log aus, NICHT ueber Module.print ->
// console.log wird hier (vor dem Engine-Script, das erst in begin() injiziert
// wird) gewrappt, damit die Engine unseren Wrapper bindet. Module.print bleibt
// als zweiter Kanal angeschlossen (schadet nicht, setInGame dedupliziert).
function tsMarker(msg)
{
	if (typeof msg !== 'string' || msg.indexOf('TSUI:') === -1)
		return;
	var stateChange = msg.indexOf('TSUI:game') !== -1 || msg.indexOf('TSUI:menu') !== -1;
	if (window.TS_CTRL && stateChange)                       // Touch-HUD (nur Touch-Geraete)
		TS_CTRL.setInGame(msg.indexOf('TSUI:game') !== -1);
	if (window.TS_DEATH){                                    // Death-Overlay (auch Desktop)
		var m = msg.match(/TSUI:dead:(-?\d+)/);
		if (m) TS_DEATH.show(parseInt(m[1], 10));
		else if (stateChange) TS_DEATH.hide();
	}
}
(function(){
	var orig = console.log.bind(console);
	console.log = function(){
		try { for (var i = 0; i < arguments.length; i++) tsMarker(String(arguments[i])); } catch(e){}
		return orig.apply(null, arguments);
	};
})();

// JS->Engine: beliebigen Konsolenbefehl ausfuehren (FTEC.cbufadd). Dieser Build
// exportiert malloc/free nur auf Module (u. a. als _emscripten_builtin_*) —
// cbufadd erwartet sie aber als Globals -> vor dem Aufruf shimen.
function tsCmd(cmd)
{
	try {
		if (!window.FTEC || !FTEC.cbufadd || !window.Module) return false;
		if (typeof window._malloc === 'undefined')
			window._malloc = Module._malloc || Module._emscripten_builtin_malloc;
		if (typeof window._free === 'undefined')
			window._free = Module._free || Module._emscripten_builtin_free || function(){};
		FTEC.cbufadd(cmd);
		return true;
	} catch(e) { return false; }
}

//stuff to facilitate our drag+drop filesystem support
function fixupfilepath(fname, path)
{	//we just have a filename, try to guess where to put it.
	if (path != "")
		return path+fname;	//already has a path. use it. this allows people to drag+drop gamedirs.
	var ext = fname.substr(fname.lastIndexOf('.') + 1);
	if (ext == 'fmf' || ext == 'kpf')	//these are the only files that really make sense in the root.
		return fname;
	if (ext == 'bsp' || ext == 'map' || ext == 'lit' || ext == 'lux')
		return "id1/maps/" + fname;	//bsps get their own extra subdir
	return "id1/" + fname;	//probably a pak. maybe a cfg, no idea really.
}
function showfiles()
{	//print the pending file list in some pretty way
	if (Module.began)
		return;
	Module.setStatus('');
	document.getElementById('dropzone').hidden = false;
	document.getElementById('begin').hidden = false;
	var nt = "Drag gamedirs or individual package files here to make them available!<br/>Active Files:<br/><pre>";
	var keys = Object.keys(Module.files);
	for(var i = 0; i < keys.length; i++)
	{
		if (Module.files[keys[i]] instanceof ArrayBuffer)
		{
			var sz = Module.files[keys[i]].byteLength;
			if (sz > 512*1024)
				sz = (sz / (1024*1024)) + "mb";
			else if (sz > 512)
				sz = (sz / 1024) + "kb";
			else
				sz = (sz) + " bytes";
			nt += "    " + keys[i] + " ("+sz+")<br/>";
		}
		else
			nt += "    " + keys[i] + "<br/>";
	}
	nt += "</pre>("+keys.length+" files)";
	document.getElementById('dropzone').innerHTML = nt;
}
function scanfiles(item,path)
{	//for directory drops
	if (item.isFile)
	{
		item.file(function(f)
		{
			let n = fixupfilepath(f.name, path);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
    	});
	}
	else if (item.isDirectory)
	{
		// Get folder contents
		var dirReader = item.createReader();
		dirReader.readEntries(function(entries)
		{
			for (var i=0; i<entries.length; i++)
				scanfiles(entries[i], path + item.name + "/");
		});
	}
}
function gotdrop(ev)
{	//user drag+dropped something. 
	ev.preventDefault();
	for (var i = 0; i < ev.dataTransfer.items.length; i++)
		if (ev.dataTransfer.items[i].webkitGetAsEntry)
		{
			var d = ev.dataTransfer.items[i].webkitGetAsEntry();
			if (d)
				scanfiles(d, "");
		}
		else if (ev.dataTransfer.items[i].kind === 'file')
		{
			var f = ev.dataTransfer.items[i].getAsFile();
			var n = fixupfilepath(f.name);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
		}
	showfiles();
}

var TS_LOAD = {
	on:false, p:0, target:0, done:false, finished:false, label:'', loaded:0, total:0,
	tipI:0, raf:0, tipTimer:0,
	el:function(id){ return document.getElementById(id); },
	show:function(){
		if (this.on) return; this.on = true;
		var s = this.el('loadscreen'); if (!s) return;
		s.style.display = 'flex';
		this.label = T('ldRecv');
		this.rotateTip(); this.tipTimer = setInterval(this.rotateTip.bind(this), 4500);
		var self = this;
		(function tick(){
			if (self.done) self.p = 100;
			else { self.p += (95 - self.p) * 0.012; if (self.p > 95) self.p = 95; }
			self.render();
			if (!self.finished) self.raf = requestAnimationFrame(tick);
		})();
		// Der Canvas ist via .emscripten{display:block} immer sichtbar (das
		// hidden-Attribut bleibt gesetzt) -> nicht darauf warten. Echtes Signal:
		// Engine-Mainloop läuft (Module.sched gesetzt) = Downloads fertig + main().
		var iv = setInterval(function(){
			if (window.Module && Module.began && Module.sched !== undefined){
				clearInterval(iv); setTimeout(function(){ self.finish(); }, 1600); // Puffer fürs erste Menü-Frame
			}
		}, 300);
		setTimeout(function(){ if (!self.finished){ try { clearInterval(iv); } catch(e){} self.finish(); } }, 90000); // harte Notbremse
	},
	rotateTip:function(){
		var tips = T('tips') || []; if (!tips.length) return;
		var e = this.el('loadtip'); if (e) e.textContent = tips[this.tipI % tips.length]; this.tipI++;
	},
	render:function(){
		var bar = this.el('loadbar'); if (bar) bar.style.width = Math.min(100, Math.round(this.p)) + '%';
		var pct = this.el('loadpct'); if (!pct) return;
		var line = (this.label || T('ldRecv'));
		if (this.total > 5e5) line += ' · ' + (this.loaded/1048576).toFixed(0) + '/' + (this.total/1048576).toFixed(0) + ' MB';
		pct.textContent = line + '  ·  ' + Math.min(100, Math.round(this.p)) + '%';
	},
	fromEngine:function(text, m){
		if (!this.on) return;
		if (/All downloads complete/i.test(text)){ this.done = true; this.p = 100; this.label = T('ldDone'); this.render(); return; }
		if (m){ var a = parseFloat(m[2]), b = parseFloat(m[4]);
			if (b > 0){ this.target = (a/b)*100; if (b > 5e5){ this.loaded = a; this.total = b; } } }
		if (/Preparing/i.test(text)) this.label = T('ldPrep');
		else if (/Downloading|Signal|data/i.test(text)) this.label = T('ldRecv');
	},
	finish:function(){
		if (this.finished) return; this.finished = true; this.done = true; this.p = 100; this.render();
		if (this.tipTimer) clearInterval(this.tipTimer);
		if (this.raf) cancelAnimationFrame(this.raf);
		var s = this.el('loadscreen');
		if (s){ s.classList.add('fade'); setTimeout(function(){ s.style.display = 'none'; }, 650); }
	}
};

// ---- M9: mobile render scaling (DPR-Cap + dynamische Auflösung) ----
// Nur auf Touch-Geräten; Desktop-Browser behalten volle Qualität. Die Engine
// liest in ihrem window.onresize `scale = window.devicePixelRatio` und rendert
// den Canvas-Backbuffer in CSS-Größe × scale. Auf 3x-Phones = 9× Fragmente.
// Wir cappen NUR devicePixelRatio (per Getter) — die engine-eigene onresize
// (inkl. korrektem FTEC.evcb.resize für Input-Koordinaten) nutzt dann unseren
// Wert. Für dynamische Auflösung ändern wir M9.eff und rufen window.onresize().
var M9 = { on:false, cap:1.5, eff:1.5, floor:0.66, tier:'mid' };
(function(){
	if (!IS_TOUCH) return;
	var dpr   = window.devicePixelRatio || 1;
	var cores = navigator.hardwareConcurrency || 4;
	var mem   = navigator.deviceMemory || 4;
	var tier = 'mid';
	if (cores <= 4 || mem <= 3)          tier = 'low';
	else if (cores >= 8 && mem >= 6)     tier = 'high';
	M9.tier = tier;
	M9.cap  = ({ low:1.0, mid:1.25, high:1.5 })[tier];
	M9.eff  = Math.min(dpr, M9.cap);          // Start: gecappter nativer DPR
	try {
		Object.defineProperty(window, 'devicePixelRatio', {
			configurable:true, get:function(){ return M9.eff; }
		});
		M9.on = true;
	} catch(e) { M9.on = false; }
})();

function startDynRes()
{	if (!M9.on) return;
	var STEPS = [1.5, 1.25, 1.0, 0.85, 0.75, 0.66].filter(function(s){ return s <= M9.cap + 1e-3; });
	if (STEPS[STEPS.length-1] > M9.floor) STEPS.push(M9.floor);
	var idx = 0;                              // 0 = höchste (Cap)
	var ema = 60, last = 0, lowSince = 0, highSince = 0;
	function apply(){
		M9.eff = STEPS[idx];
		// Nicht mitten in der Beruehrung resizen: ein Canvas-Resize kann ein
		// pointercancel auf JEDEN gehaltenen Finger ausloesen (Joystick UND
		// Look/Feuer) — der beruechtigte "nach paar Sekunden tot"-Bug. Warten,
		// bis kein Finger mehr aufliegt; der Touch-Watchdog holt den Wechsel
		// via flushPendingResize() nach (max. 2s Verzoegerung).
		if (window.__ts_stick_active || (window.__ts_busy && window.__ts_busy())){
			M9.pendingResize = true;
			if (!M9.pendingSince) M9.pendingSince = Date.now();
			return;
		}
		M9.pendingSince = 0;
		if (typeof window.onresize === 'function') window.onresize();  // engine-Resize-Pfad erneut auslösen
	}
	function tick(now){
		if (last){ var dt = now - last; if (dt > 0) ema = ema*0.9 + Math.min(1000/dt, 144)*0.1; }
		last = now;
		if (window.Module && Module.began && document.visibilityState === 'visible'){
			if (ema < 50){ highSince = 0; if (!lowSince) lowSince = now;
				if (now - lowSince > 2000 && idx < STEPS.length-1){ idx++; apply(); lowSince = now; } }
			else if (ema > 58){ lowSince = 0; if (!highSince) highSince = now;
				if (now - highSince > 6000 && idx > 0){ idx--; apply(); highSince = now; } }
			else { lowSince = 0; highSince = 0; }
		}
		requestAnimationFrame(tick);
	}
	requestAnimationFrame(tick);
}

//---------------------------------------------------------------------
// Touch controls: virtual joystick -> WASD key events, action buttons
// -> key events for the binds in default.cfg/autoexec.cfg. Look + fire
// are handled natively by the engine (drag/tap on the canvas).
//---------------------------------------------------------------------
(function(){
	var isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
	if (!isTouch)
		return;
	var ui = document.getElementById('touchui');
	var canvas = document.getElementById('canvas');
	// Alle "gehaltenen" Aktionen registrieren -> bei Menue/Blur garantiert freigeben,
	// damit nie eine Taste in der Engine haengen bleibt.
	var releasers = [];
	function sendKey(type, keyCode, code)
	{	//the engine reads legacy keyCode, which the KeyboardEvent
		//constructor refuses to set - force it via defineProperty.
		var ev = new KeyboardEvent(type, {code: code, bubbles: true, cancelable: true});
		Object.defineProperty(ev, 'keyCode', {get: function(){return keyCode;}});
		Object.defineProperty(ev, 'which',   {get: function(){return keyCode;}});
		canvas.dispatchEvent(ev);
	}

	// --- action buttons ---
	var btns = ui.querySelectorAll('.tbtn[data-key]');
	for (var i = 0; i < btns.length; i++)
	{
		(function(b){
			var keyCode = parseInt(b.getAttribute('data-key'), 10);
			var code = b.getAttribute('data-code');
			var tapOnly = b.getAttribute('data-tap') == '1';
			b.addEventListener('pointerdown', function(e){
				e.preventDefault();
				try { b.setPointerCapture(e.pointerId); } catch(err){}
				if (b.classList.contains('held')) return;
				b.classList.add('held');
				sendKey('keydown', keyCode, code);
				if (tapOnly) { b.classList.remove('held'); sendKey('keyup', keyCode, code); }
			});
			function release(e){
				if (!b.classList.contains('held'))
					return;
				b.classList.remove('held');
				if (!tapOnly)
					sendKey('keyup', keyCode, code);
			}
			b.addEventListener('pointerup', release);
			b.addEventListener('pointercancel', release);
			b.addEventListener('lostpointercapture', release);   // Finger rutscht ab -> Taste loslassen
			releasers.push(release);
		})(btns[i]);
	}

	// --- Auto-Feuer-Zustand lebt auf IIFE-Ebene (FEUER-Block + ⚙-Sheet teilen ihn) ---
	var autoFire = false;
	try { autoFire = localStorage.getItem('ts_autofire') === '1'; } catch(e){}
	var fireStop = null;                                    // vom FEUER-Block gesetzt

	// --- dedicated FIRE button. Drives the native MOUSE1 (+attack) path so the
	// look-drag on the canvas never fires by accident (touch is captured on the
	// button). AUTO on (via ⚙-Sheet): tap FEUER to start/stop a pulsed fire
	// loop (no holding) — works for semi- and full-autos. ---
	(function(){
		var fire = document.getElementById('firebtn');
		if (!fire) return;
		function mouse(type, down){
			var r = canvas.getBoundingClientRect();
			var ev = new MouseEvent(type, { bubbles:true, cancelable:true, view:window,
				button:0, buttons: down ? 1 : 0,
				clientX: r.left + r.width/2, clientY: r.top + r.height/2 });
			canvas.dispatchEvent(ev);
		}
		var loop = 0, looping = false;
		function startLoop(){
			if (looping) return; looping = true; fire.classList.add('held');
			mouse('mousedown', true);
			loop = setInterval(function(){ mouse('mouseup', false); mouse('mousedown', true); }, 110);
		}
		function stopLoop(){
			if (!looping) return; looping = false; clearInterval(loop); loop = 0;
			fire.classList.remove('held'); mouse('mouseup', false);
		}
		fireStop = stopLoop;
		fire.addEventListener('pointerdown', function(e){
			e.preventDefault();
			try { fire.setPointerCapture(e.pointerId); } catch(err){}
			if (autoFire){ if (looping) stopLoop(); else startLoop(); return; }   // AUTO = tap-latch
			fire.classList.add('held'); mouse('mousedown', true);
		});
		function rel(){
			if (autoFire) return;                                 // AUTO latched -> ignore release
			if (!fire.classList.contains('held')) return;
			fire.classList.remove('held'); mouse('mouseup', false);
		}
		fire.addEventListener('pointerup', rel);
		fire.addEventListener('pointercancel', rel);
		fire.addEventListener('lostpointercapture', rel);
		// bei Menue/Blur: Dauerfeuer stoppen + Feuer freigeben
		releasers.push(function(){ stopLoop(); if (fire.classList.contains('held')){ fire.classList.remove('held'); mouse('mouseup', false); } });
	})();

	// --- Vollbild + Landscape-Lock (aus dem ⚙-Sheet; beim Start uebernimmt das Gate) ---
	function fsToggle(){
		var el = document.documentElement;
		var req = el.requestFullscreen || el.webkitRequestFullscreen;
		if (req) { try { var p = req.call(el); if (p && p.catch) p.catch(function(){}); } catch(e){} }
		if (screen.orientation && screen.orientation.lock)
			screen.orientation.lock('landscape').catch(function(){});
	}

	// --- Erste-Runde-Hinweise (Onboarding; via ⚙ > HILFE jederzeit wieder) ---
	var hintsEl = document.getElementById('hints');
	function showHints(force){
		if (!hintsEl) return;
		if (!force){ try { if (localStorage.getItem('ts_seen_hints') === '1') return; } catch(e){} }
		hintsEl.style.display = 'flex';
	}
	if (hintsEl) hintsEl.addEventListener('pointerdown', function(e){
		e.preventDefault(); hintsEl.style.display = 'none';
		try { localStorage.setItem('ts_seen_hints', '1'); } catch(err){}
	});

	// --- Zahnrad + Schnell-Einstellungen-Sheet (ersetzt die HUD-Buttons
	// SPRINT/DUCKEN/GR.2/AUTO/VOLLBILD -> weniger Controls, gleiche Funktion) ---
	var sheet = document.getElementById('gearsheet');
	function sheetShow(v){ if (sheet) sheet.style.display = v ? 'block' : 'none'; }
	function updateGsAuto(){
		var st = document.getElementById('gs-auto-state');
		if (st){ st.textContent = T(autoFire ? 'on' : 'off'); st.classList.toggle('on', autoFire); }
	}
	(function(){
		var gear = document.getElementById('gearbtn');
		if (!gear || !sheet) return;
		updateGsAuto();
		gear.addEventListener('pointerdown', function(e){
			e.preventDefault(); sheetShow(sheet.style.display !== 'block');
		});
		function row(id, fn){
			var el = document.getElementById(id);
			if (el) el.addEventListener('pointerdown', function(e){ e.preventDefault(); e.stopPropagation(); fn(); });
		}
		row('gs-auto', function(){
			autoFire = !autoFire;
			try { localStorage.setItem('ts_autofire', autoFire ? '1' : '0'); } catch(err){}
			if (!autoFire && fireStop) fireStop();
			updateGsAuto();
		});
		row('gs-duck', function(){ sendKey('keydown', 18, 'AltLeft'); sendKey('keyup', 18, 'AltLeft'); });  // impulse 30
		row('gs-nade', function(){ tsCmd('impulse 25\n'); });   // 2. Granate waehlen
		row('gs-fs',   fsToggle);
		row('gs-help', function(){ sheetShow(false); showHints(true); });
		row('gs-close', function(){ sheetShow(false); });
		releasers.push(function(){ sheetShow(false); });
	})();

	// --- Virtueller Joystick -> WASD (M1-gehaertet). Grundsaetze:
	//  * window-weite Listener, KEIN setPointerCapture (Finger geht nie verloren)
	//  * Active-Pointer-Registry = Quelle der Wahrheit: NUR echtes pointerup/
	//    pointercancel entfernt einen Finger — Blur-/Menue-Blips nicht
	//  * Soft-Release (Tasten los, Stick-Besitz bleibt) vs. Hard-Release
	//  * Watchdog re-presst nach Soft-Release und adoptiert lebende Finger
	// Der alte Killer: releaseAll() bei JEDEM blur nullte stickId, waehrend der
	// Finger noch auflag (Engine ruft window.focus() bei jedem mousedown/cbufadd
	// -> im iframe Dauer-Blur-Rauschen) -> Bewegung tot bis zum Neu-Tippen.
	var stick = document.getElementById('stick');
	var thumb = document.getElementById('stickthumb');
	var KEYS = { w:[87,'KeyW'], a:[65,'KeyA'], s:[83,'KeyS'], d:[68,'KeyD'] };
	var held = { w:false, a:false, s:false, d:false };
	var stickId = null;
	var lastDirs = { w:false, s:false, a:false, d:false };

	// Active-Pointer-Registry (Capture-Phase: sieht auch Finger auf Buttons/Canvas)
	var activePtrs = new Map();
	function inStickZone(x, y){
		var r = stick.getBoundingClientRect();
		if (!r.width) return false;
		var cx = r.left + r.width/2, cy = r.top + r.height/2;
		var half = (r.width/2) * 1.4;
		return Math.abs(x - cx) <= half && Math.abs(y - cy) <= half;
	}
	window.addEventListener('pointerdown', function(e){
		activePtrs.set(e.pointerId, { x:e.clientX, y:e.clientY, onStick: inStickZone(e.clientX, e.clientY) });
	}, true);
	window.addEventListener('pointermove', function(e){
		var p = activePtrs.get(e.pointerId);
		if (p){ p.x = e.clientX; p.y = e.clientY; }
		else if (e.buttons){
			// Unbekannter, aber gedrueckter Finger (Registry wurde hart geleert,
			// Kontakt besteht aber noch) -> wieder aufnehmen, Watchdog adoptiert.
			activePtrs.set(e.pointerId, { x:e.clientX, y:e.clientY, onStick: inStickZone(e.clientX, e.clientY) });
		}
	}, true);
	function dropPtr(e){ activePtrs.delete(e.pointerId); }
	window.addEventListener('pointerup', dropPtr, true);
	window.addEventListener('pointercancel', dropPtr, true);
	window.__ts_busy = function(){ return activePtrs.size > 0; };

	function applyDirs(next)
	{
		for (var k in KEYS)
		{
			if (next[k] && !held[k]) sendKey('keydown', KEYS[k][0], KEYS[k][1]);
			if (!next[k] && held[k]) sendKey('keyup',   KEYS[k][0], KEYS[k][1]);
			held[k] = next[k];
		}
		lastDirs = next;
	}
	function moveThumb(dx, dy){
		thumb.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
	}
	function flushPendingResize(){
		// aufgestauten M9-Aufloesungswechsel nachholen: wenn kein Finger mehr
		// aufliegt ODER der Wechsel schon >2s haengt (nie unendlich deferren)
		if (!(window.M9 && M9.pendingResize)) return;
		var stale = M9.pendingSince && (Date.now() - M9.pendingSince > 2000);
		if (activePtrs.size === 0 || stale){
			M9.pendingResize = false;
			M9.pendingSince = 0;
			if (typeof window.onresize === 'function') window.onresize();
		}
	}

	// Auto-Sprint + Longpress-Ducken (Tuning-Konstanten; live pruefen via ?tsdebug=1)
	var SPRINT_DEFLECT = 0.90;    // Anteil Vollausschlag, ab dem gesprintet wird
	var SPRINT_RETAP_MS = 3000;   // QC beendet Sprint selbst (Stamina/Richtung) -> solange gehalten, re-tippen
	var DUCK_HOLD_MS = 350;       // Stick so lange ruhig halten = Haltung wechseln
	var lastSprintTap = 0;
	var duckTimer = 0, duckMaxLen = 0;
	function aimHeld(){
		var z = ui.querySelector('[data-key="81"]');
		return !!(z && z.classList.contains('held'));
	}

	function resetStick()
	{
		stickId = null;
		window.__ts_stick_active = false;
		if (duckTimer){ clearTimeout(duckTimer); duckTimer = 0; }
		stick.classList.remove('sprint');
		lastSprintTap = 0;
		moveThumb(0, 0);
		applyDirs({ w:false, s:false, a:false, d:false });
		flushPendingResize();
	}
	function stickCompute(clientX, clientY)
	{
		var r = stick.getBoundingClientRect();
		var cx = r.left + r.width/2, cy = r.top + r.height/2;
		var dx = clientX - cx, dy = clientY - cy;
		var max = r.width/2;
		var rawLen = Math.sqrt(dx*dx + dy*dy) || 1;
		if (rawLen > max){ dx *= max/rawLen; dy *= max/rawLen; }
		moveThumb(dx, dy);
		var dead = max * 0.28;
		applyDirs({ w: dy < -dead, s: dy > dead, a: dx < -dead, d: dx > dead });
		var frac = Math.min(rawLen, max) / max;
		if (frac > duckMaxLen) duckMaxLen = frac;
		// Auto-Sprint: Vollausschlag im Vorwaerts-Kegel (nicht beim Zielen).
		// impulse 23 STARTET den Sprint; stoppen macht die QC selbst (Stamina,
		// Richtungswechsel, Feuern) -> wir senden nur zeit-gedrosselte Start-Taps.
		var forward = dy < -dead && Math.abs(dy) >= Math.abs(dx);
		var full = rawLen >= max * SPRINT_DEFLECT;
		if (forward && full && !aimHeld()){
			var now = Date.now();
			if (now - lastSprintTap > SPRINT_RETAP_MS){
				lastSprintTap = now;
				sendKey('keydown', 16, 'ShiftLeft');   // LSHIFT-Tap = impulse 23
				sendKey('keyup', 16, 'ShiftLeft');
			}
			stick.classList.add('sprint');
		} else {
			stick.classList.remove('sprint');
			lastSprintTap = 0;
		}
	}
	stick.addEventListener('pointerdown', function(e){
		e.preventDefault();
		// Immer (neu) akquirieren - auch bei klebender alter ID -> ein noch
		// aufliegender, vom Browser ge-cancelter Finger greift sofort wieder.
		stickId = e.pointerId;
		window.__ts_stick_active = true;
		duckMaxLen = 0;
		if (duckTimer) clearTimeout(duckTimer);
		duckTimer = setTimeout(function(){
			duckTimer = 0;
			if (stickId !== null && duckMaxLen < 0.28){       // Deadzone nie verlassen = bewusstes Halten
				sendKey('keydown', 18, 'AltLeft');            // LALT-Tap = impulse 30 (Haltung)
				sendKey('keyup', 18, 'AltLeft');
				if (navigator.vibrate) try { navigator.vibrate(30); } catch(err){}
			}
		}, DUCK_HOLD_MS);
		stickCompute(e.clientX, e.clientY);
	});
	// window-weit lauschen (kein Capture): Finger wird auch ausserhalb der Box verfolgt.
	window.addEventListener('pointermove', function(e){
		if (stickId === null || e.pointerId !== stickId) return;
		e.preventDefault();
		stickCompute(e.clientX, e.clientY);
	}, { passive:false });
	function stickEnd(e){
		if (stickId === null || (e && e.pointerId !== stickId)) return;
		resetStick();
	}
	window.addEventListener('pointerup', stickEnd);
	window.addEventListener('pointercancel', stickEnd);
	window.addEventListener('lostpointercapture', stickEnd);

	// Watchdog (120ms): heilt verschluckte pointermoves, re-presst Tasten nach
	// einem Soft-Release und ADOPTIERT einen lebenden Stick-Finger, dessen
	// Besitz durch einen Hard-Release verloren ging.
	setInterval(function(){
		if (stickId !== null){
			var p = activePtrs.get(stickId);
			if (!p) resetStick();                             // Finger ist real weg
			else stickCompute(p.x, p.y);
		} else {
			var adoptId = null, adopt = null;
			activePtrs.forEach(function(pp, id){ if (adopt === null && pp.onStick){ adoptId = id; adopt = pp; } });
			if (adopt && inGame){
				stickId = adoptId;
				window.__ts_stick_active = true;
				stickCompute(adopt.x, adopt.y);
			}
			else if (held.w || held.a || held.s || held.d)
				applyDirs({ w:false, s:false, a:false, d:false });
		}
		flushPendingResize();
	}, 120);

	// --- Sichtbarkeit: HUD nur im Spiel (TSUI-Print-Bruecke) + Querformat.
	// M1: Hide laeuft ueber visibility (nicht display) und ist 500ms debounced ->
	// ein transienter Portrait-/Menue-Blip toetet den Stick nicht mehr. Input
	// wird nur bei NACHHALTIGEM Hide freigegeben (soft), nie hart resettet. ---
	var inGame = false, bridgeSeen = false, hintsShown = false;
	var hideTimer = 0;
	ui.style.display = 'block';                // Sichtbarkeit laeuft ab jetzt ueber visibility
	ui.style.visibility = 'hidden';
	function releaseKeys(){
		// Soft-Release: Engine-Tasten loslassen; stickId/Registry BLEIBEN ->
		// ein noch aufliegender Finger wird vom Watchdog nahtlos re-presst.
		applyDirs({ w:false, s:false, a:false, d:false });
		for (var j = 0; j < releasers.length; j++){ try { releasers[j](); } catch(err){} }
	}
	function releaseAll(){
		// Hard-Release: Finger sind sicher weg (App-Wechsel, pagehide).
		releaseKeys();
		resetStick();
		activePtrs.clear();
	}
	function applyVisibility(){
		var portrait = window.matchMedia('(orientation: portrait)').matches;
		var show = inGame && !portrait;
		if (show){
			if (hideTimer){ clearTimeout(hideTimer); hideTimer = 0; }
			ui.style.visibility = 'visible';
		} else if (!hideTimer){
			hideTimer = setTimeout(function(){
				hideTimer = 0;
				ui.style.visibility = 'hidden';
				releaseKeys();
			}, 500);
		}
	}
	window.TS_CTRL = {
		setInGame: function(b){
			bridgeSeen = true; b = !!b;
			if (b && !hintsShown){
				hintsShown = true;
				setTimeout(function(){ if (inGame) showHints(false); }, 4000);
			}
			if (!b && hintsEl) hintsEl.style.display = 'none';   // Hints beschreiben In-Game-Controls
			if (inGame === b) return;
			inGame = b;
			applyVisibility();
		},
		applyVisibility: applyVisibility,
		releaseAll: releaseAll
	};
	applyVisibility();   // Boot -> Hauptmenue: HUD aus, bis die Engine "im Spiel" meldet.

	// Fokus-Handling: Engine ruft window.focus() bei jedem mousedown/cbufadd ->
	// blur ist (v. a. im iframe) Dauerrauschen. Nur bei ECHTEM Fokusverlust
	// soft-releasen; hart nur, wenn die Seite wirklich in den Hintergrund geht.
	window.addEventListener('blur', function(){
		setTimeout(function(){ if (!document.hasFocus()) releaseKeys(); }, 0);
	});
	window.addEventListener('pagehide', releaseAll);
	document.addEventListener('visibilitychange', function(){ if (document.hidden) releaseAll(); });

	// Ausfallsicherung: sollte die QuakeC-Print-Bruecke je fehlen, HUD trotzdem
	// einblenden sobald das Spiel laeuft -> Steuerung geht nie komplett verloren.
	setTimeout(function failopen(){
		if (bridgeSeen) return;
		if (window.Module && Module.began){ inGame = true; applyVisibility(); return; }
		setTimeout(failopen, 2000);
	}, 10000);

	// --- Soak-Hook + Debug-Overlay (?tsdebug=1 oder localStorage.ts_debug=1) ---
	window.__ts_state = function(){
		return { stickId: stickId, held: { w:held.w, a:held.a, s:held.s, d:held.d },
			inGame: inGame, hasFocus: document.hasFocus(), ptrs: activePtrs.size,
			vis: ui.style.visibility, sprint: stick.classList.contains('sprint') };
	};
	(function(){
		var dbgOn = false;
		try { dbgOn = /[?&]tsdebug=1/.test(location.search) || localStorage.getItem('ts_debug') === '1'; } catch(e){}
		if (!dbgOn) return;
		var d = document.createElement('div');
		d.style.cssText = 'position:fixed;left:4px;bottom:4px;z-index:99;background:rgba(0,0,0,0.72);color:#7f7;font:10px/1.4 monospace;padding:3px 6px;pointer-events:none;white-space:pre';
		document.body.appendChild(d);
		setInterval(function(){
			var s = window.__ts_state();
			d.textContent = 'stick:' + s.stickId + ' ptrs:' + s.ptrs +
				' wasd:' + (s.held.w?'W':'-') + (s.held.a?'A':'-') + (s.held.s?'S':'-') + (s.held.d?'D':'-') +
				' inGame:' + (s.inGame?1:0) + ' focus:' + (s.hasFocus?1:0) +
				' vis:' + s.vis + (s.sprint ? ' SPRINT' : '');
		}, 250);
	})();
})();
    </script>  
  </body>
</html>

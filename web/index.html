// ---- Server beitreten ----
// Die Engine kann auf dem Handy keine Texteingabe: ihre Eingabefelder haengen an
// einer Tastatur, die es dort nicht gibt. Ein HTML-input kann es -- samt
// Systemtastatur. Deshalb liegt der Beitritt in der Shell, das Menue schickt
// nur den Marker TSUI:open:join.
//
// Es gibt (noch) keinen Server, zu dem man sich verbinden koennte -- der Weg
// existiert fuer den Fall, dass jemand einen betreibt.
var TS_JOIN = {
	SCHLUESSEL: 'ts_letzte_adresse',

	// Die Adresse wandert in eine Konsolenzeile, und tsCmd fuehrt JEDE aus.
	// Erlaubt ist nur, was eine Serveradresse sein kann -- kein Leerzeichen,
	// kein Semikolon, kein Zeilenumbruch.
	gueltig: function(a){
		a = String(a || '');
		// Raum am eigenen Vermittler: fuehrender Schraegstrich, sonst nichts.
		// Die RELATIVE Form ist Pflicht. `connect rtc://host/raum` erzeugt in
		// der Engine einen ANDEREN Raumnamen als der Gastgeber registriert
		// (sie haengt den Pfad ein zweites Mal an) -- am 2026-08-24 aus dem
		// Quelltext gelesen und mit der relativen Form gegengeprueft.
		//
		// Das alte Muster hat genau diese Form ABGEWIESEN: es verlangte
		// mindestens ein Zeichen vor jedem Schraegstrich. Der einzige Weg,
		// der nachweislich funktioniert, war also gesperrt.
		if (/^\/[A-Za-z0-9_\-]{1,32}$/.test(a)) return true;
		return /^(wss?:\/\/)?[A-Za-z0-9.\-]{1,253}(:\d{1,5})?(\/[A-Za-z0-9._~\-\/]*)?$/.test(a);
	},

	zeigen: function(){
		var el = document.getElementById('joinui'); if (!el) return;
		var f  = document.getElementById('join-adr');
		try { f.value = localStorage.getItem(this.SCHLUESSEL) || ''; } catch(e){}
		// Wer ueber einen Einladungslink kam, soll den Code nicht suchen
		// muessen -- er schlaegt die zuletzt getippte Adresse.
		if (window.__ts_raumEinladung) f.value = window.__ts_raumEinladung;
		document.getElementById('join-fehler').textContent = '';
		el.style.display = 'flex';
		setTimeout(function(){ try { f.focus(); } catch(e){} }, 60);
	},

	schliessen: function(){
		var el = document.getElementById('joinui'); if (el) el.style.display = 'none';
	},

	// Ein Code sieht aus wie ABC-234: Buchstaben ohne 0/O, 1/I/L und 5/S, weil
	// genau die beim Vorlesen und Abtippen verwechselt werden.
	istCode: function(e){ return /^[A-Za-z2-9\- ]{4,14}$/.test(String(e || '')) && !/[:\/.]/.test(e); },

	verbinden: async function(){
		var f  = document.getElementById('join-adr');
		var fe = document.getElementById('join-fehler');
		var e  = (f.value || '').trim();
		if (!e) return;

		var adresse = e;

		// Ein kurzer Code kann ZWEIERLEI sein:
		//
		//  1. Der Raum eines Freundes, der gerade im Browser anbietet. Dann
		//     IST der Code die Adresse -- der Gastgeber hat ihn als
		//     sv_public "/<code>" beim Vermittler angemeldet, und `connect
		//     /<code>` trifft genau diesen Raum. Dafuer braucht es kein
		//     Backend, und das ist der haeufige Fall.
		//  2. Ein eingetragener Dauer-Server. Den kennt nur die API.
		//
		// Deshalb erst nachschlagen, dann direkt verbinden. Kennt die API den
		// Code nicht (404) oder ist gar keine Verbindung da, ist das KEIN
		// Fehler mehr, sondern der Normalfall -- frueher endete der Beitritt
		// hier mit "Diesen Code kennt niemand".
		if (this.istCode(e)) {
			var code = e.toUpperCase().replace(/[^A-Z2-9]/g, '');
			adresse = '/' + code;              // Rueckfall: der Raum selbst
			fe.textContent = T('joinLook');
			try {
				var r = await fetch('/api/spiel/' + encodeURIComponent(code),
					{ credentials: 'omit', signal: AbortSignal.timeout(2500) });
				if (r.ok) {
					var d = await r.json();
					if (d && d.adresse) adresse = d.adresse;
				}
			} catch (err) { /* offline oder unbekannt -> Raum direkt versuchen */ }
		}

		// Auch die vom Server gelieferte Adresse wird geprueft: sie wandert in
		// eine Konsolenzeile, und tsCmd fuehrt JEDE aus.
		if (!this.gueltig(adresse)) { fe.textContent = T('joinBad'); return; }

		try { localStorage.setItem(this.SCHLUESSEL, e); } catch(e2){}
		fe.textContent = '';        // "wird nachgeschlagen" nicht stehen lassen
		this.schliessen();
		// Auch der Gast merkt sich den Raumcode: solange das Einstiegsfenster
		// offen ist, kann er selbst noch jemanden nachholen. Nur bei einem
		// echten Raum (/CODE), nicht bei einer Serveradresse.
		if (window.TS_LOBBY && /^\/[A-Z2-9]{4,12}$/.test(adresse))
			TS_LOBBY.code = adresse.slice(1);
		if (window.TS_JOIN) TS_JOIN.alsGast = true;   // wir sind hier nicht der Server
		if (window.tsCmd) tsCmd('connect ' + adresse + '\n');
	},

	start: function(){
		var self = this;
		var los = document.getElementById('join-los');
		var zu  = document.getElementById('join-zu');
		var f   = document.getElementById('join-adr');
		if (los) los.addEventListener('click', function(){ self.verbinden(); });
		if (zu)  zu.addEventListener('click',  function(){ self.schliessen(); });
		if (f)   f.addEventListener('keydown', function(e){ if (e.key === 'Enter') self.verbinden(); });
	}
};

// ---- Kurzmeldung ----------------------------------------------------------
// Es gab bisher keine Stelle fuer "das ist gerade passiert". Ein aus der Runde
// Entfernter sah nur die Engine-Meldung "oh noes! something bad happened!".
function tsHinweis(text, ms){
	var t = document.getElementById('toast'); if (!t) return;
	t.textContent = text;
	t.classList.add('an');
	clearTimeout(tsHinweis._u);
	tsHinweis._u = setTimeout(function(){ t.classList.remove('an'); }, ms || 5000);
}

// ---- Wer ist da? ----------------------------------------------------------
// Die Zeilen kommen als TSUI:mprow:<slot>|<punkte>|<downs>|<zuschauer>|<name>.
// Der Name steht ganz HINTEN, weil er ein '|' enthalten KANN -- am Ende kann
// er nichts verschieben, der Rest wird einfach wieder zusammengefuegt.
var TS_SPIELER = {
	zeilen: {},          // slot -> {punkte, downs, zuschauer, name}
	ich: null,           // eigener Slot

	auf: function(roh){
		var p = String(roh).split('|');
		if (p.length < 5) return;
		var slot = +p[0];
		if (!(slot >= 0 && slot < 8)) return;
		// Feld 4 ist ein Bitfeld: 1 = schaut zu, 2 = das bin ich, 4 = liegt am
		// Boden. Ein eigenes Feld dafuer haette den Namen weiter nach hinten
		// geschoben, ohne etwas zu gewinnen.
		var f = +p[3] || 0;
		this.zeilen[slot] = {
			punkte: +p[1] || 0, downs: +p[2] || 0,
			zuschauer: (f & 1) !== 0,
			unten: (f & 4) !== 0,
			name: p.slice(4).join('|').slice(0, 40)   // alles ab Feld 5 ist Name
		};
		if (f & 2) this.ich = slot;
		var el = document.getElementById('spielerui');
		if (el && el.style.display === 'flex') this.zeichnen();
	},

	// Die Liste kommt vollstaendig und in kurzen Abstaenden. Meldet sich
	// jemand nicht mehr, ist er weg -- dann wird neu aufgebaut statt geraten.
	abgleichen: function(anzahl){
		if (Object.keys(this.zeilen).length > anzahl) this.zeilen = {};
	},

	zeigen: function(){
		var el = document.getElementById('spielerui'); if (!el) return;
		this.zeichnen(); el.style.display = 'flex';
	},
	schliessen: function(){
		var el = document.getElementById('spielerui'); if (el) el.style.display = 'none';
	},

	zeichnen: function(){
		var box = document.getElementById('pl-liste'); if (!box) return;
		box.innerHTML = '';
		var self = this;
		var slots = Object.keys(this.zeilen).map(Number).sort(function(a,b){ return a-b; });
		if (!slots.length){
			var p = document.createElement('p');
			p.className = 'br-leer'; p.textContent = T('plNone');
			box.appendChild(p); return;
		}
		slots.forEach(function(slot){
			var d = self.zeilen[slot];
			var z = document.createElement('div'); z.className = 'pl-zeile';
			var n = document.createElement('span'); n.className = 'pl-name';
			// textContent: ein Spielername ist Daten, kein Markup.
			n.textContent = d.name || ('Spieler ' + (slot + 1));
			z.appendChild(n);
			if (slot === self.ich){
				var i = document.createElement('span'); i.className = 'pl-ich';
				i.textContent = T('plYou'); z.appendChild(i);
			}
			var w = document.createElement('span'); w.className = 'pl-wert';
			// Wer JETZT am Boden liegt, steht vor allem anderen: die Liste
			// zeigte bisher Punkte und die ZAHL der Stuerze -- also Geschichte.
			// Der einzige Eintrag, der eine sofortige Handlung verlangt, fehlte.
			// Nach 30 Sekunden ist ein Gefallener endgueltig unten.
			if (d.unten) w.classList.add('pl-unten');
			w.textContent = d.unten ? T('plDown')
				: (d.zuschauer ? T('plSpec')
				: (d.punkte + ' P' + (d.downs ? ' \u00b7 ' + d.downs + ' K.O.' : '')));
			z.appendChild(w);
			// Entfernen darf nur der Gastgeber, und nie sich selbst.
			if (window.TS_LOBBY && TS_LOBBY.aktiv && slot !== self.ich){
				var b = document.createElement('button');
				b.type = 'button'; b.className = 'pl-raus';
				b.textContent = T('plKick');
				b.addEventListener('click', function(){ self.entfernen(slot); });
				z.appendChild(b);
			}
			box.appendChild(z);
		});
	},

	entfernen: function(slot){
		if (!(slot >= 0 && slot < 8)) return;      // landet in einer Konsolenzeile
		if (!window.TS_LOBBY || !TS_LOBBY.aktiv) return;
		// `clientkick` ist am 2026-08-29 an einer echten Zweier-Runde geprueft:
		// der Gast fliegt, die Spielerzahl geht zurueck auf 1.
		if (window.tsCmd) tsCmd('clientkick ' + slot + '\n');
		delete this.zeilen[slot];
		this.zeichnen();
	},

	start: function(){
		var self = this;
		var an = function(id, fn){ var e = document.getElementById(id); if (e) e.addEventListener('click', fn); };
		an('pl-zu', function(){ self.schliessen(); });
		an('lb-spieler', function(){ self.zeigen(); });
		an('gs-spieler', function(){
			var g = document.getElementById('gearsheet'); if (g) g.classList.remove('an');
			self.zeigen();
		});
		// Die Beschriftung EINMAL, nicht je Zustand. Als sie nur im
		// Lobby-Zustand gesetzt wurde, stand im Einstiegsfenster und beim
		// Zuschauen ein LEERER Knopf in der Leiste.
		var b = document.getElementById('lb-spieler');
		if (b) b.textContent = T('plBtn');
	}
};

// ---- Offene Runden --------------------------------------------------------
// Die Liste zeigt AUSSCHLIESSLICH echte Raeume: offen, kuerzlich gesehen, mit
// freiem Platz. Erfundene Eintraege gaebe es hier nie -- wer darauf tippt,
// liefe in eine Verbindung, die nicht zustande kommt, und das ist kein
// belebtes Spiel, sondern ein kaputtes. Ist nichts da, sagt der Leerzustand
// genau das und bietet den einzigen Weg an, der dann hilft: selbst anbieten.
var TS_BROWSE = {
	zeigen: function(){
		var el = document.getElementById('browseui'); if (!el) return;
		el.style.display = 'flex';
		this.laden();
	},
	schliessen: function(){
		var el = document.getElementById('browseui'); if (el) el.style.display = 'none';
	},

	laden: async function(){
		var box = document.getElementById('browse-liste'); if (!box) return;
		box.innerHTML = '<p class="br-leer">' + T('browseLoad') + '</p>';
		// Der iframe-Spiegel spricht bewusst nie mit der API (TS_ORIGIN_OK).
		if (!TS_ORIGIN_OK){ this.leer(T('browseErr')); return; }
		try {
			var r = await fetch('/api/raeume', { credentials: 'omit',
				signal: AbortSignal.timeout(6000) });
			if (!r.ok) throw new Error('http ' + r.status);
			var d = await r.json();
			this.zeichnen((d && d.raeume) || []);
		} catch(e){ this.leer(T('browseErr')); }
	},

	leer: function(text){
		var box = document.getElementById('browse-liste');
		if (box) box.innerHTML = '<p class="br-leer">' +
			String(text).split('\n').map(function(z){
				return z.replace(/[&<>]/g, function(c){
					return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]; }); }).join('<br>') + '</p>';
	},

	zeichnen: function(raeume){
		var box = document.getElementById('browse-liste'); if (!box) return;
		if (!raeume.length){ this.leer(T('browseEmpty')); return; }
		box.innerHTML = '';
		var self = this;
		raeume.forEach(function(r){
			// Jede Zeile ist ein echter <button>: sonst waere die Liste per
			// Tastatur unerreichbar -- derselbe Fehler wie einst im Start-Gate.
			var b = document.createElement('button');
			b.type = 'button'; b.className = 'br-zeile';
			var name = document.createElement('span');
			name.className = 'br-name';
			// textContent, nicht innerHTML: Name und Gastgeber kommen von
			// einem fremden Spieler und sind Daten, kein Markup.
			//
			// `name` traegt den deutschen KARTENNAMEN -- der Gastgeber schickt
			// ihn beim Eintragen mit (TS_WEITER.name aus TSUI:rname). Eine
			// eigene Zuordnung bsp -> Anzeigename in der Shell waere die
			// vierte Kopie derselben Liste; die Doppelung von wip_maps ist
			// schon eine zu viel.
			name.textContent = r.name || ('RAUM ' + r.code);
			var karte = document.createElement('span');
			karte.className = 'br-karte';
			karte.textContent = r.host_name || '';
			var runde = document.createElement('span');
			runde.className = 'br-runde';
			runde.textContent = (r.status === 'laeuft' && r.runde)
				? T('browseRound').replace('{n}', r.runde) : T('browseWaiting');
			var zahl = document.createElement('span');
			zahl.className = 'br-zahl';
			zahl.textContent = r.spieler + '/' + r.max_spieler;
			b.appendChild(name); b.appendChild(karte); b.appendChild(runde); b.appendChild(zahl);
			b.addEventListener('click', function(){ self.beitreten(r.code); });
			box.appendChild(b);
		});
	},

	beitreten: function(code){
		if (!/^[A-Z2-9]{4,12}$/.test(String(code))) return;   // landet in einer Konsolenzeile
		this.schliessen();
		if (window.TS_LOBBY) TS_LOBBY.code = code;
		if (window.TS_JOIN) TS_JOIN.alsGast = true;   // fremde Runde
		if (window.tsCmd)
			tsCmd('net_ice_broker "' + TS_VERMITTLER + '"\nconnect /' + code + '\n');
	},

	start: function(){
		var self = this;
		var an = function(id, fn){ var e = document.getElementById(id); if (e) e.addEventListener('click', fn); };
		an('browse-neu',  function(){ self.laden(); });
		an('browse-zu',   function(){ self.schliessen(); });
		an('browse-host', function(){ self.schliessen(); if (window.TS_LOBBY) TS_LOBBY.zeigen(); });
	}
};

// ---- Spiel anbieten -------------------------------------------------------
// Der Browser KANN Gastgeber sein -- am 2026-08-24 am gepinnten Build
// gemessen. Die Engine meldet den Raum bei unserem Vermittler an
// (systemd ts-broker hinter nginx), ein zweiter Browser verbindet sich mit
// `connect /<code>`, und danach laeuft das Spiel DIREKT zwischen den beiden.
//
// Warum der Code hier entsteht und nicht im Menue: er muss angezeigt,
// kopiert, geteilt und beim Beitritt wieder gelesen werden. Cvars sind aus
// JS nicht LESBAR -- wer ihn anzeigen soll, muss ihn also besitzen. Die Shell
// erzeugt ihn, schiebt ihn als `ts_raum` in die Engine und ruft `ts_koop`;
// Menu_StartCoop baut daraus sv_public "/<code>".
var TS_LOBBY = {
	// Dasselbe Alphabet wie server/scripts/spielserver-anmelden.mjs: ohne
	// O, I, L, S, 0 und 1 -- von jedem am Telefon verwechselbaren Paar bleibt
	// genau einer uebrig. Die 5 darf deshalb bleiben, das S ist ja fort.
	// 30^6 = 729 Millionen Codes; fuer einen Raum, der eine Partie lang lebt,
	// reichlich.
	ALPHABET: 'ABCDEFGHJKMNPQRTUVWXYZ23456789',
	code: null,
	aktiv: false,          // wir bieten gerade an
	oeffentlich: false,    // in der oeffentlichen Liste sichtbar?
	raumToken: null,       // fuer Herzschlag und Schliessen
	nameGemeldet: false,   // Kartenname schon nachgetragen?

	erzeugen: function(){
		var a = this.ALPHABET, c = '', i;
		// crypto statt Math.random: der Code ist zwar kein Geheimnis, aber ein
		// vorhersagbarer waere ein Weg in fremde Runden.
		var r = new Uint32Array(6);
		(window.crypto || window.msCrypto).getRandomValues(r);
		for (i = 0; i < 6; i++) c += a.charAt(r[i] % a.length);
		return c;
	},

	// ABC-234 liest sich am Telefon besser als ABC234.
	huebsch: function(c){ return c ? c.slice(0, 3) + '-' + c.slice(3) : ''; },
	link: function(){
		return location.origin + location.pathname + '?raum=' + this.huebsch(this.code);
	},

	zeigen: function(){
		var el = document.getElementById('lobbyui'); if (!el) return;
		if (!this.code) this.code = this.erzeugen();
		this.codeZeichnen();
		document.getElementById('raum-meldung').textContent = '';
		this.schalterZeichnen();
		this.reiter('code');
		el.style.display = 'flex';
		var b = document.getElementById('raum-los');
		setTimeout(function(){ try { b.focus(); } catch(e){} }, 60);
	},

	// Jedes Zeichen einzeln, leicht versetzt: der Code wird empfangen, nicht
	// hingeschrieben. Reine Deko -- ohne die Animation steht derselbe Text da,
	// und bei prefers-reduced-motion ist sie per CSS abgeschaltet.
	codeZeichnen: function(){
		var el = document.getElementById('raum-code'); if (!el) return;
		var t = this.huebsch(this.code);
		el.textContent = '';
		// Fuer Vorlesewerkzeuge bleibt der Code EIN Wort -- 7 einzelne
		// Buchstaben-Elemente wuerden sie ihn buchstabieren lassen.
		el.setAttribute('aria-label', t.split('').join(' '));
		for (var i = 0; i < t.length; i++){
			var sp = document.createElement('span');
			sp.textContent = t.charAt(i);
			sp.style.animationDelay = (i * 55) + 'ms';
			el.appendChild(sp);
		}
	},

	schliessen: function(){
		var el = document.getElementById('lobbyui'); if (el) el.style.display = 'none';
	},

	melden: function(k){
		var m = document.getElementById('raum-meldung'); if (m) m.textContent = T(k);
	},

	// --- Was fuer eine Runde? ------------------------------------------------
	// Der Gastgeber stellt sie ein, nicht jeder fuer sich: es ist SEIN Server,
	// und beim Beitretenden wirken diese Cvars gar nicht. Bisher lagen sie in
	// einem eigenen Engine-Menue, das man nur ueber die Lobby fand -- und dort
	// haengt jede Eingabe an einer Tastatur, die es auf dem Handy nicht gibt.
	//
	// Datengetrieben wie TS_SET: eine neue Option ist eine Zeile in dieser
	// Liste, kein neues Markup. Jede kennt ihre Cvar, ihre Werte und ihre
	// Beschriftung.
	//
	// Modus 1 (GRIEF) fehlt mit Absicht: menu_gset.qc setzt dort sofort
	// sv_gamemode 2, der Eintrag verspricht also etwas anderes, als er startet.
	EINST: [
		{ cvar: 'sv_difficulty', label: 'hpDiff', werte: [0,1,2,3],
		  text: function(v){ return T('hpD' + v); } },
		{ cvar: 'sv_gamemode',   label: 'hpMode', werte: [0,2,3,4,5,6],
		  text: function(v){ return T('hpM' + v); } },
		{ cvar: 'sv_magic',      label: 'hpMagic', hinweis: 'hpMagicHint', werte: [1,0],
		  text: function(v){ return v ? T('hpOn') : T('hpOff'); } },
		{ cvar: 'sv_fastrounds', label: 'hpFast', werte: [0,1],
		  text: function(v){ return v ? T('hpOn') : T('hpOff'); } },
		// KI-Mitspieler gehoeren an diese Stelle, weil hier die Runde
		// eingestellt wird. Der WERT gehoert aber weiterhin TS_SET, nicht der
		// Lobby: `set` statt `cvar` sagt genau das. Zwei Speicher fuer dieselbe
		// Cvar waeren kein Detail -- TS_SET.allesAnwenden schreibt bei JEDEM
		// TSUI:game und gewaenne jedes Mal; die Lobby-Einstellung waere still
		// wirkungslos. Genau diese Falle hat am 2026-08-30 einen gruenen Test
		// ohne Codeaenderung rot gemacht (Footgun 40).
		{ set: 'bots', label: 'hpBots', hinweis: 'hpBotsHint', werte: [0,1,2,3],
		  text: function(v){ return v ? String(v) : T('hpOff'); } }
	],
	// Cvars sind aus JS NICHT lesbar -- localStorage ist auch hier die
	// Wahrheit, und alles wird beim Start der Runde erneut geschrieben.
	einstLesen: function(e){
		if (e.set) return Number(TS_SET.wert(TS_SET.defs.find(function(d){ return d.id === e.set; })));
		try {
			var v = localStorage.getItem('ts_h_' + e.cvar);
			if (v !== null && e.werte.indexOf(+v) >= 0) return +v;
		} catch(x){}
		return e.werte[0];
	},
	einstSchreiben: function(e, v){
		if (e.set){
			TS_SET.setzen(TS_SET.defs.find(function(d){ return d.id === e.set; }), v);
			return;
		}
		try { localStorage.setItem('ts_h_' + e.cvar, String(v)); } catch(x){}
	},
	einstZeichnen: function(){
		var box = document.getElementById('hp-set'); if (!box) return;
		box.innerHTML = '';
		var self = this;
		this.EINST.forEach(function(e){
			var v = self.einstLesen(e);
			var z = document.createElement('div'); z.className = 'set-row';
			var l = document.createElement('label');
			l.textContent = T(e.label);
			if (e.hinweis){
				var kl = document.createElement('span');
				kl.className = 'hp-hinweis'; kl.textContent = T(e.hinweis);
				l.appendChild(document.createElement('br')); l.appendChild(kl);
			}
			var b = document.createElement('button');
			b.type = 'button'; b.className = 'set-schalter hp-wert';
			b.textContent = e.text(v);
			b.setAttribute('aria-label', T(e.label) + ': ' + e.text(v));
			b.addEventListener('click', function(){
				// Durchtippen statt Regler: auf dem Handy ist ein Regler mit
				// vier Rasten schwerer zu treffen als ein Knopf.
				var i = e.werte.indexOf(self.einstLesen(e));
				var nv = e.werte[(i + 1) % e.werte.length];
				self.einstSchreiben(e, nv);
				self.einstZeichnen();
			});
			z.appendChild(l); z.appendChild(b);
			box.appendChild(z);
		});
	},
	// Beim Start der Runde in EINEM tsCmd -- jeder cbufadd loest window.focus()
	// aus.
	einstBefehl: function(){
		var self = this, zeilen = '';
		// Nur echte Cvar-Zeilen. Ein `set`-Eintrag wird von TS_SET geschrieben --
		// hier stuende sonst "undefined 2" in der Konsole.
		this.EINST.forEach(function(e){
			if (e.cvar) zeilen += e.cvar + ' ' + self.einstLesen(e) + '\n';
		});
		return zeilen;
	},
	reiter: function(welche){
		var c = document.getElementById('hp-code'), t = document.getElementById('hp-set');
		if (!c || !t) return;
		c.style.display = (welche === 'code') ? '' : 'none';
		t.style.display = (welche === 'set')  ? '' : 'none';
		if (welche === 'set') this.einstZeichnen();
		var tabs = document.querySelectorAll('#hp-tabs .dtab');
		for (var i = 0; i < tabs.length; i++)
			tabs[i].classList.toggle('active', tabs[i].getAttribute('data-hp') === welche);
	},

	// --- Oeffentliche Sichtbarkeit ------------------------------------------
	// Vorgabe AUS. Wer mit Freunden spielt, will nicht, dass Fremde
	// hereinschneien -- und der Code allein reicht dafuer voellig. Eintragen
	// braucht ein Konto, weil sonst niemand fuer den Eintrag geradesteht;
	// angelegt wird es genau hier, aus einer ausdruecklichen Handlung heraus.
	schalterZeichnen: function(){
		var l = document.getElementById('raum-oeff-label');
		var b = document.getElementById('raum-oeff');
		if (!l || !b) return;
		l.textContent = T('hostPublic');
		b.textContent = this.oeffentlich ? T('hostPublicOn') : T('hostPublicOff');
		b.classList.toggle('an', this.oeffentlich);
		b.setAttribute('aria-pressed', this.oeffentlich ? 'true' : 'false');
		// Im iframe-Spiegel gibt es keine API -- dann ist der Schalter eine
		// Zusage, die niemand halten kann.
		var z = document.getElementById('raum-oeff-zeile');
		if (z) z.style.display = TS_ORIGIN_OK ? 'flex' : 'none';
	},

	oeffentlichSchalten: async function(){
		if (!TS_ORIGIN_OK) return;
		if (this.oeffentlich){                       // ausschalten: Eintrag zurueckziehen
			this.oeffentlich = false; this.schalterZeichnen();
			await this.listeSchliessen();
			return;
		}
		this.melden('browseLoad');
		try {
			if (!TS_API.hatKonto()) { this.melden('hostPublicNeedsAcc'); await TS_API.kontoAnlegen(); }
			await this.eintragen();
			this.oeffentlich = true;
			var m = document.getElementById('raum-meldung'); if (m) m.textContent = '';
		} catch(e){
			this.oeffentlich = false;
			if (e && e.message === 'abgelehnt'){ var mm = document.getElementById('raum-meldung'); if (mm) mm.textContent = ''; }
			else this.melden('browseErr');
		}
		this.schalterZeichnen();
	},

	// Eintragen und auffrischen sind derselbe Aufruf -- der Server macht
	// daraus ein Einfuegen oder eine Aktualisierung.
	eintragen: async function(spieler, runde){
		var j = await TS_API.call('/raum', { method: 'POST', body: {
			code: this.code,
			// Der deutsche Kartenname kommt aus TSUI:rname -- eine eigene
			// bsp->Name-Zuordnung in der Shell waere die vierte Kopie
			// derselben Liste.
			name: (window.TS_WEITER && TS_WEITER.name) || null,
			map_key: (window.TS_RUN && TS_RUN.cfg && TS_RUN.cfg.map_key) || null,
			max_spieler: 4,
			spieler: spieler || 1,
			runde: runde || 0
		}});
		// Nur beim ERSTEN Eintragen liefert der Server ein Token; beim
		// Auffrischen behalten wir unseres. Ein Ueberschreiben mit undefined
		// haette genau das Schliessen kaputtgemacht.
		if (j && j.raum_token) this.raumToken = j.raum_token;
		return j;
	},

	// Herzschlag: ohne ihn faellt der Raum nach zwei Minuten aus der Liste --
	// das ist Absicht, damit dort keine Runden stehen, die es nicht mehr gibt.
	stand: async function(spieler, runde, laeuft){
		if (!this.oeffentlich || !this.raumToken || !this.code) return;
		try {
			await TS_API.call('/raum/' + this.code, { method: 'PATCH',
				headers: { 'X-Raum-Token': this.raumToken },
				body: { spieler: spieler, runde: runde, status: laeuft ? 'laeuft' : 'offen' } });
		} catch(e){ /* eine verpasste Meldung ist kein Grund, das Spiel zu stoeren */ }
	},

	listeSchliessen: async function(){
		if (!this.raumToken || !this.code) return;
		var c = this.code, t = this.raumToken;
		this.raumToken = null;
		try { await TS_API.call('/raum/' + c, { method: 'DELETE', headers: { 'X-Raum-Token': t } }); }
		catch(e){ /* laeuft ohnehin ab */ }
	},

	kopieren: async function(was, meldung){
		try {
			await navigator.clipboard.writeText(was);
			this.melden(meldung);
		} catch(e){
			// Zwischenablage scheitert ohne sicheren Kontext oder ohne Geste.
			// Dann bleibt der Code trotzdem lesbar auf dem Schirm stehen --
			// ein Fehler, der nichts kaputtmacht, muss auch so klingen.
			this.melden('hostNoCopy');
		}
	},

	teilen: async function(){
		var l = this.link();
		if (navigator.share) {
			try { await navigator.share({ title: 'TOTES SIGNAL', text: T('hostHint'), url: l }); return; }
			catch(e){ /* abgebrochen ist kein Fehler */ if (e && e.name === 'AbortError') return; }
		}
		this.kopieren(l, 'hostLinkCopied');
	},

	// Karte waehlen: Code in die Engine, dann in die Koop-Kartenwahl.
	// ALLES in EINEM tsCmd -- jeder cbufadd-Aufruf loest window.focus() aus,
	// und eine Salve davon reisst auf dem Handy den Finger vom Joystick.
	starten: function(){
		if (!this.code) this.code = this.erzeugen();
		this.aktiv = true;
		this.schliessen();
		// ts_lobby haelt Runde 1 an, bis der Gastgeber LOS GEHT'S drueckt.
		// Ohne das haetten Freunde rund elf Sekunden Zeit, den Code
		// einzutippen und die Karte zu laden -- danach waeren sie Zuschauer
		// in ihrer eigenen Runde (PutClientInServer spawnt nur als Spieler,
		// solange `rounds` 0 ist).
		// `set` statt `ts_lobby 1`: die Cvar wird erst vom SERVER-QuakeC
		// registriert, existiert im Menue also noch gar nicht -- und eine
		// unbekannte Cvar ist fuer die Konsole ein unbekannter BEFEHL,
		// lautlos wirkungslos. `set` legt sie an. Derselbe Grund wie bei
		// ts_raum.
		if (window.tsCmd) tsCmd('set ts_raum "' + this.code + '"\nset ts_lobby 1\n' +
			this.einstBefehl() + 'ts_koop\n');
		this.chip();
	},

	// Der Code bleibt waehrend der angebotenen Runde sichtbar -- sonst muesste
	// der Gastgeber das Spiel verlassen, um ihn nachzusehen.
	chip: function(){
		var c = document.getElementById('raumchip'); if (!c) return;
		var imSpiel = document.getElementById('mstart').style.display === 'none';
		c.textContent = T('hostChip') + ' ' + this.huebsch(this.code);
		c.style.display = (this.aktiv && this.code && imSpiel) ? 'block' : 'none';
	},

	// Zustand aus TSUI:mp:<anzahl>|<lobby>. Die Shell kann beides nicht selbst
	// wissen: player_count lebt in CSQC, und ts_lobby steht als Cvar nur auf
	// der Maschine des Gastgebers -- deshalb reist es als serverinfo mit.
	// TSUI:mp:<anzahl>|<lobby>|<runde>|<fenster>|<ichZuschauer>
	//
	// Vier Zustaende, eine Leiste:
	//   1. Lobby        -- Code, Spielerzahl, LOS GEHT'S (nur Gastgeber)
	//   2. Einstieg auf -- Code, Spielerzahl, "Beitritt bis Runde N"
	//   3. Ich schaue zu-- Hinweis, dass es zur naechsten Runde weitergeht
	//   4. sonst        -- Leiste weg, nur der Code-Streifen bleibt
	mp: function(roh){
		var p = String(roh).split('|');
		var n         = +p[0] || 0;
		var inLobby   = (+p[1] === 1);
		var runde     = +p[2] || 0;
		var fenster   = +p[3] || 0;
		var zuschauer = (+p[4] === 1);
		this.spieler = n; this.runde = runde;
		// Wer nicht mehr meldet, ist weg -- dann baut die Liste sich neu auf.
		if (window.TS_SPIELER) TS_SPIELER.abgleichen(n);
		// Stand melden, solange wir selbst anbieten und sichtbar sein wollen.
		if (this.aktiv) {
			// Beim Eintragen war die Karte noch nicht gewaehlt -- der Eintrag
			// hiess deshalb "RAUM WFNYKK" statt "Nacht der Untoten". Sobald
			// der Kartenname da ist, EINMAL neu eintragen (der Endpunkt
			// aktualisiert denselben Code) und danach nur noch Herzschlaege.
			if (this.oeffentlich && !this.nameGemeldet &&
			    window.TS_WEITER && TS_WEITER.name) {
				this.nameGemeldet = true;
				this.eintragen(n, runde).catch(function(){});
			} else {
				this.stand(n, runde, !inLobby);
			}
		}

		var bar  = document.getElementById('lobbybar'); if (!bar) return;
		var chip = document.getElementById('raumchip');
		var code = document.getElementById('lb-code');
		var zahl = document.getElementById('lb-zahl');
		var los  = document.getElementById('lb-los');
		var zeig = function(){ if (chip) chip.style.display = 'none'; bar.classList.add('an'); };

		// 3. Zuschauer: das Wichtigste ist, dass es NICHT kaputt ist. Ohne
		//    diesen Satz sieht der Beitretende eine Kamera, die sich nicht
		//    steuern laesst, und haelt das fuer einen Fehler.
		if (zuschauer) {
			bar.classList.add('gast'); bar.classList.remove('einstieg');
			code.textContent = T('specWait');
			zahl.textContent = n === 1 ? T('lobbyOne') : T('lobbyN').replace('{n}', n);
			zeig(); return;
		}

		// 1. Lobby
		if (inLobby) {
			bar.classList.remove('einstieg');
			code.textContent = this.code ? T('hostChip') + ' ' + this.huebsch(this.code)
			                             : T('lobbyWait');
			zahl.textContent = n === 1 ? T('lobbyOne') : T('lobbyN').replace('{n}', n);
			los.textContent  = T('lobbyGo');
			// Nur der Gastgeber darf starten -- ein Gast, der den Knopf saehe,
			// wuerde ihn druecken, und nichts geschaehe.
			bar.classList.toggle('gast', !this.aktiv);
			zeig(); return;
		}

		// 2. Einstiegsfenster: solange es offen ist, lohnt es sich, den Code
		//    noch zu verschicken. Danach waere die Leiste nur noch Deko.
		if (this.code && runde >= 1 && fenster >= 1 && runde <= fenster) {
			bar.classList.add('gast');        // kein Startknopf mehr
			bar.classList.add('einstieg');
			code.textContent = T('hostChip') + ' ' + this.huebsch(this.code);
			zahl.textContent = (runde === fenster) ? T('joinLast')
			                 : T('joinOpen').replace('{n}', fenster);
			zeig(); return;
		}

		// 4. Alles vorbei -- zurueck zum schmalen Streifen.
		bar.classList.remove('an', 'einstieg');
		this.chip();
	},

	losgehts: function(){
		var bar = document.getElementById('lobbybar');
		if (bar) bar.classList.remove('an');
		if (window.tsCmd) tsCmd('set ts_lobby 0\n');
		this.chip();
	},

	beenden: function(){
		// Erst aus der Liste nehmen, dann vergessen -- sonst steht dort eine
		// Runde, der niemand mehr beitreten kann.
		this.listeSchliessen();
		this.oeffentlich = false; this.nameGemeldet = false;
		this.aktiv = false; this.code = null;
		// Sonst zeigt die Spielerliste in der naechsten Runde die Namen der
		// vorigen -- und "(du)" am falschen Platz.
		if (window.TS_SPIELER){ TS_SPIELER.zeilen = {}; TS_SPIELER.ich = null; }
		var c = document.getElementById('raumchip'); if (c) c.style.display = 'none';
		var bar = document.getElementById('lobbybar'); if (bar) bar.classList.remove('an');
		if (window.tsCmd) tsCmd('set ts_raum ""\nset ts_lobby 0\n');
	},

	start: function(){
		var self = this;
		var an = function(id, fn){ var e = document.getElementById(id); if (e) e.addEventListener('click', fn); };
		an('raum-los',      function(){ self.starten(); });
		an('raum-zu',       function(){ self.schliessen(); });
		an('raum-kopieren', function(){ self.kopieren(self.huebsch(self.code), 'hostCopied'); });
		an('raum-teilen',   function(){ self.teilen(); });
		an('raumchip',      function(){ self.teilen(); });
		an('lb-los',        function(){ self.losgehts(); });
		an('raum-oeff',     function(){ self.oeffentlichSchalten(); });
		var tabs = document.querySelectorAll('#hp-tabs .dtab');
		for (var i = 0; i < tabs.length; i++)
			tabs[i].addEventListener('click', function(){ self.reiter(this.getAttribute('data-hp')); });
		an('lb-code',       function(){ if (self.code) self.teilen(); });

		// Einladungslink: ?raum=ABC-234 fuellt das Beitrittsfeld vor. Ein Code,
		// den man verschicken kann, ist mehr wert als einer, den man abtippt.
		// Geprueft wird er mit demselben Muster wie eine Eingabe von Hand --
		// er wandert am Ende in eine Konsolenzeile.
		try {
			var q = new URLSearchParams(location.search).get('raum');
			if (q && window.TS_JOIN && TS_JOIN.istCode(q)){
				var f = document.getElementById('join-adr');
				if (f) f.value = q;
				window.__ts_raumEinladung = q;
			}
		} catch(e){}
	}
};
TS_JOIN.start();
TS_LOBBY.start();
TS_BROWSE.start();
TS_SPIELER.start();

// ---- Weiterspielen: der letzte Lauf als Ein-Tipp-Angebot im Start-Gate ----
// Ein Wiederkehrer brauchte bisher fuenf Interaktionen und zwei Wartezeiten bis
// zur naechsten Runde: Gate, Laden, SOLO, Karte, Lobby, SPIEL STARTEN, 6-s-
// Countdown. Aus TSUI:rstart kennt die Shell Karte, Schwierigkeit, Modus,
// Startrunde und Flags -- das genuegt, um denselben Lauf direkt aufzusetzen.
var TS_WEITER = {
	SCHLUESSEL: 'ts_letzter_lauf',
	name: '',        // aus TSUI:rname, kommt VOR rstart
	offen: false,    // Spieler hat WEITERSPIELEN getippt, Engine laedt noch

	// Karten, die es in game.pk3 gibt, die aber nicht ausgeliefert sind.
	// BEWUSSTE DOPPELUNG von wip_maps[] in quakec/source/menu/defs/menu_defs.qc:
	// die Shell kann die QC-Tabelle nicht lesen, und ohne diese Liste boete
	// WEITERSPIELEN weiter eine Karte an, die das Menue daneben sperrt. Wer
	// dort etwas aendert, muss es hier nachziehen.
	WIP: ['b1oodv3', 'hangar', 'fegefeuer', '4all', 'loop', 'dung3on',
	      'b1oodv4', 'bunker-defense', 'wahnsinn', 'boxxer', 'weapon_test'],

	// Ein BSP-Name wandert gleich in eine Konsolenzeile, und tsCmd fuehrt JEDE
	// aus. Nur zulassen, was ueberhaupt ein Dateiname sein kann -- und nichts,
	// was gesperrt ist.
	gueltig: function(k){
		k = String(k || '');
		return /^[a-z0-9_]{1,32}$/.test(k) && this.WIP.indexOf(k) === -1;
	},

	merken: function(roh){
		var p = String(roh).split('|');
		if (!this.gueltig(p[0])) return;
		try {
			localStorage.setItem(this.SCHLUESSEL, JSON.stringify({
				karte: p[0], diff: +p[1] || 0, modus: +p[2] || 0,
				runde: +p[3] || 0, flags: +p[4] || 0,
				name: this.name, zeit: Date.now()
			}));
		} catch(e){}
	},

	lesen: function(){
		try {
			var d = JSON.parse(localStorage.getItem(this.SCHLUESSEL) || 'null');
			return (d && this.gueltig(d.karte)) ? d : null;
		} catch(e){ return null; }
	},

	// Genau das Praefix, das Menu_StartSolo, Menu_Maps_LoadMap und Menu_Lobby
	// setzen. Ohne sv_public/sv_listen_qw erbt ein direktes `map` den zuletzt
	// gesetzten Zustand -- nach einem Ausflug in den Koop-Zweig waere das ein
	// oeffentlich beim Master-Server angemeldeter Listen-Server.
	// Flag-Bits aus ts_flag_bits() (server/main.qc): 1 Kopfschuss, 2 Magie AUS,
	// 4 schnelle Runden.
	befehl: function(d){
		return ['sv_public 0', 'sv_listen_qw 0',
			'sv_gamemode '     + (d.modus | 0),
			'sv_difficulty '   + (d.diff  | 0),
			'sv_startround '   + (d.runde | 0),
			'sv_magic '        + ((d.flags & 2) ? 0 : 1),
			'sv_headshotonly ' + ((d.flags & 1) ? 1 : 0),
			'sv_fastrounds '   + ((d.flags & 4) ? 1 : 0),
			'sv_maxai 24',
			'map ' + d.karte].join('\n') + '\n';
	},

	// Vor dem ersten TSUI:menu nimmt die Engine keine Konsolenbefehle an --
	// deshalb wird der Wunsch gemerkt und erst dort eingeloest.
	einloesen: function(){
		if (!this.offen) return;
		this.offen = false;
		var d = this.lesen(); if (!d) return;
		var self = this;
		setTimeout(function(){ if (window.tsCmd) tsCmd(self.befehl(d)); }, 600);
	},

	// Knopf im Gate bestuecken; gibt zurueck, ob es etwas anzubieten gab.
	anbieten: function(){
		var el = document.getElementById('gate-weiter');
		var d  = this.lesen();
		if (!el || !d) return false;
		el.textContent = T('resume') + (d.name ? '  \u00b7  ' + d.name : '');
		el.style.display = 'inline-block';
		return true;
	}
};

// ---- Pausemenue per Finger bedienbar machen ----
// Im PAUSEMENUE (CSQC) erreicht ein Fingertipp die Menuelogik nicht: die Engine
// behandelt Beruehrungen dort weiter als Blickeingabe des Spiels, nicht als
// Zeiger. Nachgemessen -- ein Mausklick auf WEITERMACHEN loest aus, derselbe
// Punkt als Tipp nicht. Damit war das Pausemenue auf dem Handy vollstaendig
// unbedienbar: kein Weiterspielen, kein Neustart, kein Beenden.
//
// Im Hauptmenue tritt das nicht auf (dort ist menu_active gesetzt und die
// Engine routet Beruehrungen an das Menue). Die Bruecke laeuft deshalb NUR
// waehrend der Pause.
//
// Die Engine haengt ihre Zeiger-Listener am Canvas mit capture; ein Listener auf
// window in derselben Phase laeuft davor und kann das Ereignis abfangen. Der
// Maus-Pfad rechnet ausserdem korrekt von CSS auf Backbuffer um.
var TS_PAUSE = {
	aktiv: false,

	setzen: function(an){
		this.aktiv = !!an;
	},

	_maus: function(typ, x, y, gedrueckt){
		var cv = document.getElementById('canvas'); if (!cv) return;
		cv.dispatchEvent(new MouseEvent(typ, {
			bubbles:true, cancelable:true, view:window,
			button:0, buttons: gedrueckt ? 1 : 0, clientX:x, clientY:y
		}));
	},

	start: function(){
		var self = this;
		function ab(e){
			if (!self.aktiv) return;
			var t = e.changedTouches && e.changedTouches[0]; if (!t) return;
			e.stopPropagation();
			if (e.cancelable) e.preventDefault();

			if (e.type === 'touchstart' || e.type === 'touchmove'){
				self._maus('mousemove', t.clientX, t.clientY, e.type === 'touchmove');
				return;
			}
			// Loslassen: sui braucht zwischen Positionsmeldung und Klick einen
			// Frame, sonst trifft der Klick die Hover-Liste des VORIGEN Bildes.
			var x = t.clientX, y = t.clientY;
			self._maus('mousemove', x, y, false);
			setTimeout(function(){ self._maus('mousedown', x, y, true);
				setTimeout(function(){ self._maus('mouseup', x, y, false); }, 60);
			}, 90);
		}
		['touchstart','touchmove','touchend','touchcancel'].forEach(function(t){
			window.addEventListener(t, ab, {capture:true, passive:false});
		});
	}
};
if (IS_TOUCH) TS_PAUSE.start();

// Das Start-Gate. Es gab es lange nur auf Touch-Geraeten -- am Rechner lief
// `begin()` sofort beim Parsen des Skripts. Damit fehlte dem Desktop ALLES,
// was am Gate haengt: WEITERSPIELEN, der Zugang zum Konto, der Hinweis auf die
// Downloadgroesse und die Wortmarke als Ankunftsmoment. Der Kommentar am
// Konto-Einstieg behauptete sogar, das Gate SEI der Desktop-Weg dorthin --
// es erschien dort nur nie.
//
// Zweiter Grund, der schwerer wiegt: `begin()` laedt die Engine asynchron.
// Ohne vorangehende Nutzergeste entsteht der AudioContext ohne Geste. Auf dem
// Handy war genau das die Ursache fuer stummen Ton; ob es am Rechner
// dieselbe Wirkung hat, ist ungeprueft -- die Geste kostet aber nichts.
//
// Vollbild und Ausrichtungssperre bleiben touch-eigen: am Rechner ist ein
// ungefragter Vollbildwechsel eine Zumutung, und drehen kann man einen
// Monitor ohnehin nicht.
function startGate()
{	var g = document.getElementById('mstart');
	g.style.display = 'flex';
	gateHinweis();
	// Am Rechner tippt niemand. Umgesetzt wird das ATTRIBUT, nicht der Text:
	// applyI18N() faehrt bei jedem Sprachwechsel ueber alle [data-i18n] und
	// wuerde ein gesetztes textContent wieder ueberschreiben.
	if (!IS_TOUCH){
		var pl = g.querySelector('.play[data-i18n="play"]');
		if (pl){ pl.setAttribute('data-i18n', 'playDesk'); pl.textContent = T('playDesk'); }
	}
	// Gate-Loop lazy nachladen (nicht bei reduzierter Bewegung; poster bleibt)
	var v = document.getElementById('gatevid');
	if (v && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){
		v.src = 'img/gate-loop.mp4';
		if (v.play) v.play().catch(function(){});
	}
	TS_WEITER.anbieten();
	var w = document.getElementById('gate-weiter');
	if (w) w.addEventListener('click', function(e){
		// Das GANZE Gate ist klickbar -- ohne das hier wuerde derselbe Tipp
		// zusaetzlich den normalen Start ausloesen.
		e.stopPropagation();
		TS_WEITER.offen = true;
		g.click();
	});

	g.addEventListener('click', function once(){
		g.removeEventListener('click', once);
		g.style.display = 'none';
		if (v){ try { v.pause(); v.removeAttribute('src'); v.load(); } catch(e){} }   // Decoder freigeben
		var ib = document.getElementById('installbtn'); if (ib) ib.style.display = 'none';
		if (IS_TOUCH) enterImmersive();
		begin();
		startDynRes();
		setTimeout(updateOrient, 400);
	});
}

// ---- M9: mobile render scaling (DPR-Cap + dynamische Auflösung) ----
// Nur auf Touch-Geräten; Desktop-Browser behalten volle Qualität. Die Engine
// liest in ihrem window.onresize `scale = window.devicePixelRatio` und rendert
// den Canvas-Backbuffer in CSS-Größe × scale. Auf 3x-Phones = 9× Fragmente.
// Wir cappen NUR devicePixelRatio (per Getter) — die engine-eigene onresize
// (inkl. korrektem FTEC.evcb.resize für Input-Koordinaten) nutzt dann unseren
// Wert. Für dynamische Auflösung ändern wir M9.eff und rufen window.onresize().
var M9 = { on:false, cap:1.5, eff:1.5, dyn:1.5, floor:0.66, tier:'mid', lock:false };
(function(){
	if (!IS_TOUCH) return;
	var dpr   = window.devicePixelRatio || 1;
	var cores = navigator.hardwareConcurrency || 4;
	var mem   = navigator.deviceMemory || 4;
	var tier = 'mid';
	if (cores <= 4 || mem <= 3)          tier = 'low';
	else if (cores >= 8 && mem >= 6)     tier = 'high';
	M9.tier = tier;
	M9.cap  = ({ low:1.0, mid:1.25, high:1.5 })[tier];
	M9.eff  = Math.min(dpr, M9.cap);          // Start: gecappter nativer DPR
	M9.dyn  = M9.eff;                         // zuletzt von der Dyn-Res gewaehlte Stufe
	try {
		Object.defineProperty(window, 'devicePixelRatio', {
			configurable:true, get:function(){ return M9.eff; }
		});
		M9.on = true;
	} catch(e) { M9.on = false; }
})();

// Menue und Pausemenue positionieren den Cursor ABSOLUT. Der Touch-Pfad der
// Engine uebergibt dabei rohe CSS-Koordinaten (t.pageX/t.pageY) an eine
// Schnittstelle, die Backbuffer-Pixel erwartet -- der Maus-Pfad daneben rechnet
// korrekt mit canvas.width/rect.width um. Bei eff != 1 landet jeder Fingertipp
// deshalb bei 1/eff seines wahren Abstands zur linken oberen Canvas-Ecke: bei
// eff 1.5 auf zwei Dritteln. An diesem Build gemessen.
//
// Solange ein Menue offen ist, rendern wir darum 1:1 -- dann sind CSS-Pixel und
// Backbuffer-Pixel dasselbe und der Tipp trifft. Aufloesung ist im Menue
// belanglos; die Dyn-Res-Stufe wird in M9.dyn gemerkt und beim Ruecksprung ins
// Spiel wieder angewandt.
window.__ts_renderMode = function(mode)
{
	if (!M9.on) return;
	M9.lock = (mode === 'menu');
	var wollen = M9.lock ? 1.0 : M9.dyn;
	if (Math.abs(M9.eff - wollen) < 1e-3) return;
	M9.eff = wollen;
	if (typeof window.onresize === 'function') window.onresize();
};

function startDynRes()
{	if (!M9.on) return;
	var STEPS = [1.5, 1.25, 1.0, 0.85, 0.75, 0.66].filter(function(s){ return s <= M9.cap + 1e-3; });
	if (STEPS[STEPS.length-1] > M9.floor) STEPS.push(M9.floor);
	var idx = 0;                              // 0 = höchste (Cap)
	var ema = 60, last = 0, lowSince = 0, highSince = 0;
	function apply(){
		M9.dyn = STEPS[idx];
		// Im Menue rendern wir bewusst 1:1 (siehe __ts_renderMode). Die Stufe
		// wird nur gemerkt und beim naechsten TSUI:game angewandt -- ohne diese
		// Sperre wuerde der Sampler bei hoher Bildrate (im Menue der Normalfall)
		// nach 6 s wieder hochstufen und die Trefferlage erneut verschieben.
		if (M9.lock) return;
		M9.eff = M9.dyn;
		// Nicht mitten in der Beruehrung resizen: ein Canvas-Resize kann ein
		// pointercancel auf JEDEN gehaltenen Finger ausloesen (Joystick UND
		// Look/Feuer) — der beruechtigte "nach paar Sekunden tot"-Bug. Warten,
		// bis kein Finger mehr aufliegt; der Touch-Watchdog holt den Wechsel
		// via flushPendingResize() nach (max. 2s Verzoegerung).
		if (window.__ts_stick_active || (window.__ts_busy && window.__ts_busy())){
			M9.pendingResize = true;
			if (!M9.pendingSince) M9.pendingSince = Date.now();
			return;
		}
		M9.pendingSince = 0;
		if (typeof window.onresize === 'function') window.onresize();  // engine-Resize-Pfad erneut auslösen
	}
	function tick(now){
		if (last){ var dt = now - last; if (dt > 0) ema = ema*0.9 + Math.min(1000/dt, 144)*0.1; }
		last = now;
		if (window.Module && Module.began && document.visibilityState === 'visible'){
			if (ema < 50){ highSince = 0; if (!lowSince) lowSince = now;
				if (now - lowSince > 2000 && idx < STEPS.length-1){ idx++; apply(); lowSince = now; } }
			else if (ema > 58){ lowSince = 0; if (!highSince) highSince = now;
				if (now - highSince > 6000 && idx > 0){ idx--; apply(); highSince = now; } }
			else { lowSince = 0; highSince = 0; }
		}
		requestAnimationFrame(tick);
	}
	requestAnimationFrame(tick);
}

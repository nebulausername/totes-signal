name: Deploy to GitHub Pages (manual only)

on:
  # Manual only. The live game runs on totersignal.de; a push must never
  # publish a second copy of the game assets on GitHub Pages.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QC toolchain deps
        run: pip install pandas fastcrc colorama

      - name: Compile QuakeC -> progs.pk3
        run: tools/build-progs.sh

      - name: Fetch + verify game assets
        run: tools/fetch-assets.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

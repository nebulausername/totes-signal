name: Build game logic

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quakec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QC toolchain deps
        run: pip install pandas fastcrc colorama
      - name: Compile QuakeC -> progs.pk3
        run: tools/build-progs.sh
